asics": "部分的な順序、候補の更新", "takeaway": "読むn件と保持するk件の違い。表の格納先を指すヒープとも区別", "group": 1, "chapters": [8, 12]}, {"id": "nested", "label": "Nested Loop", "basics": "反復、検索の再利用", "takeaway": "外側の件数と内側の探索、loopsが仕事量へ与える影響", "group": 1, "chapters": [9, 10, 12]}, {"id": "hash", "label": "Hash Join", "basics": "ハッシュ表、衝突、照合", "takeaway": "表の準備と照合、メモリ不足による分割処理", "group": 1, "chapters": [9, 10, 12]}, {"id": "merge", "label": "Merge Join", "basics": "順序、二つの列の合流", "takeaway": "並んでいる入力を使える利点と、並べるための準備", "group": 1, "chapters": [9, 10]}, {"id": "aggregate", "label": "HashAggregate", "basics": "グループ化、カウンタ、状態保持", "takeaway": "入力件数とグループ数の違い、保持する状態の大きさ", "group": 1, "chapters": [9, 12]}, {"id": "stats", "label": "統計情報", "basics": "標本、分布、頻度、相関", "takeaway": "行数の見積もりが計画の選択へつながる理由", "group": 0, "chapters": [10, 12]}, {"id": "cost", "label": "コストモデル", "basics": "予測、相対比較、最適化", "takeaway": "costをミリ秒と同一視できない理由、推定の限界", "group": 0, "chapters": [10, 12]}, {"id": "mvcc", "label": "MVCC / スナップショット", "basics": "同時実行、バージョン、時間", "takeaway": "同じ表でも読み手が見られる行が違う理由", "group": 2, "chapters": [11, 12]}, {"id": "vacuum", "label": "VACUUM", "basics": "領域の再利用、メンテナンス", "takeaway": "古いバージョンの回収と、統計更新との役割の違い", "group": 2, "chapters": [11, 12]}, {"id": "visibility", "label": "可視性 / Index Only Scan", "basics": "補助情報、可視性、索引", "takeaway": "必要な列が索引にあっても表への確認が必要な場合", "group": 2, "chapters": [11, 12]}, {"id": "wal", "label": "WAL / checkpoint", "basics": "先行書き込み、耐久性、回復", "takeaway": "メモリ上の変更、ログの永続化、データページの書き出しの違い", "group": 2, "chapters": [11]}, {"id": "precompute", "label": "事前集計", "basics": "事前計算、鮮度、更新責務", "takeaway": "表示時の仕事を減らす代わりに、いつ誰が計算するかを決める", "group": 0, "chapters": [12]}], "chapters": [{"number": 0, "title": "序章：20冊のランキングが、なかなか出てこない", "file": "00-prologue.md", "prerequisite": "SELECT・WHERE・JOIN・GROUP BYの基本形。未習の句は読み方を補う。", "outcome": "20冊という結果件数だけでは仕事量が分からないと説明し、調べたいことを挙げる。", "scope": "困りごととSQLの意味、計測条件まで。改善案の答えは第12章で回収する。", "sections": [{"title": "はじめに", "items": ["SQLを書いて、欲しかった結果が返ってくる。ところが、データが増えると同じSQLなのに遅くなる。「インデックスを付けるといい」と聞いて試したら、今度は速くなった。"]}, {"title": "この本を読んでほしい方", "items": ["SELECTやWHEREでデータを取り出したことはあるけれど、データベースの内側はまだよく分からない。そんな方を想定しています。次のような疑問があれば、本書の実験と重なるはずです。"]}, {"title": "題材は、読書記録サービス", "items": ["友だちと、読んだ本を記録するサイトを作ったとします。本を探し、読み終わったら記録を残します。しばらくすると、こんな要望が届きました。"]}, {"title": "「本」と「読んだ記録」は違う", "items": ["たとえば、本の一覧に次の2冊があるとします。"]}, {"title": "20冊を返すまで、約4.6秒", "items": ["同じランキングを、小さいデータと大きいデータで調べた記録があります。"]}, {"title": "SQLには「欲しい結果」を書く", "items": ["ランキングのSQLは次のとおりです。いまは一文字ずつ覚えなくて大丈夫です。"]}, {"title": "案は出る。でも、選ぶ根拠がない", "items": ["「20冊を10冊に減らせば？」"]}, {"title": "本書の構成", "items": ["本書は序章と12の章で構成しています。章が進むにつれて、一つのSQLを調べるための手がかりを増やしていきます。"]}, {"title": "図とSQLと実行結果を行き来する", "items": ["各章では、まず具体的な疑問を置き、図で仕組みを考えてからSQLを試します。掲載した実行結果には、どの値を見ると何が分かるかを添えています。自分の結果と見比べるときも、時間だけでなく、処理の名前、行数、データへのアクセス量を追ってみてください。"]}, {"title": "第1章へ", "items": ["ここでは、ランキングの改善策をまだ決めなくて大丈夫です。「索引を付けたい」「先に集計しておきたい」など、今の自分なら何を試したいか、一つ書き残しておいてください。第12章で戻ってきたときに、その案のどこを確かめればよいかを考え直します。"]}], "summary": "SQLの結果は読めても、なぜその処理が速い・遅いのかは説明できない。その疑問を出発点に、本書の目的と想定読者を伝えます。読書記録サービスのランキングを共通の題材として紹介し、20冊を返すまでに約4.6秒かかった既存実験と、本100万冊・読了記録200万件でのSQL・出力を示します。改善案を選ぶ根拠を得るために、EXPLAIN、データ構造とアルゴリズム、PostgreSQL内部をつなげて学ぶ、という本全体の道筋を案内します。", "flow": ["はじめに、SQLの結果から内側の仕組みへ関心を広げ、本書の目的と到達点を伝える。", "想定読者、前提となるSQLの経験、実験に必要な操作を案内する。", "読書記録サービスを紹介し、本と読了記録のサンプル行・図からランキングの意味を共有する。", "データ量と対象期間を示し、既存実験の約4.6秒を条件付きで紹介する。画面の待ち時間とSQLの測定値は分ける。", "ランキングSQLと初期データでの出力を読む。欲しい結果と、内部の処理手順を区別する。", "索引、返す件数、事前集計の案を示し、今ある情報では判断できない点を残す。", "全12章の道筋と扱う範囲、図・SQL・実行結果を行き来する読み方を示す。", "今の改善案を書き残して第1章の観察へ進み、最終章で考え直すことを案内する。"]}, {"number": 1, "title": "第1章：SQLの動きを観察する道具を手に入れる", "file": "01-explain-basics.md", "prerequisite": "序章の困りごと。Dockerとpsqlは準備手順から案内する。", "outcome": "単純な検索で、出力行と除外行を区別して計画を読める。", "scope": "EXPLAIN、ANALYZE、rows、costの入口まで。時間の複雑な内訳とloopsは後続章で補う。", "sections": [{"title": "この章で分かること", "items": ["最初の観察は、題名で1冊の本を探す小さなSQLから始めます。実験環境を用意し、EXPLAINで予定を、EXPLAIN ANALYZEで実際の処理を読みます。返した行と条件から除外した行を区別し、番号で探した場合との違いを観察します。結果件数とSQLの仕事量は同じではないと理解し、以降の実験で使う道具を手に入れる章です。"]}, {"title": "はじめに：まずは1冊を探そう", "items": ["いきなり大きなランキングを調べると、探す、数える、並べる処理が一度に出てきます。そこで、最初は「題名で1冊の本を探す」だけにします。"]}, {"title": "SQLを入力する場所を作る", "items": ["実験用リポジトリ postgresql-structures-lab の compose.yaml を使います。Docker Desktopなどを起動し、リポジトリのディレクトリで次のコマンドを実行してください。"]}, {"title": "100万冊の本の一覧を作る", "items": ["次のSQLは最初の1回だけ実行します。実験用DBへ、本100万冊と読了記録200万件を入れます。"]}, {"title": "1冊返るなら、調べるのも1冊？", "items": ["最初の題名検索を実行してみましょう。"]}, {"title": "EXPLAINとは？", "items": ["さっきのSELECTで分かったのは、「実験用の本 42」が見つかったことです。どんな探し方をしたかは、結果の表には出ていません。"]}, {"title": "予定だけでなく、実際に行った仕事を見る", "items": ["予定が分かったので、次は実際に動かした結果と比べます。EXPLAINにANALYZEを付けると、SQLを実行し、実際の行数や時間も計画に追加して表示できます。"]}, {"title": "番号なら、別の探し方ができる", "items": ["同じ本を番号で探してみます。"]}, {"title": "自分で確かめる", "items": ["題名を'存在しない本'に変えたら、返す行と調べる行はどうなるでしょう。まず予想し、同じ観察をしてください。"]}, {"title": "実行結果を手元に残す", "items": ["ここまでのSQLは、リポジトリの sql/01/01-observe.sql にまとめています。psqlを\\qで終了し、ターミナルで次のコマンドを実行すると、SQLと出力をファイルへ保存できます。"]}], "summary": "最初の観察は、題名で1冊の本を探す小さなSQLから始めます。実験環境を用意し、EXPLAINで予定を、EXPLAIN ANALYZEで実際の処理を読みます。返した行と条件から除外した行を区別し、番号で探した場合との違いを観察します。結果件数とSQLの仕事量は同じではないと理解し、以降の実験で使う道具を手に入れる章です。", "flow": ["ランキング全体の前に、その部品である「本を探す」処理を切り出す理由を伝える。", "Dockerとpsqlを準備し、本100万冊・読了記録200万件の件数・主キー・索引の初期状態を確認する。", "SQLから計画・実行・結果までを短い図で示し、題名検索が何冊調べるか予想する。", "EXPLAINを実行し、ノード名と推定rowsを読む。costの単位を実時間と分ける。", "EXPLAIN ANALYZEで、返した行・除外した行・時間を確認し、予想と比較する。", "同じ本を番号で探して計画の違いを観察する。存在しない題名を探す課題で理解を確かめる。", "環境の中断・再開方法を案内し、見つかったところで止められるかという疑問で終える。"]}, {"number": 2, "title": "第2章：見つかったところで止めればよいのでは？", "file": "02-linear-search.md", "prerequisite": "第1章で、返す行と調べる行の違いを観察した。", "outcome": "件数や位置を変えたときの走査量を予想し、LIMITの効果を検証する。", "scope": "走査を手で追い、仕事量の増え方を説明する。CPU命令やSIMDの実装は扱わない。", "sections": [{"title": "この章で分かること", "items": ["同じ100万冊から1冊を探すとき、見つかったところで止めれば仕事を減らせるでしょうか。LIMITの有無と検索する題名を変え、早く見つかる場合・遅く見つかる場合・見つからない場合を比べます。線形探索の仕事量を具体例から理解し、「1行だけなら軽い」という判断を自分で確かめます。"]}, {"title": "はじめに：1冊見つけた後も、調べる必要はある？", "items": ["第1章では、1冊を返すために100万行を調べていました。検索画面で1冊だけ表示したいなら、見つかったところで止めてもよさそうです。"]}, {"title": "比較する条件をそろえる", "items": ["第1章の100万冊をそのまま使います。題名用の索引はまだ作りません。psqlで次を設定します。再接続したら設定し直してください。"]}, {"title": "順番に調べる場合の比較回数", "items": ["説明用に5冊へ縮めます。本4を探していても、同じ題名が後ろにもあるかもしれないので、条件に合う行を全部求める検索では最後まで調べます。"]}, {"title": "見つかったら止まってよいなら？", "items": ["今度は、同じ題名が複数あっても1行だけでよいとします。"]}, {"title": "遅く見つかる本と、存在しない本も探す", "items": ["次の二つは、結果を予想してから実行してください。初期データを作った後に行の追加・更新をしていない状態で比べます。"]}, {"title": "行の数だけでなく、ページを見る", "items": ["たくさんの行を比べるには、その行を含むページにも触れます。一つのページを読み、その中の行を比較し、次のページへ進みます。"]}, {"title": "結果件数と、調べる行数の違い", "items": ["上位20冊を返すランキングも、結果が20だから仕事が20件分とは限りません。必要な答えを確定するまでに、どこまで調べるかが重要です。"]}], "summary": "同じ100万冊から1冊を探すとき、見つかったところで止めれば仕事を減らせるでしょうか。LIMITの有無と検索する題名を変え、早く見つかる場合・遅く見つかる場合・見つからない場合を比べます。返す行が1行でも、見つかる位置によって調べる行数が変わることを、実行結果で確かめます。", "flow": ["第1章の100万冊を使い、1冊見つけたところで止められるか予想する。", "同じ100万冊でLIMITの有無を比べ、返す行と除外行を確認する。", "線形探索とO(n)を、カードの比較回数から説明する。", "LIMIT 1で止まる場合と、見つからない場合を比べる。", "BUFFERSは記録しておき、意味の詳細は第4・5章へ預ける。", "途中で止まれる場合があっても、探す位置に依存する。次は索引で範囲を絞る。"]}, {"number": 3, "title": "第3章：B-treeは、どうやって探す場所を絞るのか", "file": "03-btree-index.md", "prerequisite": "第2章でLIMITによる途中終了の限界を知った。ページは箱として導入する。", "outcome": "一点検索・範囲検索・大量取得で、索引が減らす仕事と残す仕事を説明する。", "scope": "根から葉、葉から表、分割の必要性、維持負担まで。競合制御と分割の厳密な実装は補足。", "sections": [{"title": "本文の流れ", "items": ["番号1〜9を三つの箱に分け、8がある範囲を選んで探す。", "具体的な操作の後に、B-tree・根・葉・ページという名前を付ける。", "題名索引の追加前後で、同じ1行を返す方法とページアクセスを比べる。", "11冊と90万冊を探し、索引があっても選ばれる方法が変わることを見る。", "索引の容量と更新の負担を考え、次章でアクセスの単位を調べる。"]}], "summary": "索引にも100万冊分の情報があるのに、なぜ全件を調べずに探せるのでしょうか。番号1〜9の図で、範囲を絞って探す仕組みを確かめます。その後、題名の索引を作って同じ検索を比べ、探す範囲を広げると選ばれる方法がどう変わるかを観察します。", "flow": ["番号1〜9を三つの箱に分け、8がある範囲を選んで探す。", "具体的な操作の後に、B-tree・根・葉・ページという名前を付ける。", "題名索引の追加前後で、同じ1行を返す方法とページアクセスを比べる。", "11冊と90万冊を探し、索引があっても選ばれる方法が変わることを見る。", "索引の容量と更新の負担を考え、次章でアクセスの単位を調べる。"]}, {"number": 4, "title": "第4章：テーブルの行は、どこに保存されているのか", "file": "04-pages-and-storage.md", "prerequisite": "第3章で、索引によってアクセスが減ることを観察した。", "outcome": "行数・ページ数・バイト数を区別し、索引と表の位置関係を説明する。", "scope": "ページの役割と行の場所まで。TOASTは入口、生ページの詳細と全forkの構造は補足。", "sections": [{"title": "本文の流れ", "items": ["100万冊の表を残し、別スキーマに観察用の1,000冊を準備する。", "保存先・容量・ページサイズを調べ、1,000行と8ページを対応させる。", "100万冊の7,353ページとSeq Scanを対応させ、索引3段から表へ届く経路を図示する。", "ctidのページ番号と項目番号を、出力と図で対応させる。", "SAVEPOINT内で行幅を変え、1,000行で8ページと32ページになる理由を図で考える。", "ROLLBACKで片付け、同じページを毎回どこから使うかという疑問へ進む。"]}], "summary": "SQLの表は、物理的にはファイルやページに保存されています。表のサイズや行の位置を観察し、行数・ページ数・バイト数を別々の量として捉えます。索引から表を参照する関係や、長い値を保存する仕組みの入口にも触れます。同じ件数でも読み込み量が違う理由を説明するための土台を作る章です。", "flow": ["100万冊の表を残し、別スキーマに観察用の1,000冊を準備する。", "保存先・容量・ページサイズを調べ、1,000行と8ページを対応させる。", "100万冊の7,353ページとSeq Scanを対応させ、索引3段から表へ届く経路を図示する。", "ctidのページ番号と項目番号を、出力と図で対応させる。", "SAVEPOINT内で行幅を変え、1,000行で8ページと32ページになる理由を図で考える。", "ROLLBACKで片付け、同じページを毎回どこから使うかという疑問へ進む。"]}, {"number": 5, "title": "第5章：同じページを、毎回ストレージから読むのか", "file": "05-memory-and-buffers.md", "prerequisite": "第4章で、行をまとめて扱うページを知った。", "outcome": "shared hit/readから分かることと分からないことを言い、計測条件をそろえる。", "scope": "共有バッファ・OSキャッシュ・作業用メモリの区別まで。置換アルゴリズムの実装やOSの調整は発展。", "sections": [{"title": "本文の流れ", "items": ["ストレージとメモリの配置図で、共有バッファとOSキャッシュを区別する。", "shared hitとshared readを、ページの読み込み経路に対応させる。", "観察用の1,000冊で、ユーザーが選んだ3回の出力を比べる。", "毎回hit=8でも1,000行を調べており、結果の1行を再利用したわけではないと確かめる。", "微小な時間差からキャッシュの速度効果を主張せず、観察できた範囲を示す。", "共有バッファと作業用メモリを分け、その他の設定は補足に置く。", "ROLLBACKで片付け、接続ごとにSQLを実行するプログラムへ進む。"]}], "summary": "一度使ったページは、次の検索で再利用できるのでしょうか。ページを保存するストレージと、実行中に使うメモリの関係を図で確認し、`BUFFERS`の`hit`と`read`を読みます。同じ検索を3回実行した結果から、ページの再利用と、行の条件を調べる処理を区別します。", "flow": ["ストレージとメモリの配置図で、共有バッファとOSキャッシュを区別する。", "shared hitとshared readを、ページの読み込み経路に対応させる。", "観察用の1,000冊で、ユーザーが選んだ3回の出力を比べる。", "毎回hit=8でも1,000行を調べており、結果の1行を再利用したわけではないと確かめる。", "微小な時間差からキャッシュの速度効果を主張せず、観察できた範囲を示す。", "共有バッファと作業用メモリを分け、その他の設定は補足に置く。", "ROLLBACKで片付け、接続ごとにSQLを実行するプログラムへ進む。"]}, {"number": 6, "title": "第6章：SQLは誰が受け取り、どう実行するのか", "file": "06-process-and-execution.md", "prerequisite": "第5章で、共有バッファと作業領域の役割を知った。", "outcome": "接続から結果までを描き、どのプロセスが何を担当するか説明する。", "scope": "接続ごとのバックエンド、SQLの処理段階、Index ScanとLimitの実行模型まで。保守プロセスは第11章で扱う。", "sections": [{"title": "本文の流れ", "items": ["二つのpsqlでPIDと状態を観察し、接続ごとのバックエンドを知る。", "題名検索の図で、解析・書き換え・計画・実行の順を追う。", "題名索引のある100万冊の計画を読み、Index ScanとLimitの受け渡しを図示する。", "行を返す向きと要求する向きを区別し、Limitが3行で要求を止めることを説明する。", "共有ページと処理ごとの作業領域を接続図に戻し、次章の並べ替えへ進む。"]}], "summary": "SQLはクライアントから送られ、接続を担当するバックエンドで解析・計画・実行へ進みます。二つの接続とPIDを観察して処理の担当を確かめ、実行計画の木が行を返す様子を小さな模型で追います。プロセスごとの仕事と共有する領域を区別し、メモリやファイルをどこに位置付ければよいかを理解します。", "flow": ["二つのpsqlでPIDと状態を観察し、接続ごとのバックエンドを知る。", "題名検索の図で、解析・書き換え・計画・実行の順を追う。", "題名索引のある100万冊の計画を読み、Index ScanとLimitの受け渡しを図示する。", "行を返す向きと要求する向きを区別し、Limitが3行で要求を止めることを説明する。", "共有ページと処理ごとの作業領域を接続図に戻し、次章の並べ替えへ進む。"]}, {"number": 7, "title": "第7章：並べ替えの仕事と、メモリの境界を観察する", "file": "07-sort.md", "prerequisite": "第6章：実行器、第5章：作業メモリ、第2章：仕事量。", "outcome": "Sortの方式と一時ファイルを観察し、件数とメモリの影響を分ける。", "scope": "比較・分割・合流の模型とwork_memまで。ソート実装の網羅や万能な設定値は目標にしない。", "sections": [{"title": "この章で分かること", "items": ["読了記録を新しい順に並べるために、どんな仕事が必要でしょうか。少数の値の比較から始めて、実行計画のSortと対応させます。件数とwork_memを別々に変え、メモリ内での処理と一時ファイルを使う処理を観察します。作業メモリをプロセスの地図へ戻し、並べ替えが遅いときに何を確認すべきかを整理します。"]}, {"title": "はじめに：新しい読了記録を上にしたい", "items": ["今度は「最近読み終えた記録の一覧」を作ります。記録が入っている順と、日時の新しい順は同じとは限りません。"]}, {"title": "大きさを比べて順序を作る", "items": ["説明用に、日時を数字へ置き換えます。数字が大きいほど新しいとします。8、3、6、1を新しい順にしたいなら、8、6、3、1です。"]}, {"title": "第1章で用意した200万件を使う", "items": ["本100万冊・読了記録200万件は、第1章で準備してあります。ここでは件数を確認し、同じ記録の並べ替えを観察します。序章の過去実測で使った2,000万件とは区別してください。"]}, {"title": "Sortを観察する", "items": ["全行を画面へ流すと、表示や転送も混ざります。ここでは実行計画を通して処理を観察します。"]}, {"title": "作業用メモリに収まらないとき", "items": ["100枚のカードを並べたいのに、机には10枚しか置けないとします。"]}, {"title": "メモリを増やせば、いつも解決？", "items": ["一つの処理で一時ファイルを減らせても、多くの人が同時に同じ作業をすると、必要なメモリは増えます。一つのSQLに複数のソートがある場合もあります。"]}], "summary": "読了記録を新しい順に並べるために、どんな仕事が必要でしょうか。少数の値の比較から始めて、実行計画のSortと対応させます。件数とwork_memを別々に変え、メモリ内での処理と一時ファイルを使う処理を観察します。作業メモリをプロセスの地図へ戻し、並べ替えが遅いときに何を確認すべきかを整理します。", "flow": ["日時順の一覧を題材にし、絞り込む行数と並べる行数を確認する。", "日時カードを比べる模型で仕事を数え、比較ソートとO(n log n)の見方を導入する。", "Sortの入力行数・キー・方式・メモリを読み、親ノードの時間に子の処理が含まれることを確認する。", "データを固定してwork_memを変え、メモリ内の処理と外部ソートを比較する。", "一時ファイルへの分割・合流を図示し、表のsharedと作業中のtempを分けて読む。", "複数の処理・接続が使う作業領域を図に戻し、単にメモリを増やす案の確認条件をまとめる。", "上位20件だけ欲しいときも全体を並べる必要があるか、という問いを次章へ残す。"]}, {"number": 8, "title": "第8章：上位20件だけを選ぶには", "file": "08-top-n-heap.md", "prerequisite": "第3章：索引順、第7章：全体のソート。", "outcome": "候補の保持量、入力の走査量、結果件数を分け、二つの上位取得方法を比較する。", "scope": "ヒープの更新を具体例で追い、索引順で止まれる条件まで。コード実装と厳密な証明は任意課題。", "sections": [{"title": "8-1 LIMITで何が減るか予想する", "items": ["日時順の一覧にLIMIT 20を付ける。", "「読む行数・保持する候補数・返す行数」を別々に予想する。", "LIMITなしとの比較で、出力件数が減っても走査が残る場合を確認する。"]}, {"title": "8-2 少数の候補を残し続ける", "items": ["説明用に上位3件を選ぶ模型へ縮める。", "新しいカードが来たとき、候補に入れるか、捨てるかを読者に判断してもらう。", "候補内の境界となる要素を効率よく取り出すヒープを図示する。", "木全体が完全にソートされているわけではないことを示す。", "表の格納先を指す「ヒープ」と、今回のデータ構造のヒープを区別する。"]}, {"title": "8-3 top-N heapsortと模型をつなぐ", "items": ["実測のSort Methodとメモリ量を観察する。", "n件からk件を選ぶ仕事の目安としてO(n log k)と候補の保持量を説明する。", "LIMITがあるだけで、常にこの方式になるとはしない。", "kを大きくした場合はどうなるかを追加課題にする。"]}, {"title": "8-4 順序を持つ索引なら、途中で止まれるか", "items": ["日時の索引を用意し、上位20件取得の前後を比べる。", "索引順に読み、条件を満たす必要件数を得たところで止まる流れを描く。", "Sortの有無、アクセスしたページ、実際に返した行を確認する。", "同じ日時の行がある場合、安定した順序には追加の並び順が必要なことを押さえる。"]}, {"title": "8-5 索引があるのに、遅くなる場合を考える", "items": ["同じ索引を持つ状態で、取り出す件数を大きくした実験を比べる。", "索引から表へ何度もアクセスする動きと、表を走査する動きを図で対比する。", "この結果だけで遅さの原因を断定せず、計画・アクセス量などの根拠を添える。"]}, {"title": "章末の課題とつながり", "items": ["「日時順の上位20件」と「読了数順の上位20冊」は、同じ索引で解決できるか考える。", "ランキングへの接続：集計で生まれる読了数は、元の日時順とは違う。まず数える仕事が残る。", "次の問い：記録に本の情報を付け、同じ本の記録を数えるにはどうするか。"]}], "summary": "上位20件だけが必要なとき、すべての順位を確定する必要はあるのでしょうか。少数の候補を保つヒープを具体例で追い、top-N heapsortの出力と対応させます。さらに索引の順序を利用する取得方法と比較します。調べる件数・候補として保持する件数・返す件数を分け、LIMITが減らす仕事を説明できるようになります。", "flow": ["前章の一覧にLIMITを付け、走査量・保持量・結果件数のどれが減るか予想する。", "LIMITの前後を測り、少数の結果でも入力全体を読む場合があることを観察する。", "上位3件のカード模型で候補の入れ替えを追い、ヒープの部分的な順序を理解する。", "top-N heapsortの表示、候補の保持量、nとkによる仕事の増え方を模型につなぐ。", "日時の索引を追加し、順序を利用して必要な件数で止まれる場合を比較する。", "取得件数を増やし、同じ索引が必ず有利とは限らないことを観察する。", "日時順と読了数順のランキングは同じかを問い、数える・組み合わせる処理へ進む。"]}, {"number": 9, "title": "第9章：本と読了記録を組み合わせ、数える", "file": "09-join.md", "prerequisite": "第3章：索引、第7章：ソート、第8章：入力を減らす意味。", "outcome": "結合方式を手で追い、入力件数・反復回数・グループ数から仕事を説明する。", "scope": "3方式とハッシュ集約、メモリ不足時の入口まで。高度な結合順序探索は第10章の補足。", "sections": [{"title": "9-1 20件の記録に題名を付けたい", "items": ["ER図に戻り、book_idから本を見つける必要を確認する。", "3件程度の記録と本の表を紙上で結合する。", "主キーの一意性、該当する本の有無、重複で結果件数がどう変わるかを意識する。"]}, {"title": "9-2 少ない件数を繰り返し探す：Nested Loop", "items": ["20件の記録それぞれから本を索引で探す流れを描く。", "実行計画のloopsを読み、「何回繰り返したか」を確認する。", "actual rowsやtimeがループ当たりの平均として表示される点をここで説明する。", "Nested Loopという名前だけで遅い方式と判断しない。"]}, {"title": "9-3 大量の行を組み合わせる：Hash Join", "items": ["対象を多数の記録に増やし、同じ探し方が適切か予想する。", "一方の入力から検索用のハッシュ表を作り、他方の入力で照合する模型を描く。", "ハッシュ値だけで同一と決めず、キーの一致を確認することも示す。", "準備の仕事と照合の仕事、メモリ使用量を分けて読む。"]}, {"title": "9-4 並んだ入力を合流させる：Merge Join", "items": ["同じ結合キー順に並ぶ二つの列を、指を進めながら照合する模型にする。", "入力の並び順が必要であり、その準備にも仕事がかかることを説明する。", "設定で方式を観察する場合、仕組みを見る実験であることと設定の復元を明示する。", "3方式の比較表は「最速ランキング」ではなく、得意な条件と準備するものを示す。"]}, {"title": "9-5 同じ本の記録をまとめて数える", "items": ["book_idごとのカウンタを更新する小さな例で集約を説明する。", "Hash Joinの対応付けと、HashAggregateのグループごとの集計を区別する。", "入力行数とグループ数の違いを図示する。", "ほぼ全行が別グループになる場合と、少数グループになる場合の保持量を予想する。"]}, {"title": "9-6 ハッシュ表がメモリに収まらないとき", "items": ["work_memとhash_mem_multiplierの関係を確認し、ソートとハッシュ処理の予算を区別する。", "HashのBatchesや一時ファイルの表示を観察し、入力を分けて処理する模型につなぐ。", "Hash JoinとHashAggregateでは観察する表示が異なるため、同じ項目名をそのまま当てはめない。", "第10章へ向け、実行前に入力行数をどう見積もるかを問いにする。"]}, {"title": "章末の課題とつながり", "items": ["本の題名を全記録に付けてから数える必要があるかを問いにする。", "「先に数え、上位を決めてから題名を付ける」案は、いつ同じ結果になるか考える。", "タイトルによる絞り込みがある場合や、結合相手が複数行ある場合は、順序変更の意味を再確認する。", "ランキングへの接続：探す・並べる・組み合わせる・数える部品がそろった。次章では、これらの方法をPostgreSQLがどう選ぶのかを調べる。"]}], "summary": "読了記録に題名を付け、本ごとに読了記録を数える処理を学びます。少数の行を繰り返し探す方法から始め、大量の行をハッシュ表で照合する方法、並んだ入力を合流させる方法へ広げます。集約では入力行数とグループ数を区別し、メモリとの関係も観察します。結合や集計の前に行を減らす案を、意味と仕事量の両面から考える章です。", "flow": ["ER図と少数の行で、読了記録へ題名を付ける作業を手で行う。", "20件を索引で繰り返し探すNested Loopを観察し、loopsとループ当たりの値を読む。", "対象を大量の行へ広げ、Hash Joinの準備と照合を小さなハッシュ表で追う。", "並んだ二つの入力を合流させるMerge Joinを追い、入力を並べる準備も比較する。", "本ごとのカウンタを更新するHashAggregateを描き、入力行数とグループ数を分ける。", "ハッシュ表がメモリに収まらない場合を観察し、予算と分割処理を結び付ける。", "先に集計してから題名を付けても同じ結果になる条件を考え、処理方式を選ぶプランナへ進む。"]}, {"number": 10, "title": "第10章：PostgreSQLは、なぜその計画を選んだのか", "file": "10-planner-and-statistics.md", "prerequisite": "第5〜9章：選択可能な処理方式。", "outcome": "推定と実測のずれを見つけ、統計更新や代替計画を比較する手順を立てる。", "scope": "基本統計と見積もりの伝播まで。拡張統計、Memoize、並列計画は用途と限界の紹介。", "sections": [{"title": "10-1 同じ表でも選ぶ方法が変わる", "items": ["第3章・第8章の索引と、第9章の結合を振り返る。", "条件を狭くした場合と広くした場合で、推定行数と計画が変わるか予想する。", "プランナは実行前に見積もりで候補を比較するため、実測最速を常に保証するものではないと説明する。"]}, {"title": "10-2 件数の見積もりに使う統計情報", "items": ["ANALYZEとEXPLAIN ANALYZEの役割を明確に分ける。", "pg_statsのn_distinct・most_common_vals・histogram_boundsを、頻度表と分布図に対応させる。", "一様分布と偏りのある実験データで、同じWHEREの形でも対象割合が異なることを調べる。", "統計は標本に基づく見積もりであり、実件数の完全な写しではないと説明する。"]}, {"title": "10-3 小さなずれが後の仕事に影響する", "items": ["Scanの推定と実測を比べ、その後の結合やソートの見積もりとの関係を追う。", "loops当たりの値をそろえて比較し、出力rowsを走査全件数と混同しない。", "更新後にANALYZEを行う前後を比べる実験を計画する。autovacuumによる統計更新を記録し、前提が崩れたら結果をそのまま示す。"]}, {"title": "10-4 costは時間とどう違うか", "items": ["ページへのアクセスと行の処理を小さな模型で数え、見積もり値を比較する意味を説明する。", "startup costとtotal cost、LIMITがある場合の選択に注目する。", "random_page_costなどは考え方を紹介する範囲にとどめ、値を変えて望む計画へ誘導することを標準解にしない。", "enable_*での比較は診断実験として扱い、恒久的な解決と切り分ける。"]}, {"title": "10-5 まだ見積もれない関係を知る", "items": ["二つの列の条件に相関がある例を置き、独立に考える見積もりの限界を説明する。", "拡張統計はどんな問題に関わるかを紹介し、作成・適用範囲の詳細は補足へ送る。", "並列実行とMemoizeは、これまでの基本形を拡張する計画として紹介する。詳細比較は発展課題にする。"]}, {"title": "章末の課題とつながり", "items": ["「索引が使われないので強制しよう」という案に対し、推定・実測・代替計画を確認する手順を書く。", "ランキングへの接続：遅さを見たら、推定のずれなのか、見積もりが合っていても仕事が多いのかを分ける。", "次の問い：同じ索引を使っていても、更新やVACUUMで表へのアクセスが変わるのはなぜか。"]}], "summary": "PostgreSQLは実行前に行数や仕事量を見積もり、処理方法を選びます。条件の広さやデータの偏りを変え、統計情報・推定行数・実際の計画を対応させます。costを実時間と区別し、推定のずれが後続の処理へ及ぼす影響を考えます。期待と違う計画を見たとき、何を確かめてから改善を試すかを組み立てる章です。", "flow": ["条件を狭くした場合と広くした場合を比べ、同じ索引があっても選ぶ方法が変わるか観察する。", "頻度や分布の図とpg_statsを対応させ、推定行数の材料を説明する。", "各ノードの推定と実測を比べ、ずれが結合やソートの判断へどうつながるかを追う。", "データ変更とANALYZE前後の比較を通じて、統計の更新と実行時の計測を区別する。", "ページと行の仕事を見積もる模型でcostを説明し、startup・total・LIMITの関係を見る。", "列の相関、拡張統計、並列計画、Memoizeを発展の入口として位置付ける。", "計画を強制する前の確認手順をまとめ、統計だけでは説明できない更新・可視性の話へつなぐ。"]}, {"number": 11, "title": "第11章：更新された行と、読み手から見える行", "file": "11-mvcc-and-maintenance.md", "prerequisite": "第6章：プロセス、第4章：ページ、第5章：共有バッファ、第3章：索引。", "outcome": "更新・可視性・VACUUM・表への追加アクセスを結び付け、読み込みと更新の両方を考える。", "scope": "MVCC、可視性マップ、VACUUM、WALとcheckpointの役割まで。回復手順、分離レベル全種、レプリケーションは発展。", "sections": [{"title": "11-1 二つの接続で見えるものを比べる", "items": ["第6章の二つの接続を使い、更新をCOMMITする前後で見える値を比べる。", "Read CommittedとRepeatable Readではスナップショットのタイミングが異なるため、実験の分離レベルを先に固定する。", "トランザクションとスナップショットの時間軸を図示する。全分離レベルの網羅はしない。"]}, {"title": "11-2 UPDATEと行のバージョン", "items": ["更新が新しい行バージョンを作ることを、表のページと結び付ける。", "主キーとctidの役割の違いを再確認する。xmin・xmaxは入口として扱い、単純な数値比較だけで可視性が決まるとは説明しない。", "古いバージョンが必要な読み手がいる場合、すぐに回収できないことを模型で示す。", "HOTは索引更新との関係を補足で紹介し、細かな適用条件は対象版の資料で確認する。"]}, {"title": "11-3 VACUUMとANALYZEは別の仕事", "items": ["不要になった行バージョンの領域を再利用可能にする仕事と、統計情報を更新する仕事を分ける。", "通常のVACUUMでファイルが必ず小さくなるとは説明しない。領域の再利用とOSへの返却を区別する。", "autovacuumが担当するメンテナンスと、長いトランザクションが回収を妨げる関係を示す。"]}, {"title": "11-4 Index Only Scanでも表を見に行く理由", "items": ["必要な列が索引にあることと、行が読み手に見えると確認できることを別の条件にする。", "可視性マップとHeap Fetchesを、索引・表・補助情報の図へ対応させる。", "VACUUM後、更新後、再びVACUUM後を比較する実験を計画する。計画選択やautovacuumの影響も記録する。", "索引の利用だけでは更新後の性能を説明し切れないことを、観察できた範囲で結論にする。"]}, {"title": "11-5 変更を残す仕組みの地図", "items": ["共有バッファ上の変更されたページ、WAL、データファイルを区別する。", "先行書き込みとCOMMITの耐久性を、標準的な設定を前提に説明する。", "WAL writer・checkpointer・background writerの役割を整理し、COMMITのたびに全データページを保存するとは説明しない。", "ページを更新する仕事、可視性の判断、クラッシュからの回復を別の目的として結び付ける。復旧操作やレプリケーションは発展資料へ送る。"]}, {"title": "章末の課題とつながり", "items": ["「索引に列が全部あるから、更新後も表を読む必要はない」という説明の不足を指摘する。", "ランキングへの接続：事前集計にも更新・訂正・削除を反映する仕事があり、読む速さだけでは採用を決められない。", "次の章で、処理方式・メモリ・統計・更新を含めてランキング改善を判断する。"]}], "summary": "更新中の表を複数の接続から読むと、同じ行でも見える値が異なることがあります。スナップショットと行のバージョンを観察し、不要な領域の回収、可視性マップ、Index Only Scanを結び付けます。最後にWALとデータページの書き出しを整理します。読み取り性能を、更新・後片付け・耐久性まで含めて考えるための章です。", "flow": ["二つの接続で更新とCOMMITを観察し、分離レベルを固定した時間軸に見える値を書き込む。", "更新前後の行バージョンをページの模型で示し、読み手が必要とする古い情報を考える。", "VACUUMとANALYZEを役割で分け、autovacuumと長いトランザクションの関係を説明する。", "索引に必要な列があることと、行が見えることを区別し、可視性マップを導入する。", "更新・VACUUM前後でHeap Fetchesを比べ、Index Only Scanと表へのアクセスを対応させる。", "共有バッファの変更、WAL、データファイルを図示し、COMMITとページ書き出しの違いを整理する。", "読み込みの速さだけでは更新を伴う設計を評価できないとまとめ、ランキングの最終判断へ戻る。"]}, {"number": 12, "title": "第12章：ランキングを読み解き、改善を選ぶ", "file": "12-ranking-revisited.md", "prerequisite": "第1〜11章の観察・アルゴリズム・内部構造。", "outcome": "AIや検索で得た改善案について、前提・実験・結果・代償を示し採用を判断する。", "scope": "同じ条件での比較とサービス要件による判断まで。本番監視基盤や集計更新基盤の構築は別テーマ。", "sections": [{"title": "12-1 序章の予想を開く", "items": ["序章で選んだ改善案と理由を読み返す。", "SQL、データ、索引、設定を確認し、現在の基準値を測る。", "序章の約4.6秒と現在の実験値は、環境やDB状態が違えば直接の改善比較に使わない。"]}, {"title": "12-2 全体の計画を読める形へ直す", "items": ["スキャン・結合・集約・ソート・LIMITを、行の流れの図に対応させる。", "各段に入力行数と出力行数を添え、どこで大量の行を扱っているか確認する。", "推定と実測の行数を比較し、見積もりの大きなずれがあるか調べる。", "時間は子の処理を含むこと、loopsや並列実行で読み方が変わることに注意する。", "各ノードの時間を「クエリ開始からの絶対時刻」として扱わない。差分の内訳は条件付きの概算とする。"]}, {"title": "12-3 改善案ごとに、減らす仕事を予想する", "items": ["案1：日時などに索引を追加し、対象行へのアクセスを変える。", "案2：記録を集計して上位20冊を決め、その後で本を結合する。", "案3：集計結果を保存し、表示時に行う仕事を減らす。", "各案について、減る処理・残る処理・新しく増える負担を先に表へ書く。"]}, {"title": "12-4 案1：索引でどこまで変わるか", "items": ["同じ基準条件から索引を変え、計画と実測を比較する。", "検索経路が変わっても、結合や集計の入力が多く残る可能性を観察する。", "Index Only Scanなど新しい表示は、この判断に必要な範囲で補足する。", "差が小さい場合は測定のばらつきも確認し、数値一つで優劣を断定しない。"]}, {"title": "12-5 案2：組み合わせる件数を減らす", "items": ["変更前後のSQLと行の流れを並べる。", "先に集計・上位選択を行うと、どの段の入力が減るか予想してから測る。", "速さと別に、同じ結果になることを確認する。", "主キー・外部キー、対象期間、同数時の順位規則など、書き換えが成立する前提を明示する。", "一つのサンプルで結果が一致したことと、一般に意味が等しいことを区別する。"]}, {"title": "12-6 案3：いつ計算するかを変える", "items": ["集計表の作成と読み出しを、別々に測る。", "表示が速くなっても、集計を作る仕事は別の時点に移っていることを図示する。", "更新頻度、遅れて届く読了記録、訂正・削除、週の切り替わりを設計上の問いにする。", "実装を全部作り込まず、鮮度・運用負担・保存容量を比較材料にする。"]}, {"title": "12-7 このサービスで採用する案を決める", "items": ["同じ環境での実測、結果の正しさ、鮮度、追加負担を比較表にする。", "許容する応答時間と鮮度を物語上の要件として明示してから判断する。", "読者にも「採用案・根拠・追加で確認したいこと」を3行で書いてもらう。", "要件を「即時反映が必要」「数分の遅延を許容」に変えた場合、選択が変わるか考える。"]}, {"title": "12-8 AIや検索で得た提案を、自分で確かめる", "items": ["例題：「日時に索引を作れば改善する」という提案を受け取る。", "提案の前提、減るはずの処理、確認する出力を読者が言語化する。", "追加実験案として、対象期間を1日・1週間・全期間へ変える。結果は測る前に決めない。", "回答が妥当かを印象で選ばず、実行計画・実測・サービス要件から説明する。", "最後は初見の条件でも「次に何を調べれば判断できるか」を挙げられることを到達点にする。"]}, {"title": "12-9 3つの知識を使った説明を完成させる", "items": ["EXPLAINのノード、アルゴリズム、プロセス・メモリ・ページの対応を、一つの計画について説明する。", "遅い理由をCPU・I/O・メモリのどれかへ、証拠なしに断定しない。追加観測が必要なら明記する。", "第10章の統計、第11章の更新状態も比較条件に入れる。", "最終課題は「提案→減る仕事の予想→条件をそろえた比較→同じ結果の確認→要件から判断」を短い調査メモとして書く。"]}], "summary": "序章のランキングを、ここまで学んだ観察方法・アルゴリズム・内部構造から読み解きます。索引の追加、集計と結合の順序の変更、事前集計について、減る仕事と残る仕事を予想して比較します。結果が同じか、必要な鮮度を満たすか、更新の負担は何かも確かめます。AIや検索で得た案を、自分の条件と根拠で判断するところまでを本の到達点にします。", "flow": ["序章で選んだ改善案を振り返り、現在のデータ・索引・設定・更新状態で基準を測る。", "計画を行の流れへ描き直し、推定と実測、繰り返し、ページアクセスから多くの仕事が残る箇所を探す。", "3つの改善案について、どの仕事が減り、何が残り、新しい負担は何かを先に予想する。", "索引の追加を比較し、検索経路の変化と結合・集約に残る仕事を確認する。", "先に集計・上位選択してから本を結合する案を試し、意味が同じになる前提と結果の一致を確かめる。", "事前集計の作成と読み出しを分けて測り、更新・訂正・削除・鮮度の責任を考える。", "応答時間と鮮度の要件を明示して採用案を選び、要件が変わった場合も考える。", "初見の提案に対する確認手順を整理し、3領域の知識を使った短い調査メモを最終課題として書く。"]}], "edges": [{"to": "executor", "reason": "バックエンドが計画に従って実行する", "from": "process"}, {"to": "explain", "reason": "計画の木を出力として観察する", "from": "executor"}, {"to": "buffers", "reason": "複数のバックエンドがページを共有する", "from": "process"}, {"to": "buffers", "reason": "行ではなくページを読み込み・保持する", "from": "pages"}, {"to": "os-cache", "reason": "共有バッファにないページもOS側にある場合がある", "from": "buffers"}, {"to": "toast", "reason": "長い値は別領域への参照が関わる", "from": "pages"}, {"to": "work-mem", "reason": "接続や処理が増えると作業領域も増えうる", "from": "process"}, {"to": "temp-buffers", "reason": "共有するページと一時テーブルのページを区別する", "from": "buffers"}, {"to": "maintenance", "reason": "検索処理とメンテナンスの予算を分ける", "from": "work-mem"}, {"to": "seq", "reason": "ページをたどって行の条件を調べる", "from": "pages"}, {"to": "btree", "reason": "全件を調べる仕事と、場所を絞る仕事を比べる", "from": "seq"}, {"to": "btree", "reason": "索引のページから表の行の場所へ進む", "from": "pages"}, {"to": "btree", "reason": "読む量を減らす効果と再利用の効果を分ける", "from": "buffers"}, {"to": "sort", "reason": "結果を返す前に入力を集める処理を知る", "from": "executor"}, {"to": "sort", "reason": "収まらない場合は一時ファイルの仕事が加わる", "from": "work-mem"}, {"to": "heap", "reason": "全体を並べる方法と上位候補だけを保持する方法", "from": "sort"}, {"to": "heap", "reason": "順序を持つ索引なら上位取得の走査を減らせる場合がある", "from": "btree"}, {"to": "nested", "reason": "内側の繰り返し検索に索引を使う", "from": "btree"}, {"to": "hash", "reason": "繰り返し検索と、照合用の表を準備する方法を比べる", "from": "nested"}, {"to": "merge", "reason": "並んだ入力を用意して合流させる", "from": "sort"}, {"to": "aggregate", "reason": "ハッシュ表を照合とグループ集計で使う", "from": "hash"}, {"to": "hash", "reason": "hash_mem_multiplierも含めて予算を考える", "from": "work-mem"}, {"to": "aggregate", "reason": "グループ数と保持する状態がメモリに影響する", "from": "work-mem"}, {"to": "cost", "reason": "行数の見積もりが処理のコストに影響する", "from": "stats"}, {"to": "executor", "reason": "候補を比較して実行計画を選ぶ", "from": "cost"}, {"to": "stats", "reason": "推定と実測の行数を比べる", "from": "explain"}, {"to": "btree", "reason": "索引があっても選ぶかどうかは見積もりによる", "from": "cost"}, {"to": "hash", "reason": "入力の見積もりが結合方式の選択につながる", "from": "cost"}, {"to": "mvcc", "reason": "更新前後の行バージョンを格納する", "from": "pages"}, {"to": "vacuum", "reason": "不要になったバージョンを回収する", "from": "mvcc"}, {"to": "visibility", "reason": "可視性マップを保守する", "from": "vacuum"}, {"to": "visibility", "reason": "列を取り出せることと行が見えることは別条件", "from": "btree"}, {"to": "visibility", "reason": "索引だけで返すにも可視性の確認が必要", "from": "mvcc"}, {"to": "wal", "reason": "メモリ上の変更と耐久性を分けて考える", "from": "buffers"}, {"to": "wal", "reason": "書き出しに関わるプロセスの役割を整理する", "from": "process"}, {"to": "precompute", "reason": "数える仕事を表示の前へ移す", "from": "aggregate"}, {"to": "precompute", "reason": "集計後の順序を用意して上位を取り出す", "from": "heap"}, {"to": "precompute", "reason": "訂正・削除・新規記録をいつ反映するか考える", "from": "mvcc"}, {"to": "precompute", "reason": "改善前後を同じ条件で比較する", "from": "explain"}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent);
const categories=[['観察と判断','計画を読み、根拠を持つ','var(--observe)'],['データ構造','仕事の増え方を理解する','var(--algo)'],['内部構造','プロセス・メモリ・保存','var(--internal)']];
const byId=new Map(DATA.nodes.map(n=>[n.id,n]));
const map=document.getElementById('map'),world=document.getElementById('world'),detail=document.getElementById('detail'),topic=document.getElementById('topic'),chapter=document.getElementById('chapter');
let selected='buffers',chapterId=null,scale=1,tx=0,ty=0,drag=null,moved=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groupCounts=[0,0,0];
for(let i=0;i<3;i++){const label=document.createElement('div');label.className='lane';label.style.left=(30+i*338)+'px';label.innerHTML=esc(categories[i][0])+'<small>'+esc(categories[i][1])+'</small>';world.append(label);}
for(const n of DATA.nodes){n.x=30+n.group*338;n.y=90+groupCounts[n.group]++*77;const b=document.createElement('button');b.className='node';b.type='button';b.id='node-'+n.id;b.style.cssText=`left:${n.x}px;top:${n.y}px;--c:${categories[n.group][2]}`;b.innerHTML='<small>'+esc(n.chapters.map(x=>x===0?'序章':'CH '+String(x).padStart(2,'0')).join(' · '))+'</small>'+esc(n.label);b.addEventListener('click',()=>{if(!moved)selectNode(n.id)});b.addEventListener('focus',()=>{if(document.activeElement===b){const r=b.getBoundingClientRect(),m=map.getBoundingClientRect();if(r.left<m.left||r.right>m.right||r.top<m.top||r.bottom>m.bottom)center(n)}});document.getElementById('nodes').append(b);const o=document.createElement('option');o.value=n.id;o.textContent=n.label;topic.append(o);}
for(const c of DATA.chapters){const o=document.createElement('option');o.value=c.number;o.textContent=c.title;chapter.append(o);}
for(const e of DATA.edges){const a=byId.get(e.from),b=byId.get(e.to),path=document.createElementNS('http://www.w3.org/2000/svg','path');let ax=a.x+266,ay=a.y+30,bx=b.x,by=b.y+30;if(a.group>b.group){ax=a.x;bx=b.x+266}if(a.group===b.group){ax=a.x+266;bx=b.x+266;path.setAttribute('d',`M${ax},${ay} C${ax+35},${ay} ${bx+35},${by} ${bx},${by}`)}else{const mid=(ax+bx)/2;path.setAttribute('d',`M${ax},${ay} C${mid},${ay} ${mid},${by} ${bx},${by}`)}path.classList.add('edge');e.element=path;document.getElementById('edges').append(path);}
function transform(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function fit(all=false){scale=Math.min(map.clientWidth/1030,map.clientHeight/1040);if(map.clientWidth<600&&!all)scale=.72;tx=(map.clientWidth-1030*scale)/2;ty=8;transform()}
function center(n){tx=map.clientWidth/2-(n.x+133)*scale;ty=map.clientHeight/2-(n.y+30)*scale;transform()}
function zoom(factor){const next=Math.max(.35,Math.min(1.8,scale*factor));const cx=map.clientWidth/2,cy=map.clientHeight/2;tx=cx-(cx-tx)*next/scale;ty=cy-(cy-ty)*next/scale;scale=next;transform()}
function chapterButtons(ids){return '<div class="chapter-buttons">'+ids.map(id=>'<button type="button" data-chapter="'+id+'">'+(id===0?'序章':'第'+id+'章')+'</button>').join('')+'</div>'}
function paint(){const related=new Set([selected]);for(const e of DATA.edges)if(e.from===selected||e.to===selected){related.add(e.from);related.add(e.to)}for(const n of DATA.nodes){const b=document.getElementById('node-'+n.id);const active=chapterId!==null?n.chapters.includes(chapterId):related.has(n.id);b.classList.toggle('dim',!active);b.classList.toggle('selected',chapterId===null&&n.id===selected);b.classList.toggle('related',chapterId===null&&related.has(n.id)&&n.id!==selected);b.classList.toggle('chapter-on',chapterId!==null&&active);b.setAttribute('aria-pressed',String(chapterId===null&&n.id===selected))}for(const e of DATA.edges){const on=chapterId!==null?byId.get(e.from).chapters.includes(chapterId)&&byId.get(e.to).chapters.includes(chapterId):e.from===selected||e.to===selected;e.element.classList.toggle('on',on);if(on)e.element.setAttribute('marker-end','url(#arrow)');else e.element.removeAttribute('marker-end')} }
function selectNode(id,recenter=false){selected=id;chapterId=null;chapter.value='';topic.value=id;const n=byId.get(id);const connections=DATA.edges.filter(e=>e.from===id||e.to===id);detail.innerHTML='<div class="category">'+esc(categories[n.group][0])+'</div><h2>'+esc(n.label)+'</h2><h3>関連する基礎知識</h3><p>'+esc(n.basics)+'</p><h3>つながりから分かること</h3><p>'+esc(n.takeaway)+'</p><h3>扱う章</h3>'+chapterButtons(n.chapters)+'<h3>この知識からたどる</h3><ul class="connections">'+connections.map(e=>{const other=byId.get(e.from===id?e.to:e.from);return '<li><button type="button" data-node="'+other.id+'">'+esc(other.label)+'</button><small>'+esc(e.reason)+'</small></li>'}).join('')+'</ul>';paint();if(recenter)center(n)}
function selectChapter(id){chapterId=id;chapter.value=String(id);const c=DATA.chapters.find(c=>c.number===id);detail.innerHTML='<div class="category">章の解説範囲</div><h2>'+esc(c.title)+'</h2><h3>Summary</h3><p>'+esc(c.summary)+'</p><h3>本文の流れ</h3><ol class="chapter-flow">'+c.flow.map(item=>'<li>'+esc(item)+'</li>').join('')+'</ol><h3>前提となる知識</h3><p>'+esc(c.prerequisite)+'</p><h3>読者ができるようになること</h3><p>'+esc(c.outcome)+'</p><h3>どこまで扱うか</h3><p class="scope">'+esc(c.scope)+'</p><h3>この章でつながる知識</h3><ul class="connections">'+DATA.nodes.filter(n=>n.chapters.includes(id)).map(n=>'<li><button data-node="'+n.id+'">'+esc(n.label)+'</button></li>').join('')+'</ul><details><summary>章の箇条書きを見る</summary>'+c.sections.map(s=>'<h3>'+esc(s.title)+'</h3><ul>'+s.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>').join('')+'</details><a class="chapter-link" href="'+esc(c.file)+'">本文のMarkdownを開く →</a>';paint()}
detail.addEventListener('click',e=>{const n=e.target.closest('[data-node]'),c=e.target.closest('[data-chapter]');if(n)selectNode(n.dataset.node,true);if(c)selectChapter(Number(c.dataset.chapter))});topic.addEventListener('change',()=>selectNode(topic.value,true));chapter.addEventListener('change',()=>chapter.value===''?selectNode(selected):selectChapter(Number(chapter.value)));document.getElementById('plus').onclick=()=>zoom(1.2);document.getElementById('minus').onclick=()=>zoom(1/1.2);document.getElementById('fit').onclick=()=>fit(true);
map.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,tx,ty};moved=false;map.setPointerCapture(e.pointerId);map.classList.add('dragging')});map.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;tx=drag.tx+dx;ty=drag.ty+dy;transform()});function end(){drag=null;map.classList.remove('dragging');setTimeout(()=>moved=false,0)}map.addEventListener('pointerup',end);map.addEventListener('pointercancel',end);
new ResizeObserver(()=>{fit();if(map.clientWidth<600)center(byId.get(selected))}).observe(map);fit();selectNode(selected);
</script>
</body>
</html>
