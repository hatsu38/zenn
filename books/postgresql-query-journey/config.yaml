title: "図解 SQLの裏側で動くアルゴリズムとPostgreSQLの仕組み ─ 実行計画で確かめて理解する"
summary: "B-tree・ソート・ハッシュといったアルゴリズムと、ページ・共有バッファといったPostgreSQLの仕組みを、実行計画と図で確かめて理解する本です。読書記録サービスのランキングSQLを題材に、何件を調べ、どのページを読み、どこでメモリを使うかを追いかけ、最後に改善案を比べます。SELECT・WHEREの基礎から始め、DockerとPostgreSQL 18で確かめます。"
