title: "SQLの裏側で動いているデータ構造とアルゴリズム ─ PostgreSQLの実行計画を読みながら確かめる"
summary: "SQLが何行を調べ、どのページを読み、どこでメモリを使うかを、図と実験で読み解く本です。読書記録サービスを題材に、B-tree・ヒープ・ハッシュとPostgreSQLの実行計画を結び付け、ランキングの改善を結果の正しさと更新の負担まで含めて判断します。SELECT・WHEREの基礎から始め、DockerとPostgreSQL 18で確かめます。"
