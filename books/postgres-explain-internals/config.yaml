title: "PostgreSQL 実行計画の教科書 ─ EXPLAIN でのぞく内部構造"
summary: "EXPLAIN の出力に並ぶ数字を、1 行ずつ自分の言葉で説明できるようになるための教科書です。cost / rows / actual time / loops / BUFFERS の意味と計算のされ方から、Seq Scan / Index Scan / Nested Loop などのノードの選ばれ方、その裏にあるページとヒープタプル、visibility map、統計情報、MVCC と VACUUM といった PostgreSQL の内部構造まで降りて確かめます。Docker で立ち上がるサンプル DB と章別クエリ集付きで、本書のすべての数字を実機で再現しながら読み進められます。"
topics: ["postgresql", "database", "sql", "explain", "performance"]
