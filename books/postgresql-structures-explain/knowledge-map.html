asics": "部分的な順序、候補の更新", "takeaway": "読むn件と保持するk件の違い。表の格納先を指すヒープとも区別", "group": 1, "chapters": [8, 12]}, {"id": "nested", "label": "Nested Loop", "basics": "反復、検索の再利用", "takeaway": "外側の件数と内側の探索、loopsが仕事量へ与える影響", "group": 1, "chapters": [9, 10, 12]}, {"id": "hash", "label": "Hash Join", "basics": "ハッシュ表、衝突、照合", "takeaway": "表の準備と照合、メモリ不足による分割処理", "group": 1, "chapters": [9, 10, 12]}, {"id": "merge", "label": "Merge Join", "basics": "順序、二つの列の合流", "takeaway": "並んでいる入力を使える利点と、並べるための準備", "group": 1, "chapters": [9, 10]}, {"id": "aggregate", "label": "HashAggregate", "basics": "グループ化、カウンタ、状態保持", "takeaway": "入力件数とグループ数の違い、保持する状態の大きさ", "group": 1, "chapters": [9, 12]}, {"id": "stats", "label": "統計情報", "basics": "標本、分布、頻度、相関", "takeaway": "行数の見積もりが計画の選択へつながる理由", "group": 0, "chapters": [10, 12]}, {"id": "cost", "label": "コストモデル", "basics": "予測、相対比較、最適化", "takeaway": "costをミリ秒と同一視できない理由、推定の限界", "group": 0, "chapters": [10, 12]}, {"id": "mvcc", "label": "MVCC / スナップショット", "basics": "同時実行、バージョン、時間", "takeaway": "同じ表でも読み手が見られる行が違う理由", "group": 2, "chapters": [11, 12]}, {"id": "vacuum", "label": "VACUUM", "basics": "領域の再利用、メンテナンス", "takeaway": "古いバージョンの回収と、統計更新との役割の違い", "group": 2, "chapters": [11, 12]}, {"id": "visibility", "label": "可視性 / Index Only Scan", "basics": "補助情報、可視性、索引", "takeaway": "必要な列が索引にあっても表への確認が必要な場合", "group": 2, "chapters": [11, 12]}, {"id": "wal", "label": "WAL / checkpoint", "basics": "先行書き込み、耐久性、回復", "takeaway": "メモリ上の変更、ログの永続化、データページの書き出しの違い", "group": 2, "chapters": [11]}, {"id": "precompute", "label": "事前集計", "basics": "事前計算、鮮度、更新責務", "takeaway": "表示時の仕事を減らす代わりに、いつ誰が計算するかを決める", "group": 0, "chapters": [12]}], "chapters": [{"number": 0, "title": "序章：20冊のランキングが、なかなか出てこない", "file": "00-prologue.md", "prerequisite": "SELECT・WHERE・JOIN・GROUP BYの基本形。未習の句は読み方を補う。", "outcome": "20冊という結果件数だけでは仕事量が分からないと説明し、調べたいことを挙げる。", "scope": "困りごととSQLの意味、計測条件まで。改善案の答えは第12章で回収する。", "sections": [{"title": "0-1 はじめに：いつものSQLから中の動きを知りたい", "items": ["SELECTやWHEREは書けるが、遅い理由や改善案の選び方には自信がない読者を想定する。", "この本で扱う読書サービスと、実験しながら学ぶ進め方を紹介する。", "AIも検索も使ってよい。得た説明を手元のSQLで確かめられることを目指す。"]}, {"title": "0-2 サービスが育ち、ランキングで困る", "items": ["本を登録し、読了記録を付け、「今週よく読まれた本」を20冊表示する。", "booksとreading_recordsの役割を少量のサンプル行で示す。", "ER図で「1冊の本に複数の読了記録がある」を示す。実際の実験スキーマに合わせる。", "データ量を、本100万冊・読了記録2,000万件として具体化する。", "架空のサービス上の会話と、実際に測定したSQLの結果を区別する。"]}, {"title": "0-3 20冊を返すSQLに約4.6秒かかった", "items": ["対象期間、集計対象、同数の場合の並び順を示して、ランキングの意味を決める。", "SQLを「期間で絞る・本と対応させる・数える・並べる・20冊返す」と読む。", "この説明はSQLの要求であり、実際の物理的な処理順の断定ではないと区別する。", "約4.6秒は既存の序章実験の値として条件とログを添える。画面全体の応答時間とは分ける。"]}, {"title": "0-4 改善案は出る。でも選べない", "items": ["「インデックスを作る」「返す件数を減らす」「先に集計する」という案を並べる。", "読者にも一つ選んでもらい、理由を短く残してもらう。", "20冊返すまでに何件読んだか、どの処理に時間がかかったかは、経過時間だけでは分からない。", "この不足を、次章でEXPLAINを使う動機にする。"]}, {"title": "序章で残す問い", "items": ["返す20冊と、調べる件数は同じなのか。", "探す・組み合わせる・数える・並べるのうち、どの仕事を減らすべきか。", "その判断をするため、まず小さな検索の観察から始める。"]}], "summary": "読書記録サービスの「今週よく読まれた本」は、20冊を返すまでに約4.6秒かかりました。SQLの意味は読めても、どの処理に時間がかかったかはまだ分かりません。本と読了記録の関係、ランキングの条件、計測した範囲を整理し、改善案を選ぶために何を調べる必要があるかを考えます。この問いを持って、観察の道具と内部の仕組みを学び始めます。", "flow": ["はじめに、SQLは書けるけれど遅さの理由を説明できない、という読者の出発点を置く。", "読書記録サービスを紹介し、本と読了記録のサンプル行・ER図からランキングの意味を共有する。", "データ量と対象期間を示し、既存実験の約4.6秒を条件付きで紹介する。画面の待ち時間とSQLの測定値は分ける。", "ランキングSQLを読む。期間で絞る・組み合わせる・数える・並べる・20冊返すという要求を整理する。", "索引、返す件数、事前集計の案から読者に一つ選んでもらい、今ある情報では判断できない点を残す。", "予想→実験→図解→条件変更という本の読み方を示し、第1章の観察へつなぐ。"]}, {"number": 1, "title": "第1章：SQLの動きを観察する道具を手に入れる", "file": "01-explain-basics.md", "prerequisite": "序章の困りごと。Dockerとpsqlは準備手順から案内する。", "outcome": "単純な検索で、出力行と除外行を区別して計画を読める。", "scope": "EXPLAIN、ANALYZE、rows、costの入口まで。時間の複雑な内訳とloopsは後続章で補う。", "sections": [{"title": "1-1 大きなランキングを、小さな検索へ分解する", "items": ["最初の題材を「題名で1冊探す」に絞る理由を説明する。", "ランキングにも必要な「探す」という部品を観察する位置付けにする。", "読者の予想：「1冊返るなら、調べたのも1冊だろうか」。"]}, {"title": "1-2 実験環境と最初のデータを用意する", "items": ["Docker、psql、バージョン確認、接続できたことの確認を順番に案内する。", "小さいbooksとreading_recordsを作り、件数と数行の内容を確認する。", "主キーがあることと、題名用の索引はまだないことを示す。", "実験専用DBで進め、準備に失敗したときの再実行方法も添える。"]}, {"title": "1-3 SQLから結果までの小さな地図", "items": ["SQLを解析し、計画を立て、その計画を実行して結果を返す、という流れを図にする。", "プランナとエグゼキュータの役割を、予定と実行に対応させる。", "この段階ではWALやバックグラウンド処理の一覧へ広げない。"]}, {"title": "1-4 EXPLAINで予定を見る", "items": ["題名検索のSQLにEXPLAINを付ける。", "まずノード名と推定rowsに注目する。全項目の暗記を要求しない。", "costはミリ秒ではなく比較用の見積もりであることを短く押さえる。", "「実際に何行を調べたかは、この出力だけで分かるか」を次の問いにする。"]}, {"title": "1-5 EXPLAIN ANALYZEで実行した結果を見る", "items": ["ANALYZEを付けるとSQLを実行することを明記する。", "単純な1回の走査でactual rowsとRows Removed by Filterを比べる。", "出力した行と、条件を調べて除外した行を具体的な行の図で分ける。", "複雑な計画やloopsがある場合にも単純加算できる、という一般化はしない。"]}, {"title": "1-6 番号で探すと何が変わるか", "items": ["同じ本を主キーで探し、題名検索との計画の違いを観察する。", "主キーに対応する索引があることを紹介する。木の中身は第6章へ残す。", "単発の微小な時間差より、探し方が変わったことに注目する。"]}, {"title": "1-7 実験の中断と再開", "items": ["接続を閉じる操作と、DBのデータを削除する操作を区別する。", "再開時に件数・索引・設定を確認し、どの状態から実験を続けるか示す。"]}, {"title": "章末の課題とつながり", "items": ["存在しない題名なら、返す行と調べる行はどうなるかを予想する。", "持ち帰ること：結果件数だけではSQLの仕事量は分からない。予定と実測を見分けられる。", "次の問い：計画を立てて実行しているのは誰か。まずプロセス・ページ・メモリを観察し、第5章で本を増やして調べる。"]}], "summary": "最初の観察は、題名で1冊の本を探す小さなSQLから始めます。実験環境を用意し、EXPLAINで予定を、EXPLAIN ANALYZEで実際の処理を読みます。返した行と条件から除外した行を区別し、番号で探した場合との違いを観察します。結果件数とSQLの仕事量は同じではないと理解し、以降の実験で使う道具を手に入れる章です。", "flow": ["ランキング全体の前に、その部品である「本を探す」処理を切り出す理由を伝える。", "Dockerとpsqlを準備し、小規模データ・件数・主キー・索引の初期状態を確認する。", "SQLから計画・実行・結果までを短い図で示し、題名検索が何冊調べるか予想する。", "EXPLAINを実行し、ノード名と推定rowsを読む。costの単位を実時間と分ける。", "EXPLAIN ANALYZEで、返した行・除外した行・時間を確認し、予想と比較する。", "同じ本を番号で探して計画の違いを観察する。存在しない題名を探す課題で理解を確かめる。", "環境の中断・再開方法を案内し、この計画を動かすプロセスへの疑問で終える。"]}, {"number": 2, "title": "第2章：SQLは誰が受け取り、どう実行するのか", "file": "02-process-and-execution.md", "prerequisite": "第1章：実行計画と実測。OSのプロセスは本章で導入する。", "outcome": "接続から結果までを描き、どのプロセスが何を担当するか説明する。", "scope": "バックエンドと主要な裏方の役割、計画の実行模型まで。IPCやOSスケジューラの実装は発展。", "sections": [{"title": "2-1 接続の向こうにいるプロセス", "items": ["psqlなどのクライアントと、PostgreSQLサーバを分けて描く。", "二つの接続でpg_backend_pid()を確認し、別々のバックエンドが担当することを観察する。", "pg_stat_activityのpid・state・queryと接続を対応させる。権限によって見える範囲が異なることも添える。", "SQLごとに新しい接続を作る場合と、接続を再利用する場合を区別する。接続プールの実装は発展資料へ送る。"]}, {"title": "2-2 SQLという文字列から実行計画へ", "items": ["構文解析・意味解析・書き換え・計画・実行の役割を、同じSELECT文で追う。", "存在しない表の参照と、実行に時間がかかるSQLを例に、失敗・遅延が生じる段階を区別する。", "VIEWの書き換えを短い例で示す。人間によるSQL改善と内部の書き換え処理を同一視しない。", "Planning TimeとExecution Timeを観察し、通信やクライアントの表示時間とは分ける。"]}, {"title": "2-3 実行計画の木が動く様子", "items": ["Scan → Sort → Limitを少数の行で追い、行を返す向きと、親が子に行を要求する向きを分けた図を用意する。", "すぐに行を返せる処理と、結果を返す前に入力を集める処理があることを予告する。", "LIMITがあっても子の仕事がすべて小さくなるわけではない、という予想を残す。", "詳細なノード実装は後続章で扱い、C言語の関数名の列挙には広げない。"]}, {"title": "2-4 共有するもの、接続ごとに持つもの", "items": ["バックエンドプロセスと共有メモリの位置関係を図示する。", "共有バッファと、実行中の処理が必要とする作業領域を役割で区別する。", "checkpointer・background writer・WAL writer・autovacuumの名前と担当を地図へ配置する。詳細は第11章で回収する。", "並列ワーカーは追加プロセスとして紹介し、1接続＝常に1プロセスだけで処理するとは一般化しない。"]}, {"title": "章末の課題とつながり", "items": ["同じSQLを二つの接続から実行すると、何を共有し、何が別になるか図に書き込む。", "ランキングへの接続：DB内部の処理時間と、画面で待つ時間は同じ範囲を測っていない。", "次の問い：バックエンドが読むテーブルは、どのようにファイルへ保存されているか。"]}], "summary": "SQLはクライアントから送られ、接続を担当するバックエンドで解析・計画・実行へ進みます。二つの接続とPIDを観察して処理の担当を確かめ、実行計画の木が行を返す様子を小さな模型で追います。プロセスごとの仕事と共有する領域を区別し、メモリやファイルをどこに位置付ければよいかを理解します。", "flow": ["二つの接続を開き、同じSQLを送ったときに誰が処理するかを予想する。", "pg_backend_pid()とpg_stat_activityで接続とバックエンドを対応させ、クライアント・サーバの図を描く。", "一つのSELECTを解析・書き換え・計画・実行の順に追い、各段階の役割を説明する。", "Scan・Sort・Limitの小さな木で、行を要求する向きと返す向きを追う。", "バックエンド、共有メモリ、主要な裏方のプロセスを地図へ配置する。並列ワーカーの存在も位置付ける。", "別接続と共有できるものを読者に描いてもらい、実際に読むデータの保存先へ進む。"]}, {"number": 3, "title": "第3章：テーブルの行は、どこに保存されているのか", "file": "03-pages-and-storage.md", "prerequisite": "第2章：SQLを実行するプロセス。", "outcome": "行数・ページ数・バイト数を区別し、索引と表の位置関係を説明する。", "scope": "ページの役割と行の場所まで。TOASTは入口、生ページの詳細と全forkの構造は補足。", "sections": [{"title": "3-1 論理的な表と物理的な保存先", "items": ["booksの数行と列定義を確認し、SQLから見える表と実際の格納を区別する。", "pg_relation_filepath、pg_relation_size、pg_total_relation_sizeで、保存先とサイズの違いを観察する。", "通常テーブルのデータ、索引、TOASTなどが別の領域を持つことを説明する。ファイル名の全規則は補足にする。"]}, {"title": "3-2 ファイルの中のページ", "items": ["SHOW block_sizeで実験環境のページサイズを確認する。標準的なサイズを、すべての環境で不変とは書かない。", "ページ内に管理情報と行を配置する模型を描く。実際のバイト単位の配置図とは区別する。", "行数だけで表のサイズが決まらないことを、行幅の異なる小さな表で調べる。", "ページ数と行数を別々の単位として表へ記録する。"]}, {"title": "3-3 行の場所と主キーは別のもの", "items": ["ctidを観察し、ブロック番号とページ内の位置を示す手掛かりとして使う。", "ctidを永続的な識別子として使わない。更新で場所が変わる話は第11章へつなぐ。", "主キー値、索引中の情報、表の行の場所を対応図にする。索引の木は第6章で扱う。"]}, {"title": "3-4 行が大きいと何が変わるか", "items": ["同じ件数でも幅が違うと読むページ数が変わるという予想を立てる。", "長い値には圧縮や別領域への保存が関わることをTOASTの入口として説明する。", "文字列を増やせば必ずそのまま表のサイズが増える、という実験設計を避ける。実際のサイズを確かめる。", "pageinspectによる生ページ観察は任意の補足とし、必須の準備を増やしすぎない。"]}, {"title": "章末の課題とつながり", "items": ["同じ100万行なら、二つの表の読み込み量も同じかを理由付きで答える。", "ランキングへの接続：行数だけでなく、どれだけのページと列を処理するかも考える必要がある。", "次の問い：必要なページは、SQLを実行するたびにストレージから読み直すのか。"]}], "summary": "SQLの表は、物理的にはファイルやページに保存されています。表のサイズや行の位置を観察し、行数・ページ数・バイト数を別々の量として捉えます。索引から表を参照する関係や、長い値を保存する仕組みの入口にも触れます。同じ件数でも読み込み量が違う理由を説明するための土台を作る章です。", "flow": ["booksの数行を表示し、この行がどこに保存されているかを問いにする。", "保存先とサイズを調べ、論理的な表と、表・索引などの物理的な領域を対応させる。", "ページサイズを確認し、一つのページに管理情報と複数の行がある模型を描く。", "ctidを手掛かりに行の位置を観察し、永続的な主キーとの違いを説明する。", "同じ行数で行幅を変え、サイズがどう変わるか調べる。長い値とTOASTを補足する。", "行数だけでは読むページ数を決められないと整理し、ページをどこから読むかへ疑問を移す。"]}, {"number": 4, "title": "第4章：同じSQLでも時間が変わるのはなぜか", "file": "04-memory-and-buffers.md", "prerequisite": "第2章：共有範囲、第3章：ページ。", "outcome": "shared hit/readから分かることと分からないことを言い、計測条件をそろえる。", "scope": "共有バッファ・OSキャッシュ・作業用メモリの区別まで。置換アルゴリズムの実装やOSの調整は発展。", "sections": [{"title": "4-1 測る前に、どこにデータがあるか予想する", "items": ["通常テーブルを対象にEXPLAIN (ANALYZE, BUFFERS)を複数回実行する。", "行数、計画、shared hit/read、時間を同じ表へ記録する。2回目が必ず速いという結末を決めない。", "キャッシュ状態、他の負荷、計測自体の影響を考え、時間差だけから原因を断定しない。"]}, {"title": "4-2 共有バッファを経由してページを使う", "items": ["バックエンド、共有バッファ、OSキャッシュ、ファイルの関係を図示する。", "shared hitは共有バッファ内でのヒット、shared readはそこへ読み込んだブロックとして解釈する。", "shared readを物理ストレージへのアクセスと同一視しない。OS側のキャッシュはこの値だけでは分からない。", "SQLの結果をキャッシュする仕組みと、表や索引のページを保持する仕組みを区別する。"]}, {"title": "4-3 バッファの読み方で誤解しやすいこと", "items": ["アクセス回数と、異なるページの個数を区別する。同じページに繰り返し触れる場合がある。", "親子ノードのBUFFERSを単純合計しない。どの範囲の値を比較しているか明記する。", "一時テーブルで使うlocalと、ソートなどの一時ファイルに関わるtempを区別する。", "本の主実験は通常テーブルで統一する。序章の旧ログが一時テーブルなら条件の差を明示する。"]}, {"title": "4-4 メモリを役割で整理する", "items": ["shared_buffersはページの共有領域、work_memはソートやハッシュなどの処理で使う基準として整理する。", "work_memを接続一つ分の総メモリ上限と説明しない。複数の処理・接続・ワーカーの関与を第7章・第9章で詳しく扱う。", "temp_buffersとmaintenance_work_memは、対象となる仕事を対応表で紹介する。", "OSキャッシュやプロセス自身のメモリもあり、一つの設定だけでDB全体の使用メモリは決まらないと示す。"]}, {"title": "4-5 条件を変えても比較できる計測", "items": ["初回と繰り返し実行の結果を分け、バージョン・データ・設定を残す。", "サーバ再起動だけでOSキャッシュも消えるとは扱わない。OSキャッシュ削除は必須実験にしない。", "別接続でもページを共有できることを調べる実験を候補にし、共有が観察できた範囲だけ述べる。"]}, {"title": "章末の課題とつながり", "items": ["「2回目が速いからSQLが最適化された」という説明に、ほかの仮説と確認項目を挙げる。", "ランキングへの接続：改善前後はキャッシュ状態と計画を含めて比較する。", "次の問い：ページの所在が分かったところで、何ページを調べる方法なのかを考える。"]}], "summary": "同じSQLを繰り返し実行し、時間とBUFFERSの表示を比較します。ページを使う経路を、バックエンド・共有バッファ・OSキャッシュ・ファイルの関係として整理します。共有バッファと作業用メモリ、一時テーブルと一時ファイルも区別します。観測値から言える範囲を押さえ、改善前後を比較するための測定条件を考えられるようになります。", "flow": ["同じ検索を複数回実行し、計画・行数・時間・BUFFERSに何が変わるか予想して記録する。", "ページの読み込み経路を図解し、shared hitとshared readを対応させる。", "OSキャッシュを加え、readだけでは物理ストレージの読み込みを断定できない理由を説明する。", "アクセス回数とページの種類数、親子ノードの集計範囲、localとtempの違いを整理する。", "各メモリ設定を役割別に並べ、共有ページ・処理の作業領域・メンテナンスを区別する。", "初回と繰り返し実行の条件を残す比較方法をまとめ、時間差への別の仮説を挙げる課題で締める。"]}, {"number": 5, "title": "第5章：1冊を探すために、何冊調べているのか", "file": "05-linear-search.md", "prerequisite": "第1章：行数、第3章：ページ、第4章：BUFFERS。", "outcome": "件数や位置を変えたときの走査量を予想し、LIMITの効果を検証する。", "scope": "走査を手で追い、仕事量の増え方を説明する。CPU命令やSIMDの実装は扱わない。", "sections": [{"title": "5-1 データ量と仕事量の関係を予想する", "items": ["題名検索を固定して、booksを1,000冊・10万冊・100万冊へ増やす。", "実験で並列実行などを制御する理由と、本番向け推奨設定ではないことを示す。", "予想する項目を「返す行数・除外する行数・時間」に分ける。"]}, {"title": "5-2 増やして測り、線形探索に名前を付ける", "items": ["同じ条件のSQLを実行し、結果を比較表にする。", "少数のカードを順番に調べる模型で、表全体を走査する仕事を説明する。", "件数に応じて確認する仕事が増えることを示してからO(n)を導入する。", "計算量は時間を正確に予言する式ではない。キャッシュなどで時間の倍率は変わる。"]}, {"title": "5-3 見つけたら止めればよいのか", "items": ["題名が一意とは限らないことを確認する。", "LIMITなし、LIMIT 1、該当行なしで、必要な走査がどう変わるかを予想する。", "物理的に早く出会う行と遅く出会う行で比較する。ORDER BYなしの取得順は保証されない。", "「たまたま早く見つかった」と「いつでも少ない仕事で探せる」を区別する。"]}, {"title": "5-4 行だけでなくページを見る", "items": ["表がページの集まりであることを図示する。", "BUFFERSを導入し、行数とページアクセスを異なる単位として読む。", "番号検索と題名検索を比較し、後者は表を広く読むことを確かめる。", "ページアクセス数を、そのまま物理ディスクの読み取り回数とは呼ばない。"]}, {"title": "章末の課題とつながり", "items": ["「LIMIT 1を付けたので、大きな表でも問題ない」という提案の確認条件を挙げる。", "ランキングへの接続：返す件数を20にしても、途中で調べる件数が減るとは限らない。", "次の問い：番号検索は、どうやって途中の本を調べずに済ませているのか。"]}], "summary": "本が増えたとき、1冊を探す仕事はどれだけ増えるのでしょうか。検索条件を固定してデータ量を増やし、返した行・除外した行・ページアクセスを比べます。LIMITによる途中終了や、見つからない場合も試します。線形探索の仕事量を具体例から理解し、「少数の結果なら軽い」という判断を自分で確かめられるようになります。", "flow": ["題名検索を固定し、本が増えたときの結果件数・除外行数・時間をそれぞれ予想する。", "実験設定をそろえ、1,000冊・10万冊・100万冊へ増やして比較する。", "カードを順番に調べる模型と観測値をつなぎ、その後で線形探索とO(n)に名前を付ける。", "LIMIT 1、該当行の位置、該当行なしを比べ、途中で止まれる条件を考える。", "第3・4章のページとBUFFERSを使い、行数だけでなくアクセス量からも仕事を比べる。", "「LIMIT 1だから安心」という提案を検討し、番号検索が途中を飛ばせる仕組みへ進む。"]}, {"number": 6, "title": "第6章：B-treeは、どうやって探す場所を絞るのか", "file": "06-btree-index.md", "prerequisite": "第3章：表と索引、第5章：全件走査との比較。", "outcome": "一点検索・範囲検索・大量取得で、索引が減らす仕事と残す仕事を説明する。", "scope": "根から葉、葉から表、分割の必要性、維持負担まで。競合制御と分割の厳密な実装は補足。", "sections": [{"title": "6-1 索引そのものも大きいのに、なぜ速く探せるか", "items": ["表と主キー索引の大きさを確認する。", "「索引も先頭から全部読んでいたら同じでは？」という疑問を置く。", "表の行、索引のキー、行の場所への参照の関係を図示する。"]}, {"title": "6-2 小さな木を手でたどる", "items": ["具体的な番号を持つ根・内部・葉のページを描く。", "目的の番号を一つ選び、どの枝へ進むか読者に予想してもらう。", "ページの境界にある番号や、存在しない番号でもたどる。", "模型の小さな分岐数と、実際のPostgreSQLのページを区別する。"]}, {"title": "6-3 実際の索引と検索を対応させる", "items": ["実験用の観察手段で索引の高さなどを確認する。拡張の準備は補足へ置く。", "根から葉、必要なら表へ進む経路をBUFFERSの観察と結び付ける。", "初回の追加アクセスを含め、計測値が常に木の段数と一致するとは説明しない。", "データ量と木の高さの関係を示してからO(log n)を導入する。"]}, {"title": "6-4 題名にも索引を作る", "items": ["CREATE INDEXの前後で同じ題名検索を比較する。", "読む範囲・計画・時間の変化を記録する。", "一点検索の成果を、すべての検索条件へ一般化しない。"]}, {"title": "6-5 一点検索から範囲検索へ", "items": ["葉のキーの順序と、範囲内の複数の項目を読む流れを図示する。", "一致する割合を変え、木を降りる仕事と、その後に読む仕事を分ける。", "ページが埋まれば分割が必要になることを模型で紹介する。挿入ごとに分割が起きるとは説明しない。", "大量取得の索引利用は第8章、選択理由は第10章、更新後の可視性は第11章で回収する。"]}, {"title": "6-6 索引を増やす判断には維持の仕事も入る", "items": ["保存容量、作成時間、INSERTやUPDATE時の維持を説明する。", "性能差を掲載する場合は条件をそろえた実測を使う。仕組みの説明から倍率を捏造しない。", "「すべての列に索引を付ける」という案に、利用する検索条件を確認する問いを返す。"]}, {"title": "章末の課題とつながり", "items": ["1件だけ返す検索と、大半の行を返す検索で同じ効果があるか予想する。実証は後続章で回収する。", "ランキングへの接続：索引で減らせる仕事は何か。集計や並べ替えまで消えるのかは未解決。", "次の問い：見つけた読了記録を、新しい順に並べるには何が必要か。"]}], "summary": "索引自体も多くのページを持つのに、B-treeは目的の場所を少ない段数で絞り込みます。小さな木を手でたどり、実際の索引の高さやページアクセスと対応させます。一点検索から範囲検索へ条件を広げ、表の行を取り出す仕事と索引を維持する仕事も考えます。索引の効果を、使ったかどうかだけでなく減らした仕事から説明する章です。", "flow": ["表と索引の大きさを確認し、索引も全部読むなら速くならないはず、という疑問を置く。", "具体的な番号を持つ小さな木で、根から葉までの探索を予想しながらたどる。", "実際の索引の高さや検索時のページアクセスを観察し、模型との対応と違いを整理する。", "題名に索引を追加し、同じ検索の前後で計画・アクセス量・時間を比較する。", "一点検索から範囲検索へ広げ、木を降りる仕事と、その後に多くの行を読む仕事を分ける。", "保存容量、挿入・更新、ページ分割の必要性を扱い、検索の利益と維持の負担を考える。", "索引を採用する条件を言葉にし、次の章の「見つけた行を並べる」仕事へつなぐ。"]}, {"number": 7, "title": "第7章：並べ替えの仕事と、メモリの境界を観察する", "file": "07-sort.md", "prerequisite": "第2章：実行器、第4章：作業メモリ、第5章：仕事量。", "outcome": "Sortの方式と一時ファイルを観察し、件数とメモリの影響を分ける。", "scope": "比較・分割・合流の模型とwork_memまで。ソート実装の網羅や万能な設定値は目標にしない。", "sections": [{"title": "7-1 読了記録を新しい順に見たい", "items": ["ランキングの前に、日時で並べる単純な一覧を題材にする。", "読了記録を増やし、絞り込む件数と並べる件数を確認する。", "全件の結果表示や転送と、DB内部の処理時間を区別して測定する。"]}, {"title": "7-2 大小を比べ、順序を作る仕事", "items": ["少数の日時カードで比較と並べ替えを描く。", "データ量を変えた実験から、探索とは異なる仕事が加わることを観察する。", "比較ソートの仕事量の目安としてO(n log n)を紹介する。", "PostgreSQLが常に一つのソート方式を使うという説明にはしない。"]}, {"title": "7-3 実行計画でSortを見る", "items": ["Sort Key、Sort Method、Memoryなど、今回の出力に現れた項目を読む。", "子ノードから何行を受け取り、並べ替えて何行返すかを図にする。", "親ノードの時間は子の処理を含むため、ノードの時間を単純合計しない。", "ソート固有の時間を推定する場合は、計画の形と計測上の限界を説明する。"]}, {"title": "7-4 メモリに収まらなくなる", "items": ["データを固定してwork_memを変え、方式と一時ファイル利用の変化を確認する。", "小さく並べたまとまりを保存して合流させる模型で、外部ソートを説明する。", "work_memはサーバ全体の一つの共通予算ではない。増やす判断には同時実行も関わる。", "実験後に設定を元へ戻す手順を明示する。"]}, {"title": "7-5 表の読み込みと作業用メモリを区別する", "items": ["shared_buffers、表・索引のファイル、ソートの作業領域を図で分ける。", "shared hitとreadを説明する。readでもOSのキャッシュから読む場合がある。", "「2回目が速かった」だけで理由を一つに決めず、観察事実と仮説を分ける。", "索引の順序を利用できる可能性を紹介し、上位件数との組み合わせは次章へ送る。"]}, {"title": "7-6 作業メモリをプロセスの地図に戻す", "items": ["第4章の地図にSortの作業領域と一時ファイルを書き足す。", "複数のソート・接続・並列ワーカーがあるとき、work_memの値だけでは全体の上限にならない理由を説明する。", "第4章で扱ったshared hit/readは短く復習し、ソートのtemp read/writtenと比較する。"]}, {"title": "章末の課題とつながり", "items": ["「work_memを増やせば直る」という助言について、実際にメモリ不足でソート方式が変わっているかを確認する。", "ランキングへの接続：何を何件並べるかが重要。表示する20件だけで仕事量は決まらない。", "次の問い：上位20件だけなら、すべての順位を確定する必要があるか。"]}], "summary": "読了記録を新しい順に並べるために、どんな仕事が必要でしょうか。少数の値の比較から始めて、実行計画のSortと対応させます。件数とwork_memを別々に変え、メモリ内での処理と一時ファイルを使う処理を観察します。作業メモリをプロセスの地図へ戻し、並べ替えが遅いときに何を確認すべきかを整理します。", "flow": ["日時順の一覧を題材にし、絞り込む行数と並べる行数を確認する。", "日時カードを比べる模型で仕事を数え、比較ソートとO(n log n)の見方を導入する。", "Sortの入力行数・キー・方式・メモリを読み、親ノードの時間に子の処理が含まれることを確認する。", "データを固定してwork_memを変え、メモリ内の処理と外部ソートを比較する。", "一時ファイルへの分割・合流を図示し、表のsharedと作業中のtempを分けて読む。", "複数の処理・接続が使う作業領域を図に戻し、単にメモリを増やす案の確認条件をまとめる。", "上位20件だけ欲しいときも全体を並べる必要があるか、という問いを次章へ残す。"]}, {"number": 8, "title": "第8章：上位20件だけを選ぶには", "file": "08-top-n-heap.md", "prerequisite": "第6章：索引順、第7章：全体のソート。", "outcome": "候補の保持量、入力の走査量、結果件数を分け、二つの上位取得方法を比較する。", "scope": "ヒープの更新を具体例で追い、索引順で止まれる条件まで。コード実装と厳密な証明は任意課題。", "sections": [{"title": "8-1 LIMITで何が減るか予想する", "items": ["日時順の一覧にLIMIT 20を付ける。", "「読む行数・保持する候補数・返す行数」を別々に予想する。", "LIMITなしとの比較で、出力件数が減っても走査が残る場合を確認する。"]}, {"title": "8-2 少数の候補を残し続ける", "items": ["説明用に上位3件を選ぶ模型へ縮める。", "新しいカードが来たとき、候補に入れるか、捨てるかを読者に判断してもらう。", "候補内の境界となる要素を効率よく取り出すヒープを図示する。", "木全体が完全にソートされているわけではないことを示す。", "表の格納先を指す「ヒープ」と、今回のデータ構造のヒープを区別する。"]}, {"title": "8-3 top-N heapsortと模型をつなぐ", "items": ["実測のSort Methodとメモリ量を観察する。", "n件からk件を選ぶ仕事の目安としてO(n log k)と候補の保持量を説明する。", "LIMITがあるだけで、常にこの方式になるとはしない。", "kを大きくした場合はどうなるかを追加課題にする。"]}, {"title": "8-4 順序を持つ索引なら、途中で止まれるか", "items": ["日時の索引を用意し、上位20件取得の前後を比べる。", "索引順に読み、条件を満たす必要件数を得たところで止まる流れを描く。", "Sortの有無、アクセスしたページ、実際に返した行を確認する。", "同じ日時の行がある場合、安定した順序には追加の並び順が必要なことを押さえる。"]}, {"title": "8-5 索引があるのに、遅くなる場合を考える", "items": ["同じ索引を持つ状態で、取り出す件数を大きくした実験を比べる。", "索引から表へ何度もアクセスする動きと、表を走査する動きを図で対比する。", "この結果だけで遅さの原因を断定せず、計画・アクセス量などの根拠を添える。"]}, {"title": "章末の課題とつながり", "items": ["「日時順の上位20件」と「読了数順の上位20冊」は、同じ索引で解決できるか考える。", "ランキングへの接続：集計で生まれる読了数は、元の日時順とは違う。まず数える仕事が残る。", "次の問い：記録に本の情報を付け、同じ本の記録を数えるにはどうするか。"]}], "summary": "上位20件だけが必要なとき、すべての順位を確定する必要はあるのでしょうか。少数の候補を保つヒープを具体例で追い、top-N heapsortの出力と対応させます。さらに索引の順序を利用する取得方法と比較します。調べる件数・候補として保持する件数・返す件数を分け、LIMITが減らす仕事を説明できるようになります。", "flow": ["前章の一覧にLIMITを付け、走査量・保持量・結果件数のどれが減るか予想する。", "LIMITの前後を測り、少数の結果でも入力全体を読む場合があることを観察する。", "上位3件のカード模型で候補の入れ替えを追い、ヒープの部分的な順序を理解する。", "top-N heapsortの表示、候補の保持量、nとkによる仕事の増え方を模型につなぐ。", "日時の索引を追加し、順序を利用して必要な件数で止まれる場合を比較する。", "取得件数を増やし、同じ索引が必ず有利とは限らないことを観察する。", "日時順と読了数順のランキングは同じかを問い、数える・組み合わせる処理へ進む。"]}, {"number": 9, "title": "第9章：本と読了記録を組み合わせ、数える", "file": "09-join.md", "prerequisite": "第6章：索引、第7章：ソート、第8章：入力を減らす意味。", "outcome": "結合方式を手で追い、入力件数・反復回数・グループ数から仕事を説明する。", "scope": "3方式とハッシュ集約、メモリ不足時の入口まで。高度な結合順序探索は第10章の補足。", "sections": [{"title": "9-1 20件の記録に題名を付けたい", "items": ["ER図に戻り、book_idから本を見つける必要を確認する。", "3件程度の記録と本の表を紙上で結合する。", "主キーの一意性、該当する本の有無、重複で結果件数がどう変わるかを意識する。"]}, {"title": "9-2 少ない件数を繰り返し探す：Nested Loop", "items": ["20件の記録それぞれから本を索引で探す流れを描く。", "実行計画のloopsを読み、「何回繰り返したか」を確認する。", "actual rowsやtimeがループ当たりの平均として表示される点をここで説明する。", "Nested Loopという名前だけで遅い方式と判断しない。"]}, {"title": "9-3 大量の行を組み合わせる：Hash Join", "items": ["対象を多数の記録に増やし、同じ探し方が適切か予想する。", "一方の入力から検索用のハッシュ表を作り、他方の入力で照合する模型を描く。", "ハッシュ値だけで同一と決めず、キーの一致を確認することも示す。", "準備の仕事と照合の仕事、メモリ使用量を分けて読む。"]}, {"title": "9-4 並んだ入力を合流させる：Merge Join", "items": ["同じ結合キー順に並ぶ二つの列を、指を進めながら照合する模型にする。", "入力の並び順が必要であり、その準備にも仕事がかかることを説明する。", "設定で方式を観察する場合、仕組みを見る実験であることと設定の復元を明示する。", "3方式の比較表は「最速ランキング」ではなく、得意な条件と準備するものを示す。"]}, {"title": "9-5 同じ本の記録をまとめて数える", "items": ["book_idごとのカウンタを更新する小さな例で集約を説明する。", "Hash Joinの対応付けと、HashAggregateのグループごとの集計を区別する。", "入力行数とグループ数の違いを図示する。", "ほぼ全行が別グループになる場合と、少数グループになる場合の保持量を予想する。"]}, {"title": "9-6 ハッシュ表がメモリに収まらないとき", "items": ["work_memとhash_mem_multiplierの関係を確認し、ソートとハッシュ処理の予算を区別する。", "HashのBatchesや一時ファイルの表示を観察し、入力を分けて処理する模型につなぐ。", "Hash JoinとHashAggregateでは観察する表示が異なるため、同じ項目名をそのまま当てはめない。", "第10章へ向け、実行前に入力行数をどう見積もるかを問いにする。"]}, {"title": "章末の課題とつながり", "items": ["本の題名を全記録に付けてから数える必要があるかを問いにする。", "「先に数え、上位を決めてから題名を付ける」案は、いつ同じ結果になるか考える。", "タイトルによる絞り込みがある場合や、結合相手が複数行ある場合は、順序変更の意味を再確認する。", "ランキングへの接続：探す・並べる・組み合わせる・数える部品がそろった。次章では、これらの方法をPostgreSQLがどう選ぶのかを調べる。"]}], "summary": "読了記録に題名を付け、本ごとに読了記録を数える処理を学びます。少数の行を繰り返し探す方法から始め、大量の行をハッシュ表で照合する方法、並んだ入力を合流させる方法へ広げます。集約では入力行数とグループ数を区別し、メモリとの関係も観察します。結合や集計の前に行を減らす案を、意味と仕事量の両面から考える章です。", "flow": ["ER図と少数の行で、読了記録へ題名を付ける作業を手で行う。", "20件を索引で繰り返し探すNested Loopを観察し、loopsとループ当たりの値を読む。", "対象を大量の行へ広げ、Hash Joinの準備と照合を小さなハッシュ表で追う。", "並んだ二つの入力を合流させるMerge Joinを追い、入力を並べる準備も比較する。", "本ごとのカウンタを更新するHashAggregateを描き、入力行数とグループ数を分ける。", "ハッシュ表がメモリに収まらない場合を観察し、予算と分割処理を結び付ける。", "先に集計してから題名を付けても同じ結果になる条件を考え、処理方式を選ぶプランナへ進む。"]}, {"number": 10, "title": "第10章：PostgreSQLは、なぜその計画を選んだのか", "file": "10-planner-and-statistics.md", "prerequisite": "第5〜9章：選択可能な処理方式。", "outcome": "推定と実測のずれを見つけ、統計更新や代替計画を比較する手順を立てる。", "scope": "基本統計と見積もりの伝播まで。拡張統計、Memoize、並列計画は用途と限界の紹介。", "sections": [{"title": "10-1 同じ表でも選ぶ方法が変わる", "items": ["第6章・第8章の索引と、第9章の結合を振り返る。", "条件を狭くした場合と広くした場合で、推定行数と計画が変わるか予想する。", "プランナは実行前に見積もりで候補を比較するため、実測最速を常に保証するものではないと説明する。"]}, {"title": "10-2 件数の見積もりに使う統計情報", "items": ["ANALYZEとEXPLAIN ANALYZEの役割を明確に分ける。", "pg_statsのn_distinct・most_common_vals・histogram_boundsを、頻度表と分布図に対応させる。", "一様分布と偏りのある実験データで、同じWHEREの形でも対象割合が異なることを調べる。", "統計は標本に基づく見積もりであり、実件数の完全な写しではないと説明する。"]}, {"title": "10-3 小さなずれが後の仕事に影響する", "items": ["Scanの推定と実測を比べ、その後の結合やソートの見積もりとの関係を追う。", "loops当たりの値をそろえて比較し、出力rowsを走査全件数と混同しない。", "更新後にANALYZEを行う前後を比べる実験を計画する。autovacuumによる統計更新を記録し、前提が崩れたら結果をそのまま示す。"]}, {"title": "10-4 costは時間とどう違うか", "items": ["ページへのアクセスと行の処理を小さな模型で数え、見積もり値を比較する意味を説明する。", "startup costとtotal cost、LIMITがある場合の選択に注目する。", "random_page_costなどは考え方を紹介する範囲にとどめ、値を変えて望む計画へ誘導することを標準解にしない。", "enable_*での比較は診断実験として扱い、恒久的な解決と切り分ける。"]}, {"title": "10-5 まだ見積もれない関係を知る", "items": ["二つの列の条件に相関がある例を置き、独立に考える見積もりの限界を説明する。", "拡張統計はどんな問題に関わるかを紹介し、作成・適用範囲の詳細は補足へ送る。", "並列実行とMemoizeは、これまでの基本形を拡張する計画として紹介する。詳細比較は発展課題にする。"]}, {"title": "章末の課題とつながり", "items": ["「索引が使われないので強制しよう」という案に対し、推定・実測・代替計画を確認する手順を書く。", "ランキングへの接続：遅さを見たら、推定のずれなのか、見積もりが合っていても仕事が多いのかを分ける。", "次の問い：同じ索引を使っていても、更新やVACUUMで表へのアクセスが変わるのはなぜか。"]}], "summary": "PostgreSQLは実行前に行数や仕事量を見積もり、処理方法を選びます。条件の広さやデータの偏りを変え、統計情報・推定行数・実際の計画を対応させます。costを実時間と区別し、推定のずれが後続の処理へ及ぼす影響を考えます。期待と違う計画を見たとき、何を確かめてから改善を試すかを組み立てる章です。", "flow": ["条件を狭くした場合と広くした場合を比べ、同じ索引があっても選ぶ方法が変わるか観察する。", "頻度や分布の図とpg_statsを対応させ、推定行数の材料を説明する。", "各ノードの推定と実測を比べ、ずれが結合やソートの判断へどうつながるかを追う。", "データ変更とANALYZE前後の比較を通じて、統計の更新と実行時の計測を区別する。", "ページと行の仕事を見積もる模型でcostを説明し、startup・total・LIMITの関係を見る。", "列の相関、拡張統計、並列計画、Memoizeを発展の入口として位置付ける。", "計画を強制する前の確認手順をまとめ、統計だけでは説明できない更新・可視性の話へつなぐ。"]}, {"number": 11, "title": "第11章：更新された行と、読み手から見える行", "file": "11-mvcc-and-maintenance.md", "prerequisite": "第2章：プロセス、第3章：ページ、第4章：共有バッファ、第6章：索引。", "outcome": "更新・可視性・VACUUM・表への追加アクセスを結び付け、読み込みと更新の両方を考える。", "scope": "MVCC、可視性マップ、VACUUM、WALとcheckpointの役割まで。回復手順、分離レベル全種、レプリケーションは発展。", "sections": [{"title": "11-1 二つの接続で見えるものを比べる", "items": ["第2章の二つの接続を使い、更新をCOMMITする前後で見える値を比べる。", "Read CommittedとRepeatable Readではスナップショットのタイミングが異なるため、実験の分離レベルを先に固定する。", "トランザクションとスナップショットの時間軸を図示する。全分離レベルの網羅はしない。"]}, {"title": "11-2 UPDATEと行のバージョン", "items": ["更新が新しい行バージョンを作ることを、表のページと結び付ける。", "主キーとctidの役割の違いを再確認する。xmin・xmaxは入口として扱い、単純な数値比較だけで可視性が決まるとは説明しない。", "古いバージョンが必要な読み手がいる場合、すぐに回収できないことを模型で示す。", "HOTは索引更新との関係を補足で紹介し、細かな適用条件は対象版の資料で確認する。"]}, {"title": "11-3 VACUUMとANALYZEは別の仕事", "items": ["不要になった行バージョンの領域を再利用可能にする仕事と、統計情報を更新する仕事を分ける。", "通常のVACUUMでファイルが必ず小さくなるとは説明しない。領域の再利用とOSへの返却を区別する。", "autovacuumが担当するメンテナンスと、長いトランザクションが回収を妨げる関係を示す。"]}, {"title": "11-4 Index Only Scanでも表を見に行く理由", "items": ["必要な列が索引にあることと、行が読み手に見えると確認できることを別の条件にする。", "可視性マップとHeap Fetchesを、索引・表・補助情報の図へ対応させる。", "VACUUM後、更新後、再びVACUUM後を比較する実験を計画する。計画選択やautovacuumの影響も記録する。", "索引の利用だけでは更新後の性能を説明し切れないことを、観察できた範囲で結論にする。"]}, {"title": "11-5 変更を残す仕組みの地図", "items": ["共有バッファ上の変更されたページ、WAL、データファイルを区別する。", "先行書き込みとCOMMITの耐久性を、標準的な設定を前提に説明する。", "WAL writer・checkpointer・background writerの役割を整理し、COMMITのたびに全データページを保存するとは説明しない。", "ページを更新する仕事、可視性の判断、クラッシュからの回復を別の目的として結び付ける。復旧操作やレプリケーションは発展資料へ送る。"]}, {"title": "章末の課題とつながり", "items": ["「索引に列が全部あるから、更新後も表を読む必要はない」という説明の不足を指摘する。", "ランキングへの接続：事前集計にも更新・訂正・削除を反映する仕事があり、読む速さだけでは採用を決められない。", "次の章で、処理方式・メモリ・統計・更新を含めてランキング改善を判断する。"]}], "summary": "更新中の表を複数の接続から読むと、同じ行でも見える値が異なることがあります。スナップショットと行のバージョンを観察し、不要な領域の回収、可視性マップ、Index Only Scanを結び付けます。最後にWALとデータページの書き出しを整理します。読み取り性能を、更新・後片付け・耐久性まで含めて考えるための章です。", "flow": ["二つの接続で更新とCOMMITを観察し、分離レベルを固定した時間軸に見える値を書き込む。", "更新前後の行バージョンをページの模型で示し、読み手が必要とする古い情報を考える。", "VACUUMとANALYZEを役割で分け、autovacuumと長いトランザクションの関係を説明する。", "索引に必要な列があることと、行が見えることを区別し、可視性マップを導入する。", "更新・VACUUM前後でHeap Fetchesを比べ、Index Only Scanと表へのアクセスを対応させる。", "共有バッファの変更、WAL、データファイルを図示し、COMMITとページ書き出しの違いを整理する。", "読み込みの速さだけでは更新を伴う設計を評価できないとまとめ、ランキングの最終判断へ戻る。"]}, {"number": 12, "title": "第12章：ランキングを読み解き、改善を選ぶ", "file": "12-ranking-revisited.md", "prerequisite": "第1〜11章の観察・アルゴリズム・内部構造。", "outcome": "AIや検索で得た改善案について、前提・実験・結果・代償を示し採用を判断する。", "scope": "同じ条件での比較とサービス要件による判断まで。本番監視基盤や集計更新基盤の構築は別テーマ。", "sections": [{"title": "12-1 序章の予想を開く", "items": ["序章で選んだ改善案と理由を読み返す。", "SQL、データ、索引、設定を確認し、現在の基準値を測る。", "序章の約4.6秒と現在の実験値は、環境やDB状態が違えば直接の改善比較に使わない。"]}, {"title": "12-2 全体の計画を読める形へ直す", "items": ["スキャン・結合・集約・ソート・LIMITを、行の流れの図に対応させる。", "各段に入力行数と出力行数を添え、どこで大量の行を扱っているか確認する。", "推定と実測の行数を比較し、見積もりの大きなずれがあるか調べる。", "時間は子の処理を含むこと、loopsや並列実行で読み方が変わることに注意する。", "各ノードの時間を「クエリ開始からの絶対時刻」として扱わない。差分の内訳は条件付きの概算とする。"]}, {"title": "12-3 改善案ごとに、減らす仕事を予想する", "items": ["案1：日時などに索引を追加し、対象行へのアクセスを変える。", "案2：記録を集計して上位20冊を決め、その後で本を結合する。", "案3：集計結果を保存し、表示時に行う仕事を減らす。", "各案について、減る処理・残る処理・新しく増える負担を先に表へ書く。"]}, {"title": "12-4 案1：索引でどこまで変わるか", "items": ["同じ基準条件から索引を変え、計画と実測を比較する。", "検索経路が変わっても、結合や集計の入力が多く残る可能性を観察する。", "Index Only Scanなど新しい表示は、この判断に必要な範囲で補足する。", "差が小さい場合は測定のばらつきも確認し、数値一つで優劣を断定しない。"]}, {"title": "12-5 案2：組み合わせる件数を減らす", "items": ["変更前後のSQLと行の流れを並べる。", "先に集計・上位選択を行うと、どの段の入力が減るか予想してから測る。", "速さと別に、同じ結果になることを確認する。", "主キー・外部キー、対象期間、同数時の順位規則など、書き換えが成立する前提を明示する。", "一つのサンプルで結果が一致したことと、一般に意味が等しいことを区別する。"]}, {"title": "12-6 案3：いつ計算するかを変える", "items": ["集計表の作成と読み出しを、別々に測る。", "表示が速くなっても、集計を作る仕事は別の時点に移っていることを図示する。", "更新頻度、遅れて届く読了記録、訂正・削除、週の切り替わりを設計上の問いにする。", "実装を全部作り込まず、鮮度・運用負担・保存容量を比較材料にする。"]}, {"title": "12-7 このサービスで採用する案を決める", "items": ["同じ環境での実測、結果の正しさ、鮮度、追加負担を比較表にする。", "許容する応答時間と鮮度を物語上の要件として明示してから判断する。", "読者にも「採用案・根拠・追加で確認したいこと」を3行で書いてもらう。", "要件を「即時反映が必要」「数分の遅延を許容」に変えた場合、選択が変わるか考える。"]}, {"title": "12-8 AIや検索で得た提案を、自分で確かめる", "items": ["例題：「日時に索引を作れば改善する」という提案を受け取る。", "提案の前提、減るはずの処理、確認する出力を読者が言語化する。", "追加実験案として、対象期間を1日・1週間・全期間へ変える。結果は測る前に決めない。", "回答が妥当かを印象で選ばず、実行計画・実測・サービス要件から説明する。", "最後は初見の条件でも「次に何を調べれば判断できるか」を挙げられることを到達点にする。"]}, {"title": "12-9 3つの知識を使った説明を完成させる", "items": ["EXPLAINのノード、アルゴリズム、プロセス・メモリ・ページの対応を、一つの計画について説明する。", "遅い理由をCPU・I/O・メモリのどれかへ、証拠なしに断定しない。追加観測が必要なら明記する。", "第10章の統計、第11章の更新状態も比較条件に入れる。", "最終課題は「提案→減る仕事の予想→条件をそろえた比較→同じ結果の確認→要件から判断」を短い調査メモとして書く。"]}], "summary": "序章のランキングを、ここまで学んだ観察方法・アルゴリズム・内部構造から読み解きます。索引の追加、集計と結合の順序の変更、事前集計について、減る仕事と残る仕事を予想して比較します。結果が同じか、必要な鮮度を満たすか、更新の負担は何かも確かめます。AIや検索で得た案を、自分の条件と根拠で判断するところまでを本の到達点にします。", "flow": ["序章で選んだ改善案を振り返り、現在のデータ・索引・設定・更新状態で基準を測る。", "計画を行の流れへ描き直し、推定と実測、繰り返し、ページアクセスから多くの仕事が残る箇所を探す。", "3つの改善案について、どの仕事が減り、何が残り、新しい負担は何かを先に予想する。", "索引の追加を比較し、検索経路の変化と結合・集約に残る仕事を確認する。", "先に集計・上位選択してから本を結合する案を試し、意味が同じになる前提と結果の一致を確かめる。", "事前集計の作成と読み出しを分けて測り、更新・訂正・削除・鮮度の責任を考える。", "応答時間と鮮度の要件を明示して採用案を選び、要件が変わった場合も考える。", "初見の提案に対する確認手順を整理し、3領域の知識を使った短い調査メモを最終課題として書く。"]}], "edges": [{"to": "executor", "reason": "バックエンドが計画に従って実行する", "from": "process"}, {"to": "explain", "reason": "計画の木を出力として観察する", "from": "executor"}, {"to": "buffers", "reason": "複数のバックエンドがページを共有する", "from": "process"}, {"to": "buffers", "reason": "行ではなくページを読み込み・保持する", "from": "pages"}, {"to": "os-cache", "reason": "共有バッファにないページもOS側にある場合がある", "from": "buffers"}, {"to": "toast", "reason": "長い値は別領域への参照が関わる", "from": "pages"}, {"to": "work-mem", "reason": "接続や処理が増えると作業領域も増えうる", "from": "process"}, {"to": "temp-buffers", "reason": "共有するページと一時テーブルのページを区別する", "from": "buffers"}, {"to": "maintenance", "reason": "検索処理とメンテナンスの予算を分ける", "from": "work-mem"}, {"to": "seq", "reason": "ページをたどって行の条件を調べる", "from": "pages"}, {"to": "btree", "reason": "全件を調べる仕事と、場所を絞る仕事を比べる", "from": "seq"}, {"to": "btree", "reason": "索引のページから表の行の場所へ進む", "from": "pages"}, {"to": "btree", "reason": "読む量を減らす効果と再利用の効果を分ける", "from": "buffers"}, {"to": "sort", "reason": "結果を返す前に入力を集める処理を知る", "from": "executor"}, {"to": "sort", "reason": "収まらない場合は一時ファイルの仕事が加わる", "from": "work-mem"}, {"to": "heap", "reason": "全体を並べる方法と上位候補だけを保持する方法", "from": "sort"}, {"to": "heap", "reason": "順序を持つ索引なら上位取得の走査を減らせる場合がある", "from": "btree"}, {"to": "nested", "reason": "内側の繰り返し検索に索引を使う", "from": "btree"}, {"to": "hash", "reason": "繰り返し検索と、照合用の表を準備する方法を比べる", "from": "nested"}, {"to": "merge", "reason": "並んだ入力を用意して合流させる", "from": "sort"}, {"to": "aggregate", "reason": "ハッシュ表を照合とグループ集計で使う", "from": "hash"}, {"to": "hash", "reason": "hash_mem_multiplierも含めて予算を考える", "from": "work-mem"}, {"to": "aggregate", "reason": "グループ数と保持する状態がメモリに影響する", "from": "work-mem"}, {"to": "cost", "reason": "行数の見積もりが処理のコストに影響する", "from": "stats"}, {"to": "executor", "reason": "候補を比較して実行計画を選ぶ", "from": "cost"}, {"to": "stats", "reason": "推定と実測の行数を比べる", "from": "explain"}, {"to": "btree", "reason": "索引があっても選ぶかどうかは見積もりによる", "from": "cost"}, {"to": "hash", "reason": "入力の見積もりが結合方式の選択につながる", "from": "cost"}, {"to": "mvcc", "reason": "更新前後の行バージョンを格納する", "from": "pages"}, {"to": "vacuum", "reason": "不要になったバージョンを回収する", "from": "mvcc"}, {"to": "visibility", "reason": "可視性マップを保守する", "from": "vacuum"}, {"to": "visibility", "reason": "列を取り出せることと行が見えることは別条件", "from": "btree"}, {"to": "visibility", "reason": "索引だけで返すにも可視性の確認が必要", "from": "mvcc"}, {"to": "wal", "reason": "メモリ上の変更と耐久性を分けて考える", "from": "buffers"}, {"to": "wal", "reason": "書き出しに関わるプロセスの役割を整理する", "from": "process"}, {"to": "precompute", "reason": "数える仕事を表示の前へ移す", "from": "aggregate"}, {"to": "precompute", "reason": "集計後の順序を用意して上位を取り出す", "from": "heap"}, {"to": "precompute", "reason": "訂正・削除・新規記録をいつ反映するか考える", "from": "mvcc"}, {"to": "precompute", "reason": "改善前後を同じ条件で比較する", "from": "explain"}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent);
const categories=[['観察と判断','計画を読み、根拠を持つ','var(--observe)'],['データ構造','仕事の増え方を理解する','var(--algo)'],['内部構造','プロセス・メモリ・保存','var(--internal)']];
const byId=new Map(DATA.nodes.map(n=>[n.id,n]));
const map=document.getElementById('map'),world=document.getElementById('world'),detail=document.getElementById('detail'),topic=document.getElementById('topic'),chapter=document.getElementById('chapter');
let selected='buffers',chapterId=null,scale=1,tx=0,ty=0,drag=null,moved=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groupCounts=[0,0,0];
for(let i=0;i<3;i++){const label=document.createElement('div');label.className='lane';label.style.left=(30+i*338)+'px';label.innerHTML=esc(categories[i][0])+'<small>'+esc(categories[i][1])+'</small>';world.append(label);}
for(const n of DATA.nodes){n.x=30+n.group*338;n.y=90+groupCounts[n.group]++*77;const b=document.createElement('button');b.className='node';b.type='button';b.id='node-'+n.id;b.style.cssText=`left:${n.x}px;top:${n.y}px;--c:${categories[n.group][2]}`;b.innerHTML='<small>'+esc(n.chapters.map(x=>x===0?'序章':'CH '+String(x).padStart(2,'0')).join(' · '))+'</small>'+esc(n.label);b.addEventListener('click',()=>{if(!moved)selectNode(n.id)});b.addEventListener('focus',()=>{if(document.activeElement===b){const r=b.getBoundingClientRect(),m=map.getBoundingClientRect();if(r.left<m.left||r.right>m.right||r.top<m.top||r.bottom>m.bottom)center(n)}});document.getElementById('nodes').append(b);const o=document.createElement('option');o.value=n.id;o.textContent=n.label;topic.append(o);}
for(const c of DATA.chapters){const o=document.createElement('option');o.value=c.number;o.textContent=c.title;chapter.append(o);}
for(const e of DATA.edges){const a=byId.get(e.from),b=byId.get(e.to),path=document.createElementNS('http://www.w3.org/2000/svg','path');let ax=a.x+266,ay=a.y+30,bx=b.x,by=b.y+30;if(a.group>b.group){ax=a.x;bx=b.x+266}if(a.group===b.group){ax=a.x+266;bx=b.x+266;path.setAttribute('d',`M${ax},${ay} C${ax+35},${ay} ${bx+35},${by} ${bx},${by}`)}else{const mid=(ax+bx)/2;path.setAttribute('d',`M${ax},${ay} C${mid},${ay} ${mid},${by} ${bx},${by}`)}path.classList.add('edge');e.element=path;document.getElementById('edges').append(path);}
function transform(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function fit(all=false){scale=Math.min(map.clientWidth/1030,map.clientHeight/1040);if(map.clientWidth<600&&!all)scale=.72;tx=(map.clientWidth-1030*scale)/2;ty=8;transform()}
function center(n){tx=map.clientWidth/2-(n.x+133)*scale;ty=map.clientHeight/2-(n.y+30)*scale;transform()}
function zoom(factor){const next=Math.max(.35,Math.min(1.8,scale*factor));const cx=map.clientWidth/2,cy=map.clientHeight/2;tx=cx-(cx-tx)*next/scale;ty=cy-(cy-ty)*next/scale;scale=next;transform()}
function chapterButtons(ids){return '<div class="chapter-buttons">'+ids.map(id=>'<button type="button" data-chapter="'+id+'">'+(id===0?'序章':'第'+id+'章')+'</button>').join('')+'</div>'}
function paint(){const related=new Set([selected]);for(const e of DATA.edges)if(e.from===selected||e.to===selected){related.add(e.from);related.add(e.to)}for(const n of DATA.nodes){const b=document.getElementById('node-'+n.id);const active=chapterId!==null?n.chapters.includes(chapterId):related.has(n.id);b.classList.toggle('dim',!active);b.classList.toggle('selected',chapterId===null&&n.id===selected);b.classList.toggle('related',chapterId===null&&related.has(n.id)&&n.id!==selected);b.classList.toggle('chapter-on',chapterId!==null&&active);b.setAttribute('aria-pressed',String(chapterId===null&&n.id===selected))}for(const e of DATA.edges){const on=chapterId!==null?byId.get(e.from).chapters.includes(chapterId)&&byId.get(e.to).chapters.includes(chapterId):e.from===selected||e.to===selected;e.element.classList.toggle('on',on);if(on)e.element.setAttribute('marker-end','url(#arrow)');else e.element.removeAttribute('marker-end')} }
function selectNode(id,recenter=false){selected=id;chapterId=null;chapter.value='';topic.value=id;const n=byId.get(id);const connections=DATA.edges.filter(e=>e.from===id||e.to===id);detail.innerHTML='<div class="category">'+esc(categories[n.group][0])+'</div><h2>'+esc(n.label)+'</h2><h3>関連する基礎知識</h3><p>'+esc(n.basics)+'</p><h3>つながりから分かること</h3><p>'+esc(n.takeaway)+'</p><h3>扱う章</h3>'+chapterButtons(n.chapters)+'<h3>この知識からたどる</h3><ul class="connections">'+connections.map(e=>{const other=byId.get(e.from===id?e.to:e.from);return '<li><button type="button" data-node="'+other.id+'">'+esc(other.label)+'</button><small>'+esc(e.reason)+'</small></li>'}).join('')+'</ul>';paint();if(recenter)center(n)}
function selectChapter(id){chapterId=id;chapter.value=String(id);const c=DATA.chapters.find(c=>c.number===id);detail.innerHTML='<div class="category">章の解説範囲</div><h2>'+esc(c.title)+'</h2><h3>Summary</h3><p>'+esc(c.summary)+'</p><h3>本文の流れ</h3><ol class="chapter-flow">'+c.flow.map(item=>'<li>'+esc(item)+'</li>').join('')+'</ol><h3>前提となる知識</h3><p>'+esc(c.prerequisite)+'</p><h3>読者ができるようになること</h3><p>'+esc(c.outcome)+'</p><h3>どこまで扱うか</h3><p class="scope">'+esc(c.scope)+'</p><h3>この章でつながる知識</h3><ul class="connections">'+DATA.nodes.filter(n=>n.chapters.includes(id)).map(n=>'<li><button data-node="'+n.id+'">'+esc(n.label)+'</button></li>').join('')+'</ul><details><summary>章の箇条書きを見る</summary>'+c.sections.map(s=>'<h3>'+esc(s.title)+'</h3><ul>'+s.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>').join('')+'</details><a class="chapter-link" href="'+esc(c.file)+'">本文のMarkdownを開く →</a>';paint()}
detail.addEventListener('click',e=>{const n=e.target.closest('[data-node]'),c=e.target.closest('[data-chapter]');if(n)selectNode(n.dataset.node,true);if(c)selectChapter(Number(c.dataset.chapter))});topic.addEventListener('change',()=>selectNode(topic.value,true));chapter.addEventListener('change',()=>chapter.value===''?selectNode(selected):selectChapter(Number(chapter.value)));document.getElementById('plus').onclick=()=>zoom(1.2);document.getElementById('minus').onclick=()=>zoom(1/1.2);document.getElementById('fit').onclick=()=>fit(true);
map.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,tx,ty};moved=false;map.setPointerCapture(e.pointerId);map.classList.add('dragging')});map.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;tx=drag.tx+dx;ty=drag.ty+dy;transform()});function end(){drag=null;map.classList.remove('dragging');setTimeout(()=>moved=false,0)}map.addEventListener('pointerup',end);map.addEventListener('pointercancel',end);
new ResizeObserver(()=>{fit();if(map.clientWidth<600)center(byId.get(selected))}).observe(map);fit();selectNode(selected);
</script>
</body>
</html>
