<svg xmlns="http://www.w3.org/2000/svg" width="640" height="816" viewBox="0 0 640 816" role="img" aria-labelledby="title">
  <title id="title">20件に減るのは、最後の2段</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.real{fill:#176e65}
.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}
  </style>
  <rect width="640" height="816" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">20件に減るのは、最後の2段</text>
  <rect x="548" y="22" width="68" height="36" rx="18" class="real"/>
  <text x="582" y="47" text-anchor="middle" class="tag">実測</text>
  <g id="last-two">
    <rect x="12" y="72" width="424" height="232" rx="16" class="hot"/>
    <text x="452" y="164" class="b">20件に</text>
    <text x="452" y="196" class="b">減るのは</text>
    <text x="452" y="228" class="b">この2段</text>
  </g>
  <g id="limit">
    <rect x="24" y="84" width="400" height="80" rx="12" class="node"/>
    <text x="44" y="116" class="mono b">Limit</text>
    <text x="44" y="148" class="mono">rows=20.00</text>
  </g>
  <g id="sort">
    <rect x="24" y="212" width="400" height="80" rx="12" class="node"/>
    <text x="44" y="244" class="mono b">Sort</text>
    <text x="44" y="276" class="mono">rows=20.00</text>
  </g>
  <g id="hash-aggregate">
    <rect x="24" y="336" width="400" height="80" rx="12" class="node"/>
    <text x="44" y="368" class="mono b">HashAggregate</text>
    <text x="44" y="400" class="mono">rows=255238.00</text>
  </g>
  <g id="hash-join">
    <rect x="24" y="452" width="400" height="80" rx="12" class="node"/>
    <text x="44" y="484" class="mono b">Hash Join</text>
    <text x="44" y="516" class="mono">rows=499998.00</text>
  </g>
  <g id="middle-note">
    <text x="452" y="416" class="s b teal">途中では</text>
    <text x="452" y="448" class="s b teal">数十万件を</text>
    <text x="452" y="480" class="s b teal">受け渡す</text>
  </g>
  <g id="scan-records">
    <rect x="24" y="580" width="288" height="144" rx="12" class="node"/>
    <text x="44" y="612" class="mono b">Seq Scan on</text>
    <text x="44" y="644" class="mono b">reading_records</text>
    <text x="44" y="676" class="mono">rows=499998.00</text>
    <text x="44" y="708" class="s">除外 1,500,002件</text>
  </g>
  <g id="hash">
    <rect x="328" y="580" width="288" height="80" rx="12" class="node"/>
    <text x="348" y="612" class="mono b">Hash</text>
    <text x="348" y="644" class="mono">rows=1000000.00</text>
  </g>
  <g id="scan-books">
    <rect x="328" y="696" width="288" height="112" rx="12" class="node"/>
    <text x="348" y="728" class="mono b">Seq Scan on</text>
    <text x="348" y="760" class="mono b">books</text>
    <text x="348" y="792" class="mono">rows=1000000.00</text>
  </g>
  <g id="flows">
    <path d="M224 212 V172" class="flow"/>
    <path d="M224 336 V300" class="flow"/>
    <path d="M224 452 V424" class="flow"/>
    <path d="M168 580 V540" class="flow"/>
    <path d="M400 580 V540" class="flow"/>
    <path d="M472 696 V668" class="flow"/>
  </g>
</svg>
