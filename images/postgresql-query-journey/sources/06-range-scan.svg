<svg xmlns="http://www.w3.org/2000/svg" width="640" height="792" viewBox="0 0 640 792" role="img" aria-labelledby="title">
  <title id="title">4以上8以下なら、隣の箱も開く</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}.model{fill:#566c7b}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
  </style>
  <rect width="640" height="792" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">4以上8以下なら、隣の箱も開く</text>
  <g id="signboard">
    <rect x="230" y="80" width="180" height="88" rx="10" class="route"/>
    <text x="320" y="114" text-anchor="middle" class="b">案内板</text>
    <text x="320" y="150" text-anchor="middle">境目　4｜7</text>
  </g>
  <g id="box-left">
    <rect x="24" y="340" width="176" height="120" rx="10" class="ghost"/>
    <text x="112" y="380" text-anchor="middle" class="m">4未満</text>
    <text x="64" y="428" text-anchor="middle" class="m">1</text>
    <text x="112" y="428" text-anchor="middle" class="m">2</text>
    <text x="160" y="428" text-anchor="middle" class="m">3</text>
    <path d="M191 331 L209 349 M209 331 L191 349" fill="none" stroke="#7d93a3" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g id="box-middle">
    <rect x="232" y="340" width="176" height="120" rx="10" class="route"/>
    <text x="320" y="380" text-anchor="middle" class="s">4以上7未満</text>
    <text x="272" y="428" text-anchor="middle" class="h">4</text>
    <text x="320" y="428" text-anchor="middle" class="h">5</text>
    <text x="368" y="428" text-anchor="middle" class="h">6</text>
  </g>
  <g id="box-right">
    <rect x="440" y="340" width="176" height="120" rx="10" class="route"/>
    <text x="528" y="380" text-anchor="middle" class="s">7以上</text>
    <text x="480" y="428" text-anchor="middle" class="h">7</text>
    <text x="528" y="428" text-anchor="middle" class="h">8</text>
    <text x="576" y="428" text-anchor="middle" class="h">9</text>
  </g>
  <g id="table">
    <rect x="24" y="576" width="592" height="92" rx="10" class="panel"/>
    <text x="44" y="604" class="s b">表 <tspan class="mono">books</tspan></text>
    <rect x="44" y="616" width="100" height="36" rx="4" class="row"/>
    <text x="94" y="641" text-anchor="middle" class="s">本4</text>
    <rect x="157" y="616" width="100" height="36" rx="4" class="row"/>
    <text x="207" y="641" text-anchor="middle" class="s">本5</text>
    <rect x="270" y="616" width="100" height="36" rx="4" class="row"/>
    <text x="320" y="641" text-anchor="middle" class="s">本6</text>
    <rect x="383" y="616" width="100" height="36" rx="4" class="row"/>
    <text x="433" y="641" text-anchor="middle" class="s">本7</text>
    <rect x="496" y="616" width="100" height="36" rx="4" class="row"/>
    <text x="546" y="641" text-anchor="middle" class="s">本8</text>
  </g>
  <g id="summary">
    <rect x="24" y="688" width="188" height="80" rx="10" class="panel"/>
    <text x="118" y="718" text-anchor="middle" class="s">探す</text>
    <text x="118" y="754" text-anchor="middle" class="h">1回</text>
    <rect x="226" y="688" width="188" height="80" rx="10" class="panel"/>
    <text x="320" y="718" text-anchor="middle" class="s">開く箱</text>
    <text x="320" y="754" text-anchor="middle" class="h">2個</text>
    <rect x="428" y="688" width="188" height="80" rx="10" class="hot"/>
    <text x="522" y="718" text-anchor="middle" class="s">取り出す行</text>
    <text x="522" y="754" text-anchor="middle" class="h">5行</text>
  </g>
  <g id="branches">
    <path d="M280 169.5 L112 340" fill="none" stroke="#b5c2cc" stroke-width="2"/>
    <path d="M360 169.5 L528 340" fill="none" stroke="#b5c2cc" stroke-width="2"/>
  </g>
  <g id="search">
    <path d="M320 169.5 V336" class="ref"/>
  </g>
  <g id="next">
    <path d="M411 416 H436.5" class="ref"/>
    <path d="M424 328 V400" class="leader"/>
  </g>
  <g id="fetch">
    <path d="M424 502 V573" class="ref"/>
  </g>
  <g id="marks">
    <text x="272" y="495" text-anchor="middle" class="h teal">✓</text>
    <text x="320" y="495" text-anchor="middle" class="h teal">✓</text>
    <text x="368" y="495" text-anchor="middle" class="h teal">✓</text>
    <text x="480" y="495" text-anchor="middle" class="h teal">✓</text>
    <text x="528" y="495" text-anchor="middle" class="h teal">✓</text>
    <text x="576" y="495" text-anchor="middle" class="h">×</text>
  </g>
  <g id="labels">
    <text x="308" y="293" text-anchor="end" class="s">① 4の箱へ</text>
    <text x="354" y="322" class="s">② 隣の箱へ</text>
    <text x="413" y="532" text-anchor="end" class="s">行を取り出す</text>
    <text x="112" y="492" text-anchor="middle" class="m">開かない</text>
    <text x="528" y="526" text-anchor="middle" class="s">9は範囲外</text>
    <text x="528" y="556" text-anchor="middle" class="s">ここで止まる</text>
  </g>
</svg>
