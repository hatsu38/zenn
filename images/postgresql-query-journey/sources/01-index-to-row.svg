<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="810" viewBox="0 0 640 810" role="img" aria-labelledby="title description">
  

  <title id="title">番号で場所を探し、表から行を取り出す</title>
  <desc id="description">Index Scanの模型 ／ 索引の内部は第3章で扱う</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="810" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">番号で場所を探し、表から行を取り出す</text>
  <text x="28" y="82" class="muted" text-anchor="start">Index Scanの模型 ／ 索引の内部は第3章で扱う</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="255" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">① 索引で、番号42の参照先を見つける</text>
    <rect x="70" y="187" width="110" height="60" rx="9" class="card"/>
    <text x="125.0" y="227.0" class="value" text-anchor="middle">41</text>
    <rect x="196" y="187" width="110" height="60" rx="9" class="hot"/>
    <text x="251.0" y="227.0" class="value" text-anchor="middle">42</text>
    <rect x="322" y="187" width="110" height="60" rx="9" class="card"/>
    <text x="377.0" y="227.0" class="value" text-anchor="middle">43</text>
    <text x="80" y="315" class="small" text-anchor="start">番号と、表の行を指す情報を持つ</text>
    <path d="M320 374 L320 432" class="arrow"/>
    <text x="344" y="410" class="small" text-anchor="start">表を参照</text>
    <rect x="20" y="448" width="600" height="278" rx="18" class="panel"/>
    <text x="40" y="488" class="bold" text-anchor="start">② その行を含むページを読む</text>
    <rect x="72" y="510" width="496" height="196" rx="14" class="memory"/>
    <text x="90" y="545" class="bold" text-anchor="start">表のページ</text>
    <rect x="86" y="564" width="468" height="34" rx="6" class="paper"/>
    <text x="99" y="589" class="small" text-anchor="start">本41</text>
    <rect x="86" y="607" width="468" height="34" rx="6" class="hot"/>
    <text x="99" y="632" class="small" text-anchor="start">本42：実験用の本 42</text>
    <rect x="86" y="650" width="468" height="34" rx="6" class="paper"/>
    <text x="99" y="675" class="small" text-anchor="start">本43</text>
    <text x="30" y="773" class="bold" text-anchor="start">索引にも表にも、読むページがある。</text>
  </g>
</svg>
