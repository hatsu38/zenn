<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="790" viewBox="0 0 640 790" role="img" aria-labelledby="title description">
  

  <title id="title">表の中にページ、ページの中に行</title>
  <desc id="description">説明用の模型 ／ 1ページ3行は実際の容量ではない</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="790" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">表の中にページ、ページの中に行</text>
  <text x="28" y="82" class="muted" text-anchor="start">説明用の模型 ／ 1ページ3行は実際の容量ではない</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="435" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">books：複数のページに行が入る</text>
    <rect x="42" y="178" width="174" height="260" rx="14" class="memory"/>
    <text x="60" y="213" class="bold" text-anchor="start">ページ0</text>
    <rect x="56" y="232" width="146" height="34" rx="6" class="paper"/>
    <text x="69" y="257" class="small" text-anchor="start">本1</text>
    <rect x="56" y="275" width="146" height="34" rx="6" class="paper"/>
    <text x="69" y="300" class="small" text-anchor="start">本2</text>
    <rect x="56" y="318" width="146" height="34" rx="6" class="paper"/>
    <text x="69" y="343" class="small" text-anchor="start">本3</text>
    <rect x="234" y="178" width="174" height="260" rx="14" class="memory"/>
    <text x="252" y="213" class="bold" text-anchor="start">ページ1</text>
    <rect x="248" y="232" width="146" height="34" rx="6" class="paper"/>
    <text x="261" y="257" class="small" text-anchor="start">本4</text>
    <rect x="248" y="275" width="146" height="34" rx="6" class="hot"/>
    <text x="261" y="300" class="small" text-anchor="start">本5</text>
    <rect x="248" y="318" width="146" height="34" rx="6" class="paper"/>
    <text x="261" y="343" class="small" text-anchor="start">本6</text>
    <rect x="426" y="178" width="174" height="260" rx="14" class="memory"/>
    <text x="444" y="213" class="bold" text-anchor="start">ページ2</text>
    <rect x="440" y="232" width="146" height="34" rx="6" class="paper"/>
    <text x="453" y="257" class="small" text-anchor="start">本7</text>
    <rect x="440" y="275" width="146" height="34" rx="6" class="paper"/>
    <text x="453" y="300" class="small" text-anchor="start">本8</text>
    <text x="42" y="501" class="bold" text-anchor="start">本5を読むには、ページ1が必要</text>
    <rect x="20" y="570" width="600" height="185" rx="18" class="panel"/>
    <text x="40" y="610" class="bold" text-anchor="start">行とページは、別の単位</text>
    <text x="44" y="642" class="small" text-anchor="start">欲しいのは本5の1行。</text>
    <text x="44" y="686" class="small" text-anchor="start">読み込む単位には、ほかの行も入る。</text>
  </g>
</svg>
