    <rect x="396" y="234" width="200" height="66" rx="8" class="page"/>
    <text x="408" y="258" class="s b">ページ11</text>
    <rect x="406" y="266" width="180" height="28" rx="4" class="row"/>
    <text x="416" y="288" class="s m">ほかの記録</text>
    <text x="192" y="224" class="s teal">テーブルを読まない</text>
  </g>
  <g id="panel-2">
