<svg xmlns="http://www.w3.org/2000/svg" width="640" height="584" viewBox="0 0 640 584" role="img" aria-labelledby="title">
  <title id="title">×のページはテーブルで確認</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
  </style>
  <rect width="640" height="584" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">×のページはテーブルで確認</text>
  <g id="index">
    <rect x="24" y="76" width="592" height="108" rx="10" class="ipage"/>
    <text x="44" y="108" class="s b"><tspan class="mono">(book_id, finished_at)</tspan>のIndex</text>
    <rect x="44" y="124" width="136" height="36" rx="4" class="row"/>
    <path d="M96 124 V160" class="row"/>
    <text x="70" y="149" text-anchor="middle" class="s">42</text>
    <text x="138" y="149" text-anchor="middle" class="s">日時1</text>
    <text x="192" y="149" class="s m">▸ 場所</text>
    <rect x="385" y="124" width="136" height="36" rx="4" class="row"/>
    <path d="M437 124 V160" class="row"/>
    <text x="411" y="149" text-anchor="middle" class="s">42</text>
    <text x="479" y="149" text-anchor="middle" class="s">日時2</text>
    <text x="533" y="149" class="s m">▸ 場所</text>
  </g>
  <g id="visibility-map">
    <rect x="24" y="204" width="592" height="132" rx="10" class="panel"/>
    <text x="44" y="236" class="s b">可視性マップ</text>
    <rect x="44" y="250" width="120" height="72" rx="6" class="panel"/>
    <text x="104" y="277" text-anchor="middle" class="s">ページ10</text>
    <text x="104" y="311" text-anchor="middle" class="h teal">✓</text>
    <rect x="484" y="250" width="120" height="72" rx="6" class="hot"/>
    <text x="544" y="277" text-anchor="middle" class="s b">ページ11</text>
    <text x="544" y="311" text-anchor="middle" class="h">×</text>
    <text x="44" y="368" class="s"><tspan class="b teal">✓</tspan> <tspan class="m">すべて見えてよい</tspan></text>
    <text x="530" y="368" text-anchor="end" class="s"><tspan class="b">×</tspan> <tspan class="m">確かめが要る</tspan></text>
  </g>
  <g id="table">
    <rect x="24" y="468" width="284" height="92" rx="10" class="page"/>
    <text x="44" y="498" class="s b">ページ10</text>
    <rect x="44" y="512" width="244" height="34" rx="4" class="row"/>
    <text x="58" y="535" class="s">42　日時1</text>
    <rect x="332" y="468" width="284" height="92" rx="10" class="page"/>
    <text x="352" y="498" class="s b">ページ11</text>
    <rect x="352" y="512" width="244" height="34" rx="4" class="row"/>
    <text x="366" y="535" class="s">42　日時2</text>
  </g>
  <g id="no-heap-fetch">
    <text x="44" y="410" class="s teal">テーブルを見ずに返す</text>
  </g>
  <g id="heap-fetch">
    <path d="M544 324 V506" class="ref"/>
    <text x="530" y="410" text-anchor="end" class="s">テーブルで確認</text>
    <text x="530" y="444" text-anchor="end" class="s"><tspan class="mono">Heap Fetches</tspan>＝この回数</text>
  </g>
</svg>
