    <text x="40" y="389" class="s b">Index</text>
    <text x="40" y="434" class="s b">可視性マップ</text>
    <text x="40" y="520" class="s b">テーブル</text>
    <rect x="180" y="362" width="420" height="40" rx="8" class="ipage"/>
    <rect x="190" y="367" width="100" height="30" rx="4" class="row"/>
    <path d="M234 367 V397" class="row"/>
    <text x="212" y="389" text-anchor="middle" class="s">42</text>
    <text x="262" y="389" text-anchor="middle" class="s">日時</text>
    <text x="298" y="389" class="m">▸ 場所</text>
    <rect x="402" y="367" width="100" height="30" rx="4" class="row"/>
    <path d="M446 367 V397" class="row"/>
    <text x="424" y="389" text-anchor="middle" class="s">42</text>
    <text x="474" y="389" text-anchor="middle" class="s">日時</text>
    <text x="510" y="389" class="m">▸ 場所</text>
