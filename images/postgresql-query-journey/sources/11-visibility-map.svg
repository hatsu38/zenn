    <text x="196" y="434" class="s">ページ10</text>
    <text x="320" y="436" class="h">×</text>
    <rect x="396" y="408" width="200" height="36" rx="6" class="hot"/>
    <text x="408" y="434" class="s">ページ11</text>
    <text x="532" y="436" class="h">×</text>
    <rect x="184" y="480" width="200" height="66" rx="8" class="page"/>
    <text x="196" y="504" class="s b">ページ10</text>
    <rect x="194" y="512" width="180" height="28" rx="4" class="row"/>
    <text x="204" y="534" class="s">版1　古い版</text>
    <rect x="396" y="480" width="200" height="66" rx="8" class="page"/>
    <text x="408" y="504" class="s b">ページ11</text>
    <rect x="406" y="512" width="180" height="28" rx="4" class="row"/>
    <text x="416" y="534" class="s">版2　新しい版</text>
    <path d="M364 402 V510" class="ref"/>
    <text x="352" y="470" text-anchor="end" class="s">確かめる</text>
    <path d="M576 402 V510" class="ref"/>
    <text x="564" y="470" text-anchor="end" class="s">確かめる</text>
  </g>
  <g id="panel-3">
    <rect x="24" y="564" width="592" height="236" rx="14" class="panel"/>
    <text x="44" y="598" class="b">③ 再びVACUUM後</text>
    <text x="596" y="598" text-anchor="end" class="mono b">Heap Fetches: 0</text>
    <text x="40" y="635" class="s b">Index</text>
    <text x="40" y="680" class="s b">可視性マップ</text>
    <text x="40" y="766" class="s b">テーブル</text>
    <rect x="180" y="608" width="420" height="40" rx="8" class="ipage"/>
    <rect x="402" y="613" width="100" height="30" rx="4" class="row"/>
    <path d="M446 613 V643" class="row"/>
    <text x="424" y="635" text-anchor="middle" class="s">42</text>
    <text x="474" y="635" text-anchor="middle" class="s">日時</text>
    <text x="510" y="635" class="m">▸ 場所</text>
    <rect x="184" y="654" width="200" height="36" rx="6" class="panel"/>
    <text x="196" y="680" class="s">ページ10</text>
    <text x="320" y="682" class="h teal">✓</text>
    <rect x="396" y="654" width="200" height="36" rx="6" class="panel"/>
    <text x="408" y="680" class="s">ページ11</text>
    <text x="532" y="682" class="h teal">✓</text>
    <rect x="184" y="726" width="200" height="66" rx="8" class="page"/>
    <text x="196" y="750" class="s b">ページ10</text>
    <rect x="194" y="758" width="180" height="28" rx="4" class="ghost"/>
