<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="955" viewBox="0 0 640 955" role="img" aria-labelledby="title description">
  

  <title id="title">Indexだけで返せるかは、可視性にもよる</title>
  <desc id="description">Index Only Scanの模型 ／ ページごとに判断</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="955" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">Indexだけで返せるかは、可視性にもよる</text>
  <text x="28" y="82" class="muted" text-anchor="start">Index Only Scanの模型 ／ ページごとに判断</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="230" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">前提：必要な列がIndexにある</text>
    <rect x="150" y="185" width="155" height="60" rx="9" class="card"/>
    <text x="227.5" y="225.0" class="value" text-anchor="middle">id</text>
    <rect x="330" y="185" width="155" height="60" rx="9" class="card"/>
    <text x="407.5" y="225.0" class="value" text-anchor="middle">title</text>
    <text x="45" y="308" class="small" text-anchor="start">それでも、行が見えるかの確認は必要</text>
    <rect x="20" y="370" width="600" height="250" rx="18" class="panel"/>
    <text x="40" y="410" class="bold" text-anchor="start">可視性マップで確認できるページ</text>
    <rect x="46" y="450" width="245" height="54" rx="12" class="card"/>
    <text x="168.5" y="485" class="" text-anchor="middle">Indexから値を得る</text>
    <rect x="355" y="450" width="240" height="54" rx="12" class="card"/>
    <text x="475.0" y="485" class="" text-anchor="middle">表を見ずに返せる</text>
    <path d="M298 477 L343 477" class="arrow"/>
    <text x="46" y="572" class="small" text-anchor="start">全行が可視と分かる情報を利用</text>
    <rect x="20" y="650" width="600" height="265" rx="18" class="panel"/>
    <text x="40" y="690" class="bold" text-anchor="start">確認できないページ</text>
    <rect x="46" y="730" width="245" height="54" rx="12" class="box"/>
    <text x="168.5" y="765" class="" text-anchor="middle">Indexから値を得る</text>
    <rect x="355" y="730" width="240" height="54" rx="12" class="hot"/>
    <text x="475.0" y="765" class="" text-anchor="middle">表の行を確認する</text>
    <path d="M298 757 L343 757" class="arrow"/>
    <text x="46" y="864" class="small" text-anchor="start">Heap Fetchesで、表への確認を観察</text>
  </g>
</svg>
