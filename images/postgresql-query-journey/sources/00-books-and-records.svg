<svg xmlns="http://www.w3.org/2000/svg" width="640" height="562" viewBox="0 0 640 562" role="img" aria-labelledby="title">
  <title id="title">本ごとに、記録の件数を数える</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}.model{fill:#566c7b}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
  </style>
  <rect width="640" height="562" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">本ごとに、記録の件数を数える</text>
  <rect x="548" y="22" width="68" height="36" rx="18" class="model"/>
  <text x="582" y="47" text-anchor="middle" class="tag">模型</text>
  <g id="books">
    <rect x="24" y="80" width="208" height="188" rx="10" class="panel"/>
    <text x="40" y="112" class="mono b">books</text>
    <text x="62" y="148" text-anchor="middle" class="mono">id</text>
    <text x="100" y="148" class="mono">title</text>
    <rect x="40" y="162" width="164" height="40" rx="4" class="row"/>
    <path d="M84 162 V202" class="row"/>
    <text x="62" y="190" text-anchor="middle" class="s">1</text>
    <text x="100" y="190" class="s">星の図鑑</text>
    <rect x="40" y="212" width="164" height="40" rx="4" class="row"/>
    <path d="M84 212 V252" class="row"/>
    <text x="62" y="240" text-anchor="middle" class="s">2</text>
    <text x="100" y="240" class="s">海の図鑑</text>
  </g>
  <g id="records">
    <rect x="300" y="80" width="316" height="238" rx="10" class="panel"/>
    <text x="316" y="112" class="mono b">reading_records</text>
    <text x="368" y="148" text-anchor="middle" class="mono">book_id</text>
    <text x="434" y="148" class="mono">finished_at</text>
    <rect x="316" y="162" width="284" height="40" rx="4" class="row"/>
    <path d="M420 162 V202" class="row"/>
    <text x="368" y="190" text-anchor="middle" class="s">1</text>
    <text x="434" y="190" class="s">9月14日</text>
    <rect x="316" y="212" width="284" height="40" rx="4" class="row"/>
    <path d="M420 212 V252" class="row"/>
    <text x="368" y="240" text-anchor="middle" class="s">1</text>
    <text x="434" y="240" class="s">9月16日</text>
    <rect x="316" y="262" width="284" height="40" rx="4" class="row"/>
    <path d="M420 262 V302" class="row"/>
    <text x="368" y="290" text-anchor="middle" class="s">2</text>
    <text x="434" y="290" class="s">9月15日</text>
  </g>
  <g id="join">
    <path d="M316 182 L206 174" class="ref"/>
    <path d="M316 232 L206 192" class="ref"/>
    <path d="M316 282 L206 238" class="ref"/>
    <text x="40" y="300" class="mono">JOIN　book_id = id</text>
  </g>
  <g id="result">
    <rect x="24" y="424" width="592" height="114" rx="10" class="panel"/>
    <text x="44" y="458" class="s b">本ごとの件数</text>
    <rect x="44" y="474" width="264" height="48" rx="4" class="hot"/>
    <text x="64" y="506" class="b">星の図鑑　2件</text>
    <rect x="332" y="474" width="264" height="48" rx="4" class="row"/>
    <text x="352" y="506">海の図鑑　1件</text>
  </g>
  <g id="count">
    <path d="M320 330 V421" class="flow"/>
    <text x="334" y="356" class="s teal">本ごとに数える　<tspan class="mono">count(*)</tspan></text>
  </g>
</svg>
