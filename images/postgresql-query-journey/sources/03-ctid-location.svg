<svg xmlns="http://www.w3.org/2000/svg" width="640" height="628" viewBox="0 0 640 628" role="img" aria-labelledby="title">
  <title id="title">ctid = (0,1) が指す場所</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
  </style>
  <rect width="640" height="628" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">ctid = (0,1) が指す場所</text>
  <g id="output">
    <rect x="24" y="76" width="592" height="132" rx="12" class="panel"/>
    <text x="72" y="110" class="mono" xml:space="preserve"> id | ctid  |    title</text>
    <text x="72" y="144" class="mono" xml:space="preserve">  1 | (0,1) | 実験用の本 1</text>
  </g>
  <g id="ctid-numbers">
    <path d="M165.7 151 V159 H177 V151 M171.3 159 V180 H163" class="leader"/>
    <path d="M192.2 151 V159 H203.5 V151 M197.8 159 V180 H206" class="leader"/>
    <text x="159" y="188" text-anchor="end" class="s b">ページ番号</text>
    <text x="210" y="188" class="s b">項目番号</text>
  </g>
  <g id="page">
    <rect x="24" y="284" width="592" height="320" rx="12" class="page"/>
    <text x="44" y="320" class="s b">ページ0</text>
    <rect x="426" y="296" width="32" height="34" rx="4" class="panel"/>
    <text x="442" y="320" text-anchor="middle" class="s">1</text>
    <rect x="466" y="296" width="32" height="34" rx="4" class="panel"/>
    <text x="482" y="320" text-anchor="middle" class="s">2</text>
    <rect x="506" y="296" width="32" height="34" rx="4" class="panel"/>
    <text x="522" y="320" text-anchor="middle" class="s">3</text>
    <rect x="546" y="296" width="32" height="34" rx="4" class="panel"/>
    <text x="562" y="320" text-anchor="middle" class="s">4</text>
    <text x="596" y="320" text-anchor="middle" class="s b">…</text>
    <rect x="44" y="376" width="164" height="36" rx="4" class="hot"/>
    <text x="58" y="401" class="s b">実験用の本 1</text>
    <rect x="44" y="424" width="164" height="36" rx="4" class="row"/>
    <text x="58" y="449" class="s">実験用の本 2</text>
    <rect x="44" y="472" width="164" height="36" rx="4" class="row"/>
    <text x="58" y="497" class="s">実験用の本 3</text>
    <rect x="44" y="520" width="164" height="36" rx="4" class="row"/>
    <text x="58" y="545" class="s">実験用の本 4</text>
    <text x="126" y="582" text-anchor="middle" class="s b">⋮</text>
  </g>
  <g id="select-page">
    <path d="M171.3 180 V280" class="ref"/>
    <text x="189" y="240" class="s">① ページを選ぶ</text>
  </g>
  <g id="item-to-row">
    <path d="M442 330 V394 H212" class="ref"/>
    <path d="M482 330 V442 H212" class="ref"/>
    <path d="M522 330 V490 H212" class="ref"/>
    <path d="M562 330 V538 H212" class="ref"/>
    <text x="246" y="370" class="s">② 項目が行を指す</text>
  </g>
</svg>
