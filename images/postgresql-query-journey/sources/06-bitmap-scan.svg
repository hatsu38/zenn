<svg xmlns="http://www.w3.org/2000/svg" width="640" height="768" viewBox="0 0 640 768" role="img" aria-labelledby="title">
  <title id="title">取りに行く順で、開く回数が変わる</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
  </style>
  <rect width="640" height="768" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">取りに行く順で、開く回数が変わる</text>

  <g id="step-1">
    <rect x="24" y="72" width="592" height="320" rx="10" class="panel"/>
    <text x="44" y="104" class="s b">① 目録の順に、1冊ずつ取りに行く</text>
    <text x="44" y="134" class="m">目録の項目（題名の順）</text>
    <g id="index-items">
      <rect x="44" y="146" width="266" height="34" rx="4" class="ipage"/>
      <text x="56" y="170" class="mono">400009</text>
      <text x="150" y="170" class="m">▸ ページ2941</text>
      <rect x="44" y="186" width="266" height="34" rx="4" class="ipage"/>
      <text x="56" y="210" class="mono">40001</text>
      <text x="150" y="210" class="m">▸ ページ294</text>
      <rect x="44" y="226" width="266" height="34" rx="4" class="ipage"/>
      <text x="56" y="250" class="mono">400010</text>
      <text x="150" y="250" class="m">▸ ページ2941</text>
      <text x="169" y="292" text-anchor="middle" class="m">⋮</text>
      <rect x="44" y="306" width="266" height="34" rx="4" class="ipage"/>
      <text x="56" y="330" class="mono">40002</text>
      <text x="150" y="330" class="m">▸ ページ294</text>
      <rect x="44" y="346" width="266" height="34" rx="4" class="ipage"/>
      <text x="56" y="370" class="mono">400020</text>
      <text x="150" y="370" class="m">▸ ページ2941</text>
    </g>
    <g id="pages-1">
      <rect x="420" y="160" width="172" height="64" rx="8" class="page"/>
      <text x="506" y="200" text-anchor="middle" class="s b">ページ294</text>
      <rect x="420" y="300" width="172" height="64" rx="8" class="page"/>
      <text x="506" y="340" text-anchor="middle" class="s b">ページ2941</text>
    </g>
    <g id="visits-1">
      <path d="M312 163 C370 163 380 332 416 332" class="ref"/>
      <path d="M312 203 C370 203 380 192 416 192" class="ref"/>
      <path d="M312 243 C370 243 380 332 416 332" class="ref"/>
      <path d="M312 323 C370 323 380 192 416 192" class="ref"/>
      <path d="M312 363 C370 363 380 332 416 332" class="ref"/>
    </g>
    <text x="320" y="132" class="m">開く回数</text>
    <text x="418" y="132" class="h brown">5回</text>
    <text x="506" y="270" text-anchor="middle" class="m">行ったり来たり</text>
  </g>

  <g id="step-2">
    <rect x="24" y="408" width="592" height="336" rx="10" class="panel"/>
    <text x="44" y="440" class="s b">② 場所を集めてから、ページの順に読む</text>
    <text x="44" y="470" class="m">ビットマップ：ページとレコードの位置</text>
    <g id="bitmap">
      <rect x="44" y="486" width="264" height="76" rx="6" class="hot"/>
      <text x="60" y="515" class="s b">ページ294</text>
      <text x="60" y="547" class="s">位置：17, 18</text>
      <rect x="328" y="486" width="264" height="76" rx="6" class="hot"/>
      <text x="344" y="515" class="s b">ページ2941</text>
      <text x="344" y="547" class="s">位置：33, 34, 44</text>
    </g>
    <g id="pages-2">
      <rect x="118" y="596" width="172" height="64" rx="8" class="page"/>
      <text x="204" y="636" text-anchor="middle" class="s b">ページ294</text>
      <rect x="350" y="596" width="172" height="64" rx="8" class="page"/>
      <text x="436" y="636" text-anchor="middle" class="s b">ページ2941</text>
    </g>
    <g id="visits-2">
      <path d="M204 564 V592" class="ref"/>
      <path d="M436 564 V592" class="ref"/>
      <path d="M294 628 H346" class="flow"/>
    </g>
    <text x="44" y="694" class="m">対象ページを順に読み、記録したレコードを取り出す</text>
    <text x="44" y="730" class="m">開く回数</text>
    <text x="142" y="730" class="h teal">2回</text>
  </g>
</svg>
