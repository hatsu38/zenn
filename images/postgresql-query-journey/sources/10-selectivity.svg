<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="735" viewBox="0 0 640 735" role="img" aria-labelledby="title description">
  

  <title id="title">同じ「1種類」でも、9,000行と1,000行</title>
  <desc id="description">本文の生成データの分布 ／ 四角一つは1,000行</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="735" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">同じ「1種類」でも、9,000行と1,000行</text>
  <text x="28" y="82" class="muted" text-anchor="start">本文の生成データの分布 ／ 四角一つは1,000行</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="285" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">1万行を、10個のまとまりで表す</text>
    <rect x="51" y="185" width="94" height="66" rx="9" class="card"/>
    <text x="98" y="226" class="value" text-anchor="middle">1千</text>
    <rect x="162" y="185" width="94" height="66" rx="9" class="card"/>
    <text x="209" y="226" class="value" text-anchor="middle">1千</text>
    <rect x="273" y="185" width="94" height="66" rx="9" class="card"/>
    <text x="320" y="226" class="value" text-anchor="middle">1千</text>
    <rect x="384" y="185" width="94" height="66" rx="9" class="card"/>
    <text x="431" y="226" class="value" text-anchor="middle">1千</text>
    <rect x="495" y="185" width="94" height="66" rx="9" class="card"/>
    <text x="542" y="226" class="value" text-anchor="middle">1千</text>
    <rect x="51" y="272" width="94" height="66" rx="9" class="card"/>
    <text x="98" y="313" class="value" text-anchor="middle">1千</text>
    <rect x="162" y="272" width="94" height="66" rx="9" class="card"/>
    <text x="209" y="313" class="value" text-anchor="middle">1千</text>
    <rect x="273" y="272" width="94" height="66" rx="9" class="card"/>
    <text x="320" y="313" class="value" text-anchor="middle">1千</text>
    <rect x="384" y="272" width="94" height="66" rx="9" class="card"/>
    <text x="431" y="313" class="value" text-anchor="middle">1千</text>
    <rect x="495" y="272" width="94" height="66" rx="9" class="hot"/>
    <text x="542" y="313" class="value" text-anchor="middle">1千</text>
    <text x="44" y="365" class="small" text-anchor="start">緑9個：popular ／ 黄1個：rare</text>
    <rect x="20" y="425" width="600" height="265" rx="18" class="panel"/>
    <text x="40" y="465" class="bold" text-anchor="start">探す値は1種類でも、対象行数は違う</text>
    <text x="45" y="510" class="bold" text-anchor="start">popular</text>
    <rect x="197" y="479" width="360" height="43" rx="4" class="card"/>
    <text x="566" y="510" class="small" text-anchor="end">90%</text>
    <text x="45" y="585" class="bold" text-anchor="start">rare</text>
    <rect x="197" y="554" width="40" height="43" rx="4" class="hot"/>
    <text x="264" y="585" class="small" text-anchor="start">10%</text>
    <text x="46" y="654" class="teal" text-anchor="start">分布から、返る行数を見積もる</text>
  </g>
</svg>
