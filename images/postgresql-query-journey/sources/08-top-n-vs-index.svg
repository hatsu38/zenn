<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-labelledby="title">
  <title id="title">全部読むか、3件で止まるか</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}.model{fill:#566c7b}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
.storage{fill:#ece7f5;stroke:#735f9f;stroke-width:2}.file{fill:#fff;stroke:#735f9f;stroke-width:2}
  .cmp{fill:#dfe5ea}
.swap{fill:#dcefe8;stroke:#243b50;stroke-width:4}
.big{font-size:56px;font-weight:700}
  </style>
  <rect width="640" height="600" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">全部読むか、3件で止まるか</text>
  <rect x="548" y="22" width="68" height="36" rx="18" class="model"/>
  <text x="582" y="47" text-anchor="middle" class="tag">模型</text>
  <g id="unordered-read">
    <text x="24" y="104" class="b">順序が分からない入力</text>
    <rect x="24" y="122" width="136" height="44" rx="6" class="panel"/>
    <text x="92" y="153" text-anchor="middle" class="b">読む5</text>
    <rect x="176" y="122" width="44" height="44" rx="6" class="val"/>
    <text x="198" y="153" text-anchor="middle" class="b">8</text>
    <rect x="228" y="122" width="44" height="44" rx="6" class="val"/>
    <text x="250" y="153" text-anchor="middle" class="b">3</text>
    <rect x="280" y="122" width="44" height="44" rx="6" class="val"/>
    <text x="302" y="153" text-anchor="middle" class="b">5</text>
    <rect x="332" y="122" width="44" height="44" rx="6" class="val"/>
    <text x="354" y="153" text-anchor="middle" class="b">9</text>
    <rect x="384" y="122" width="44" height="44" rx="6" class="val"/>
    <text x="406" y="153" text-anchor="middle" class="b">2</text>
  </g>
  <g id="unordered-hold">
    <rect x="24" y="192" width="136" height="44" rx="6" class="panel"/>
    <text x="92" y="223" text-anchor="middle" class="b">持つ3</text>
    <rect x="176" y="182" width="316" height="64" rx="10" class="work"/>
    <text x="190" y="222" class="s b">候補（3枚）</text>
    <rect x="330" y="192" width="44" height="44" rx="6" class="val"/>
    <text x="352" y="223" text-anchor="middle" class="b">9</text>
    <rect x="382" y="192" width="44" height="44" rx="6" class="val"/>
    <text x="404" y="223" text-anchor="middle" class="b">8</text>
    <rect x="434" y="192" width="44" height="44" rx="6" class="val"/>
    <text x="456" y="223" text-anchor="middle" class="b">5</text>
  </g>
  <g id="unordered-return">
    <rect x="24" y="262" width="136" height="44" rx="6" class="panel"/>
    <text x="92" y="293" text-anchor="middle" class="b">返す3</text>
    <rect x="176" y="262" width="44" height="44" rx="6" class="val"/>
    <text x="198" y="293" text-anchor="middle" class="b">9</text>
    <rect x="228" y="262" width="44" height="44" rx="6" class="val"/>
    <text x="250" y="293" text-anchor="middle" class="b">8</text>
    <rect x="280" y="262" width="44" height="44" rx="6" class="val"/>
    <text x="302" y="293" text-anchor="middle" class="b">5</text>
  </g>
  <path d="M24 330 H616" class="panel"/>
  <g id="index-read">
    <text x="24" y="374" class="b">大きい順のIndex</text>
    <rect x="24" y="392" width="136" height="44" rx="6" class="hot"/>
    <text x="92" y="423" text-anchor="middle" class="b">読む3</text>
    <rect x="176" y="392" width="44" height="44" rx="6" class="val"/>
    <text x="198" y="423" text-anchor="middle" class="b">9</text>
    <rect x="228" y="392" width="44" height="44" rx="6" class="val"/>
    <text x="250" y="423" text-anchor="middle" class="b">8</text>
    <rect x="280" y="392" width="44" height="44" rx="6" class="val"/>
    <text x="302" y="423" text-anchor="middle" class="b">5</text>
    <rect x="332" y="392" width="44" height="44" rx="6" class="ghost"/>
    <text x="354" y="422" text-anchor="middle" class="m">3</text>
    <rect x="384" y="392" width="44" height="44" rx="6" class="ghost"/>
    <text x="406" y="422" text-anchor="middle" class="m">2</text>
    <text x="444" y="422" class="m">要求しない</text>
  </g>
  <g id="index-hold">
    <rect x="24" y="462" width="136" height="44" rx="6" class="panel"/>
    <text x="92" y="493" text-anchor="middle" class="b">持つ なし</text>
  </g>
  <g id="index-return">
    <rect x="24" y="532" width="136" height="44" rx="6" class="panel"/>
    <text x="92" y="563" text-anchor="middle" class="b">返す3</text>
    <rect x="176" y="532" width="44" height="44" rx="6" class="val"/>
    <text x="198" y="563" text-anchor="middle" class="b">9</text>
    <rect x="228" y="532" width="44" height="44" rx="6" class="val"/>
    <text x="250" y="563" text-anchor="middle" class="b">8</text>
    <rect x="280" y="532" width="44" height="44" rx="6" class="val"/>
    <text x="302" y="563" text-anchor="middle" class="b">5</text>
  </g>
</svg>
