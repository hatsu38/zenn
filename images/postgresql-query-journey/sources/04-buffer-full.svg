    <text x="202" y="278" text-anchor="middle" class="s b">P8</text>
    <path d="M182 302 H254" class="row" stroke-linecap="round"/>
    <path d="M182 316 H254" class="row" stroke-linecap="round"/>
    <path d="M182 330 H254" class="row" stroke-linecap="round"/>
    <rect x="288" y="256" width="52" height="36" rx="6" class="page"/>
    <rect x="280" y="286" width="100" height="62" rx="8" class="page"/>
    <text x="314" y="278" text-anchor="middle" class="s b">P5</text>
    <path d="M294 302 H366" class="row" stroke-linecap="round"/>
    <path d="M294 316 H366" class="row" stroke-linecap="round"/>
    <path d="M294 330 H366" class="row" stroke-linecap="round"/>
    <rect x="64" y="352" width="52" height="36" rx="6" class="page"/>
    <rect x="56" y="382" width="100" height="62" rx="8" class="page"/>
    <text x="90" y="374" text-anchor="middle" class="s b">P3</text>
    <path d="M70 398 H142" class="row" stroke-linecap="round"/>
    <path d="M70 412 H142" class="row" stroke-linecap="round"/>
    <path d="M70 426 H142" class="row" stroke-linecap="round"/>
