    <path d="M182 412 H254" class="row" stroke-linecap="round"/>
    <path d="M182 426 H254" class="row" stroke-linecap="round"/>
  </g>
  <g id="free-slot">
    <rect x="280" y="382" width="100" height="62" rx="8" class="hot"/>
    <text x="330" y="421" text-anchor="middle" class="s b">空き</text>
  </g>
  <g id="evicted">
