<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="title">
  <title id="title">読み込んだページを、次も使う</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
.storage{fill:#ece7f5;stroke:#735f9f;stroke-width:2}.file{fill:#fff;stroke:#735f9f;stroke-width:2}
  .cmp{fill:#dfe5ea}
.swap{fill:#dcefe8;stroke:#243b50;stroke-width:4}
.big{font-size:56px;font-weight:700}
  </style>
  <rect width="640" height="820" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">読み込んだページを、次も使う</text>
  <g id="searches">
    <rect x="24" y="76" width="160" height="48" rx="10" class="panel"/>
    <text x="104" y="108" text-anchor="middle" class="b">検索</text>
    <rect x="214" y="76" width="160" height="48" rx="10" class="panel"/>
    <text x="294" y="108" text-anchor="middle" class="b">次の検索</text>
  </g>
  <g id="memory">
    <rect x="24" y="180" width="592" height="352" rx="12" class="panel"/>
    <text x="596" y="216" text-anchor="end" class="b">メモリ（RAM）</text>
    <rect x="44" y="220" width="356" height="160" rx="12" class="buffer"/>
    <text x="64" y="256" class="b">共有バッファ</text>
    <rect x="268" y="246" width="52" height="36" rx="6" class="page"/>
    <rect x="258" y="276" width="126" height="88" rx="8" class="page"/>
    <rect x="272" y="290" width="98" height="16" rx="3" class="row"/>
    <rect x="272" y="314" width="98" height="16" rx="3" class="row"/>
    <rect x="272" y="338" width="98" height="16" rx="3" class="row"/>
    <text x="294" y="268" text-anchor="middle" class="s b">P7</text>
    <rect x="44" y="464" width="396" height="52" rx="10" class="panel"/>
    <text x="212" y="498" text-anchor="middle" class="b">OSキャッシュ</text>
  </g>
  <g id="storage">
    <rect x="24" y="588" width="592" height="216" rx="12" class="storage"/>
    <text x="44" y="628" class="b">ストレージ（SSDなど）</text>
    <rect x="302" y="646" width="294" height="142" rx="6" class="file"/>
    <text x="316" y="678" class="s">テーブルの</text>
    <text x="316" y="706" class="s">ファイル</text>
    <rect x="470" y="658" width="52" height="36" rx="6" class="page"/>
    <rect x="460" y="688" width="126" height="88" rx="8" class="page"/>
    <rect x="474" y="702" width="98" height="16" rx="3" class="row"/>
    <rect x="474" y="726" width="98" height="16" rx="3" class="row"/>
    <rect x="474" y="750" width="98" height="16" rx="3" class="row"/>
    <text x="496" y="680" text-anchor="middle" class="s b">P7</text>
  </g>
  <g id="route">
    <path d="M104 128 V212" class="req"/>
    <text x="116" y="150" class="s brown">① 探す</text>
    <path d="M104 384 V456" class="req"/>
    <text x="116" y="406" class="s brown">② なければ探す</text>
    <path d="M496 654 V490 H446" class="flow"/>
    <text x="484" y="572" text-anchor="end" class="s b teal">③ なければ読む</text>
    <path d="M321 460 V388" class="flow"/>
    <text x="333" y="448" class="s b teal">④ 置く＝<tspan class="mono">shared read</tspan></text>
    <path d="M294 128 V240" class="ref"/>
    <rect x="306" y="134" width="251" height="36" rx="6" class="hot"/>
    <text x="318" y="159" class="s b">⑤ 使う＝<tspan class="mono">shared hit</tspan></text>
  </g>
</svg>
