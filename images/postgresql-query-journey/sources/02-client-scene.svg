<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" role="img"><title>画面の向こうで、SQLが動く</title><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif}</style><rect width="640" height="530" fill="#fffdf7"/><g id="chapter-scene"><text x="28" y="43" font-size="27" fill="#25374b">画面の向こうで、SQLが動く</text><text x="28" y="79" font-size="18" fill="#25374b">今回の実験では、psqlから接続する。</text><rect x="34" y="145" width="220" height="142" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><path d="M34 180 H254" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="170" font-size="17" fill="#25374b">手元のターミナル</text><path d="M144.0 287 v18 m-38 0 h76" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="225" font-size="19" fill="#25374b">psql：SELECT …</text><rect x="380" y="132" width="210" height="208" rx="10" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="407" y="168" font-size="23" fill="#25374b">PostgreSQL</text><rect x="410" y="194" width="149" height="59" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><text x="426" y="230" font-size="18" fill="#25374b">バックエンド</text><path d="M262 220 L370 220" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 213 L370 220 L360 227" fill="none" stroke="#25374b" stroke-width="3"/><text x="283" y="200" font-size="19" fill="#25374b">SQL</text><text x="399" y="297" font-size="18" fill="#25374b">サーバ側で実行</text><rect x="24" y="420" width="592" height="70" rx="10" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="43" y="463" font-size="21" fill="#25374b">入力する場所と、処理する場所は違う。</text><text x="28" y="515" font-size="14" fill="#25374b">学ぶきっかけを描く絵 ／ 実行結果や内部配置の実測ではありません</text></g></svg>