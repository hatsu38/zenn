<svg xmlns="http://www.w3.org/2000/svg" width="640" height="814" viewBox="0 0 640 814" role="img" aria-labelledby="title">
  <title id="title">ログの保存と、ページの書き出し</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
.storage{fill:#ece7f5;stroke:#735f9f;stroke-width:2}.file{fill:#fff;stroke:#735f9f;stroke-width:2}
  .cmp{fill:#dfe5ea}
.swap{fill:#dcefe8;stroke:#243b50;stroke-width:4}
.big{font-size:56px;font-weight:700}
  </style>
  <rect width="640" height="814" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">ログの保存と、ページの書き出し</text>
  <g id="panel-1">
    <rect x="24" y="76" width="592" height="230" rx="14" class="panel"/>
    <text x="44" y="114" class="b">① COMMITまでにWALを保存</text>
    <rect x="44" y="130" width="552" height="60" rx="10" class="buffer"/>
    <text x="60" y="166" class="s b">共有バッファ</text>
    <rect x="300" y="141" width="280" height="38" rx="4" class="hot"/>
    <text x="316" y="166" class="s b">本42：改訂版</text>
    <path d="M440 190 V216" class="flow"/>
    <text x="460" y="207" class="s teal">保存</text>
    <rect x="44" y="216" width="552" height="60" rx="10" class="storage"/>
    <text x="60" y="252" class="s b">ストレージ</text>
    <rect x="180" y="227" width="224" height="38" rx="6" class="file"/>
    <text x="196" y="252" class="s">テーブルのファイル</text>
    <rect x="416" y="227" width="164" height="38" rx="6" class="file"/>
    <text x="424" y="252" class="s">WALファイル</text>
  </g>
  <g id="panel-2">
    <rect x="24" y="320" width="592" height="230" rx="14" class="panel"/>
    <text x="44" y="358" class="b">② 電源断でメモリが消える</text>
    <rect x="44" y="374" width="552" height="60" rx="10" class="ghost"/>
    <text x="60" y="410" class="s m">共有バッファ</text>
    <path d="M305 389 L335 419 M335 389 L305 419" fill="none" stroke="#7d93a3" stroke-width="3" stroke-linecap="round"/>
    <rect x="44" y="460" width="552" height="60" rx="10" class="storage"/>
    <text x="60" y="496" class="s b">ストレージ</text>
    <rect x="180" y="471" width="224" height="38" rx="6" class="file"/>
    <text x="196" y="496" class="s">テーブルのファイル</text>
    <rect x="416" y="471" width="164" height="38" rx="6" class="file"/>
    <text x="424" y="496" class="s">WALファイル</text>
  </g>
  <g id="panel-3">
    <rect x="24" y="564" width="592" height="230" rx="14" class="panel"/>
    <text x="44" y="602" class="b">③ 再起動でWALから再現</text>
    <rect x="44" y="618" width="552" height="60" rx="10" class="buffer"/>
    <text x="60" y="654" class="s b">共有バッファ</text>
    <rect x="300" y="629" width="280" height="38" rx="4" class="row"/>
    <text x="316" y="654" class="s">本42：改訂版</text>
    <path d="M440 704 V678" class="flow"/>
    <text x="460" y="700" class="s teal">再現</text>
    <rect x="44" y="704" width="552" height="60" rx="10" class="storage"/>
    <text x="60" y="740" class="s b">ストレージ</text>
    <rect x="180" y="715" width="224" height="38" rx="6" class="file"/>
    <text x="196" y="740" class="s">テーブルのファイル</text>
    <rect x="416" y="715" width="164" height="38" rx="6" class="file"/>
    <text x="424" y="740" class="s">WALファイル</text>
  </g>
</svg>
