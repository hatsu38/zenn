<svg xmlns="http://www.w3.org/2000/svg" width="640" height="812" viewBox="0 0 640 812" role="img" aria-labelledby="title">
  <title id="title">ログの保存と、ページの書き出し</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
.storage{fill:#ece7f5;stroke:#735f9f;stroke-width:2}.file{fill:#fff;stroke:#735f9f;stroke-width:2}
  .cmp{fill:#dfe5ea}
.swap{fill:#dcefe8;stroke:#243b50;stroke-width:4}
.big{font-size:56px;font-weight:700}
  </style>
  <rect width="640" height="812" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">ログの保存と、ページの書き出し</text>
  <g id="panel-1">
    <rect x="24" y="72" width="592" height="176" rx="14" class="panel"/>
    <text x="44" y="108" class="b">① チェックポイント（書き出して印を残す）</text>
    <rect x="40" y="122" width="180" height="116" rx="10" class="buffer"/>
    <text x="52" y="146" class="s b">メモリ</text>
    <rect x="50" y="156" width="160" height="76" rx="4" class="row"/>
    <text x="62" y="187" class="s">変更済みの</text>
    <text x="62" y="217" class="s">ページ</text>
    <rect x="330" y="122" width="270" height="116" rx="10" class="storage"/>
    <text x="342" y="146" class="s b">ストレージ</text>
    <rect x="340" y="156" width="230" height="36" rx="6" class="file"/>
    <text x="352" y="181" class="s">テーブルのファイル</text>
    <rect x="340" y="196" width="252" height="40" rx="6" class="file"/>
    <text x="350" y="224" class="s b">WAL</text>
    <rect x="410" y="201" width="56" height="30" rx="4" class="row"/>
    <text x="438" y="224" text-anchor="middle" class="s">記録</text>
    <rect x="472" y="201" width="32" height="30" rx="4" class="hot"/>
    <text x="488" y="224" text-anchor="middle" class="s b">印</text>
    <text x="275" y="178" text-anchor="middle" class="s teal">書き出す</text>
    <path d="M212 194 L338 194" class="flow"/>
  </g>
  <g id="panel-2">
    <rect x="24" y="256" width="592" height="176" rx="14" class="panel"/>
    <text x="44" y="292" class="b">② UPDATEのCOMMITまでにWALを保存</text>
    <rect x="40" y="306" width="180" height="116" rx="10" class="buffer"/>
    <text x="52" y="330" class="s b">メモリ</text>
    <rect x="50" y="340" width="160" height="36" rx="4" class="row"/>
    <text x="60" y="365" class="s">本42：改訂版</text>
    <rect x="50" y="382" width="160" height="36" rx="4" class="hot"/>
    <text x="60" y="407" class="s b">変更の記録</text>
    <rect x="330" y="306" width="270" height="116" rx="10" class="storage"/>
    <text x="342" y="330" class="s b">ストレージ</text>
    <rect x="340" y="340" width="230" height="36" rx="6" class="file"/>
    <text x="352" y="365" class="s">テーブルのファイル</text>
    <rect x="340" y="380" width="252" height="40" rx="6" class="file"/>
    <text x="350" y="408" class="s b">WAL</text>
    <rect x="410" y="385" width="56" height="30" rx="4" class="row"/>
    <text x="438" y="408" text-anchor="middle" class="s">記録</text>
    <rect x="472" y="385" width="32" height="30" rx="4" fill="#fff" stroke="#243b50" stroke-width="2.5"/>
    <text x="488" y="408" text-anchor="middle" class="s b">印</text>
    <rect x="510" y="385" width="70" height="30" rx="4" class="row"/>
    <text x="545" y="408" text-anchor="middle" class="s">本42</text>
    <text x="275" y="390" text-anchor="middle" class="s teal">保存</text>
    <path d="M212 400 L338 400" class="flow"/>
  </g>
  <g id="panel-3">
    <rect x="24" y="440" width="592" height="176" rx="14" class="panel"/>
    <text x="44" y="476" class="b">③ 電源断でメモリが消える</text>
    <rect x="40" y="490" width="180" height="116" rx="10" class="ghost"/>
    <text x="52" y="514" class="s m">メモリ</text>
    <path d="M115 534 L145 564 M145 534 L115 564" fill="none" stroke="#7d93a3" stroke-width="3" stroke-linecap="round"/>
    <rect x="330" y="490" width="270" height="116" rx="10" class="storage"/>
    <text x="342" y="514" class="s b">ストレージ</text>
    <rect x="340" y="524" width="230" height="36" rx="6" class="file"/>
    <text x="352" y="549" class="s">テーブルのファイル</text>
    <rect x="340" y="564" width="252" height="40" rx="6" class="file"/>
    <text x="350" y="592" class="s b">WAL</text>
    <rect x="410" y="569" width="56" height="30" rx="4" class="row"/>
    <text x="438" y="592" text-anchor="middle" class="s">記録</text>
    <rect x="472" y="569" width="32" height="30" rx="4" fill="#fff" stroke="#243b50" stroke-width="2.5"/>
    <text x="488" y="592" text-anchor="middle" class="s b">印</text>
    <rect x="510" y="569" width="70" height="30" rx="4" class="row"/>
    <text x="545" y="592" text-anchor="middle" class="s">本42</text>
  </g>
  <g id="panel-4">
    <rect x="24" y="624" width="592" height="176" rx="14" class="panel"/>
    <text x="44" y="660" class="b">④ 再起動で、印から後のWALを読む</text>
    <rect x="40" y="674" width="180" height="116" rx="10" class="buffer"/>
    <text x="52" y="698" class="s b">メモリ</text>
    <rect x="50" y="708" width="160" height="36" rx="4" class="row"/>
    <text x="60" y="733" class="s">本42：改訂版</text>
    <rect x="330" y="674" width="270" height="116" rx="10" class="storage"/>
    <text x="342" y="698" class="s b">ストレージ</text>
    <rect x="340" y="708" width="230" height="36" rx="6" class="file"/>
    <text x="352" y="733" class="s">テーブルのファイル</text>
    <rect x="340" y="748" width="252" height="40" rx="6" class="file"/>
    <text x="350" y="776" class="s b">WAL</text>
    <rect x="410" y="753" width="56" height="30" rx="4" class="ghost"/>
    <text x="438" y="776" text-anchor="middle" class="s m">記録</text>
    <rect x="472" y="753" width="32" height="30" rx="4" fill="#fff" stroke="#243b50" stroke-width="2.5"/>
    <text x="488" y="776" text-anchor="middle" class="s b">印</text>
    <rect x="510" y="753" width="70" height="30" rx="4" class="hot"/>
    <text x="545" y="776" text-anchor="middle" class="s b">本42</text>
    <text x="282" y="720" text-anchor="middle" class="s teal">再現</text>
    <path d="M338 768 L214 730" class="flow"/>
  </g>
</svg>
