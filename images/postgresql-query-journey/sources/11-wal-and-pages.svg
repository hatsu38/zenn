<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="945" viewBox="0 0 640 945" role="img" aria-labelledby="title description">
  

  <title id="title">ログの保存と、ページの書き出し</title>
  <desc id="description">役割と順序の制約を示す模型 ／ 実際の処理は並行する</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="945" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">ログの保存と、ページの書き出し</text>
  <text x="28" y="82" class="muted" text-anchor="start">役割と順序の制約を示す模型 ／ 実際の処理は並行する</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="295" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">変更は、メモリ上のページに反映される</text>
    <rect x="44" y="184" width="552" height="174" rx="14" class="memory"/>
    <text x="62" y="219" class="bold" text-anchor="start">共有バッファ</text>
    <rect x="58" y="238" width="524" height="34" rx="6" class="hot"/>
    <text x="71" y="263" class="small" text-anchor="start">本42：改訂版</text>
    <rect x="58" y="281" width="524" height="34" rx="6" class="paper"/>
    <text x="71" y="306" class="small" text-anchor="start">変更済みページ</text>
    <text x="46" y="380" class="small" text-anchor="start">データファイルへの反映とは別の段階</text>
    <rect x="20" y="435" width="600" height="260" rx="18" class="panel"/>
    <text x="40" y="475" class="bold" text-anchor="start">WAL：変更を再現するための記録</text>
    <rect x="44" y="508" width="552" height="54" rx="12" class="card"/>
    <text x="320.0" y="543" class="" text-anchor="middle">必要なWALをストレージへ永続化</text>
    <path d="M320 570 L320 602" class="arrow"/>
    <text x="320" y="650" class="bold" text-anchor="middle">通常の同期COMMITが完了</text>
    <rect x="20" y="725" width="600" height="180" rx="18" class="panel"/>
    <text x="40" y="765" class="bold" text-anchor="start">データページも書き出す</text>
    <text x="44" y="804" class="small" text-anchor="start">ページの書き出し前に、必要なWALを永続化。</text>
    <text x="44" y="850" class="small" text-anchor="start">全ページの書き出しをCOMMITで待つわけではない。</text>
  </g>
</svg>
