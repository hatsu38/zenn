<svg xmlns="http://www.w3.org/2000/svg" width="640" height="596" viewBox="0 0 640 596" role="img" aria-labelledby="title">
  <title id="title">100万冊でも、読むのは3枚</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}.model{fill:#566c7b}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}
  </style>
  <rect width="640" height="596" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">100万冊でも、読むのは3枚</text>
  <g id="new-root">
    <rect x="129" y="96" width="26" height="36" rx="5" class="ghost"/>
    <text x="352" y="108" class="m">1億冊なら、</text>
    <text x="352" y="136" class="m">案内板が1段増えて4枚</text>
  </g>
  <g id="level-1">
    <rect x="129" y="176" width="26" height="36" rx="5" class="route"/>
    <text x="352" y="202" class="s">案内板 1枚</text>
  </g>
  <g id="level-2">
    <rect x="29" y="276" width="26" height="36" rx="5" class="ipage"/>
    <rect x="79" y="276" width="26" height="36" rx="5" class="ipage"/>
    <rect x="129" y="276" width="26" height="36" rx="5" class="route"/>
    <rect x="179" y="276" width="26" height="36" rx="5" class="ipage"/>
    <rect x="229" y="276" width="26" height="36" rx="5" class="ipage"/>
    <text x="292" y="302" text-anchor="middle" class="s b">…</text>
    <text x="352" y="302" class="s">案内板 100枚</text>
  </g>
  <g id="level-3">
    <rect x="24" y="376" width="26" height="36" rx="5" class="ipage"/>
    <rect x="59" y="376" width="26" height="36" rx="5" class="ipage"/>
    <rect x="94" y="376" width="26" height="36" rx="5" class="ipage"/>
    <rect x="129" y="376" width="26" height="36" rx="5" class="route"/>
    <rect x="164" y="376" width="26" height="36" rx="5" class="ipage"/>
    <rect x="199" y="376" width="26" height="36" rx="5" class="ipage"/>
    <rect x="234" y="376" width="26" height="36" rx="5" class="ipage"/>
    <rect x="269" y="376" width="26" height="36" rx="5" class="ipage"/>
    <text x="317" y="402" text-anchor="middle" class="s b">…</text>
    <text x="352" y="402" class="s">箱 1万個（1箱に100冊）</text>
    <text x="24" y="446" class="s b">100万冊</text>
  </g>
  <g id="route-arrows">
    <path d="M142 215 V273" class="ref"/>
    <path d="M142 315 V373" class="ref"/>
    <text x="174" y="250" class="s">たどる</text>
  </g>
  <g id="count">
    <rect x="24" y="480" width="300" height="50" rx="6" class="hot"/>
    <text x="40" y="514" class="b">読むのは 1＋1＋1＝3枚</text>
    <text x="40" y="568">全部なら 1＋100＋10,000＝10,101枚</text>
  </g>
</svg>
