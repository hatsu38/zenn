<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780" role="img" aria-labelledby="title description">
  

  <title id="title">先に分類し、同じ箱の中で照合する</title>
  <desc id="description">Hash Joinの模型 ／ 実際のハッシュ関数とは異なる</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="780" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">先に分類し、同じ箱の中で照合する</text>
  <text x="28" y="82" class="muted" text-anchor="start">Hash Joinの模型 ／ 実際のハッシュ関数とは異なる</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="310" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">① 本を、番号の余りで箱へ分ける</text>
    <rect x="43" y="187" width="158" height="160" rx="12" class="box"/>
    <text x="122" y="225" class="bold" text-anchor="middle">箱0</text>
    <rect x="53" y="251" width="40" height="60" rx="9" class="card"/>
    <text x="73.0" y="291.0" class="value" text-anchor="middle">3</text>
    <rect x="102" y="251" width="40" height="60" rx="9" class="card"/>
    <text x="122.0" y="291.0" class="value" text-anchor="middle">6</text>
    <rect x="151" y="251" width="40" height="60" rx="9" class="card"/>
    <text x="171.0" y="291.0" class="value" text-anchor="middle">9</text>
    <rect x="241" y="187" width="158" height="160" rx="12" class="box"/>
    <text x="320" y="225" class="bold" text-anchor="middle">箱1</text>
    <rect x="251" y="251" width="40" height="60" rx="9" class="card"/>
    <text x="271.0" y="291.0" class="value" text-anchor="middle">1</text>
    <rect x="300" y="251" width="40" height="60" rx="9" class="card"/>
    <text x="320.0" y="291.0" class="value" text-anchor="middle">4</text>
    <rect x="349" y="251" width="40" height="60" rx="9" class="card"/>
    <text x="369.0" y="291.0" class="value" text-anchor="middle">7</text>
    <rect x="439" y="187" width="158" height="160" rx="12" class="box"/>
    <text x="518" y="225" class="bold" text-anchor="middle">箱2</text>
    <rect x="449" y="251" width="40" height="60" rx="9" class="card"/>
    <text x="469.0" y="291.0" class="value" text-anchor="middle">2</text>
    <rect x="498" y="251" width="40" height="60" rx="9" class="card"/>
    <text x="518.0" y="291.0" class="value" text-anchor="middle">5</text>
    <rect x="547" y="251" width="40" height="60" rx="9" class="card"/>
    <text x="567.0" y="291.0" class="value" text-anchor="middle">8</text>
    <text x="42" y="384" class="small" text-anchor="start">模型の規則：本の番号を3で割った余り</text>
    <rect x="20" y="450" width="600" height="285" rx="18" class="panel"/>
    <text x="40" y="490" class="bold" text-anchor="start">② 記録の本4も、同じ規則で箱1へ</text>
    <rect x="47" y="529" width="195" height="54" rx="12" class="hot"/>
    <text x="144.5" y="564" class="" text-anchor="middle">記録：本4</text>
    <path d="M252 556 L356 556" class="arrow"/>
    <rect x="368" y="529" width="225" height="54" rx="12" class="box"/>
    <text x="480.5" y="564" class="" text-anchor="middle">箱1：1・4・7</text>
    <text x="47" y="643" class="teal" text-anchor="start">箱の中で番号が4かを確認する</text>
    <text x="47" y="694" class="small" text-anchor="start">同じ箱でも、同じ番号とは限らない</text>
  </g>
</svg>
