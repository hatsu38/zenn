<svg xmlns="http://www.w3.org/2000/svg" width="640" height="664" viewBox="0 0 640 664" role="img" aria-labelledby="title">
  <title id="title">先に分類し、同じ箱の中で照合する</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
  </style>
  <rect width="640" height="664" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">先に分類し、同じ箱の中で照合する</text>
  <g id="build">
    <text x="24" y="104" class="b">① 本を、番号の余りで箱へ分ける</text>
    <rect x="24" y="122" width="592" height="164" rx="10" class="work"/>
    <text x="44" y="154" class="s b">ハッシュ表</text>
    <text x="172" y="154" class="s"><tspan class="mono">Buckets</tspan>＝箱の数</text>
    <rect x="40" y="170" width="176" height="96" rx="10" class="panel"/>
    <text x="54" y="198" class="s b">箱0</text>
    <rect x="52" y="210" width="44" height="44" rx="6" class="val"/>
    <text x="74" y="241" text-anchor="middle" class="b">3</text>
    <rect x="106" y="210" width="44" height="44" rx="6" class="val"/>
    <text x="128" y="241" text-anchor="middle" class="b">6</text>
    <rect x="160" y="210" width="44" height="44" rx="6" class="val"/>
    <text x="182" y="241" text-anchor="middle" class="b">9</text>
    <rect x="232" y="170" width="176" height="96" rx="10" class="panel"/>
    <text x="246" y="198" class="s b">箱1</text>
    <rect x="244" y="210" width="44" height="44" rx="6" class="val"/>
    <text x="266" y="241" text-anchor="middle" class="b">1</text>
    <rect x="298" y="210" width="44" height="44" rx="6" class="val"/>
    <text x="320" y="241" text-anchor="middle" class="b">4</text>
    <rect x="352" y="210" width="44" height="44" rx="6" class="val"/>
    <text x="374" y="241" text-anchor="middle" class="b">7</text>
    <rect x="424" y="170" width="176" height="96" rx="10" class="panel"/>
    <text x="438" y="198" class="s b">箱2</text>
    <rect x="436" y="210" width="44" height="44" rx="6" class="val"/>
    <text x="458" y="241" text-anchor="middle" class="b">2</text>
    <rect x="490" y="210" width="44" height="44" rx="6" class="val"/>
    <text x="512" y="241" text-anchor="middle" class="b">5</text>
    <rect x="544" y="210" width="44" height="44" rx="6" class="val"/>
    <text x="566" y="241" text-anchor="middle" class="b">8</text>
    <text x="24" y="320" class="s">本の番号 ÷ 3 の余り＝箱の番号</text>
  </g>
  <g id="probe">
    <text x="24" y="392" class="b">② 記録の本8を照合する</text>
    <rect x="437" y="362" width="150" height="44" rx="6" class="row"/>
    <text x="512" y="392" text-anchor="middle">記録：本8</text>
    <rect x="24" y="462" width="592" height="178" rx="10" class="work"/>
    <rect x="40" y="488" width="176" height="136" rx="10" class="ghost"/>
    <text x="54" y="516" class="m">箱0</text>
    <rect x="52" y="530" width="44" height="44" rx="4" class="ghost"/>
    <text x="74" y="561" text-anchor="middle" class="m">3</text>
    <rect x="106" y="530" width="44" height="44" rx="4" class="ghost"/>
    <text x="128" y="561" text-anchor="middle" class="m">6</text>
    <rect x="160" y="530" width="44" height="44" rx="4" class="ghost"/>
    <text x="182" y="561" text-anchor="middle" class="m">9</text>
    <text x="128" y="606" text-anchor="middle" class="m">見ない</text>
    <rect x="232" y="488" width="176" height="136" rx="10" class="ghost"/>
    <text x="246" y="516" class="m">箱1</text>
    <rect x="244" y="530" width="44" height="44" rx="4" class="ghost"/>
    <text x="266" y="561" text-anchor="middle" class="m">1</text>
    <rect x="298" y="530" width="44" height="44" rx="4" class="ghost"/>
    <text x="320" y="561" text-anchor="middle" class="m">4</text>
    <rect x="352" y="530" width="44" height="44" rx="4" class="ghost"/>
    <text x="374" y="561" text-anchor="middle" class="m">7</text>
    <text x="320" y="606" text-anchor="middle" class="m">見ない</text>
    <rect x="424" y="488" width="176" height="136" rx="10" class="hot"/>
    <text x="438" y="516" class="s b">箱2</text>
    <rect x="436" y="530" width="44" height="44" rx="6" class="val"/>
    <text x="458" y="561" text-anchor="middle" class="b">2</text>
    <text x="458" y="606" text-anchor="middle" class="b">×</text>
    <rect x="490" y="530" width="44" height="44" rx="6" class="val"/>
    <text x="512" y="561" text-anchor="middle" class="b">5</text>
    <text x="512" y="606" text-anchor="middle" class="b">×</text>
    <rect x="544" y="530" width="44" height="44" rx="6" class="match"/>
    <text x="566" y="561" text-anchor="middle" class="b">8</text>
    <text x="566" y="606" text-anchor="middle" class="b teal">✓</text>
    <path d="M512 406 V484" class="ref"/>
    <text x="498" y="440" text-anchor="end" class="s">余りが2なので、箱2だけを見る</text>
  </g>
</svg>
