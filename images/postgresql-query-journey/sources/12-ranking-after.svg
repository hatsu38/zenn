<svg xmlns="http://www.w3.org/2000/svg" width="640" height="812" viewBox="0 0 640 812" role="img" aria-labelledby="title">
  <title id="title">上位を選んでから、題名を付ける</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}.model{fill:#566c7b}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
.storage{fill:#ece7f5;stroke:#735f9f;stroke-width:2}.file{fill:#fff;stroke:#735f9f;stroke-width:2}
  .cmp{fill:#dfe5ea}
.swap{fill:#dcefe8;stroke:#243b50;stroke-width:4}
.big{font-size:56px;font-weight:700}
  </style>
  <rect width="640" height="732" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">上位を選んでから、題名を付ける</text>
  <rect x="548" y="22" width="68" height="36" rx="18" class="model"/>
  <text x="582" y="47" text-anchor="middle" class="tag">模型</text>

  <g id="group-by">
    <text x="24" y="108" class="b">① <tspan class="mono">GROUP BY</tspan>：本ごとに数える</text>
    <rect x="24" y="124" width="592" height="248" rx="12" class="panel"/>
    <text x="40" y="152" class="s m">本番号</text>
    <text x="430" y="152" class="s m">件数</text>
    <rect x="40" y="162" width="130" height="26" rx="4" class="row"/>
    <text x="105" y="182" text-anchor="middle" class="s">本1</text>
    <rect x="40" y="196" width="130" height="26" rx="4" class="row"/>
    <text x="105" y="216" text-anchor="middle" class="s">本1</text>
    <rect x="40" y="230" width="130" height="26" rx="4" class="row"/>
    <text x="105" y="250" text-anchor="middle" class="s">本1</text>
    <rect x="40" y="264" width="130" height="26" rx="4" class="row"/>
    <text x="105" y="284" text-anchor="middle" class="s">本2</text>
    <rect x="40" y="298" width="130" height="26" rx="4" class="row"/>
    <text x="105" y="318" text-anchor="middle" class="s">本2</text>
    <rect x="40" y="332" width="130" height="26" rx="4" class="row"/>
    <text x="105" y="352" text-anchor="middle" class="s">本3</text>
    <rect x="430" y="172" width="150" height="44" rx="4" class="val"/>
    <text x="505" y="200" text-anchor="middle" class="s b">本1：3</text>
    <rect x="430" y="244" width="150" height="44" rx="4" class="val"/>
    <text x="505" y="272" text-anchor="middle" class="s b">本2：2</text>
    <rect x="430" y="316" width="150" height="44" rx="4" class="val"/>
    <text x="505" y="344" text-anchor="middle" class="s b">本3：1</text>
    <path d="M170 175 L430 194" class="ref"/>
    <path d="M170 209 L430 194" class="ref"/>
    <path d="M170 243 L430 194" class="ref"/>
    <path d="M170 277 L430 266" class="ref"/>
    <path d="M170 311 L430 266" class="ref"/>
    <path d="M170 345 L430 338" class="ref"/>
  </g>

  <g id="order-limit">
    <text x="24" y="404" class="b">② <tspan class="mono">ORDER BY</tspan> / <tspan class="mono">LIMIT</tspan>：上位を選ぶ</text>
    <rect x="24" y="420" width="592" height="96" rx="12" class="panel"/>
    <rect x="40" y="440" width="170" height="56" rx="8" class="val"/>
    <text x="125" y="474" text-anchor="middle" class="b">本1：3</text>
    <rect x="235" y="440" width="170" height="56" rx="8" class="val"/>
    <text x="320" y="474" text-anchor="middle" class="b">本2：2</text>
    <rect x="430" y="440" width="170" height="56" rx="8" class="panel"/>
    <text x="515" y="474" text-anchor="middle" class="b">本3：1　×</text>
  </g>

  <g id="join">
    <text x="24" y="548" class="b">③ <tspan class="mono">JOIN</tspan>：上位だけに題名を付ける</text>
    <rect x="24" y="564" width="592" height="148" rx="12" class="panel"/>
    <rect x="40" y="584" width="170" height="44" rx="8" class="hot"/>
    <text x="125" y="613" text-anchor="middle" class="b">本1：3</text>
    <rect x="40" y="648" width="170" height="44" rx="8" class="hot"/>
    <text x="125" y="677" text-anchor="middle" class="b">本2：2</text>
    <text x="430" y="596" class="s m">本の表</text>
    <rect x="430" y="604" width="150" height="40" rx="4" class="row"/>
    <text x="505" y="631" text-anchor="middle" class="s">1　星</text>
    <rect x="430" y="656" width="150" height="40" rx="4" class="row"/>
    <text x="505" y="683" text-anchor="middle" class="s">2　海</text>
    <path d="M210 606 L430 624" class="ref"/>
    <path d="M210 670 L430 676" class="ref"/>
  </g>
</svg>
