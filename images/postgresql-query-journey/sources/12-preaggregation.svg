<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="940" viewBox="0 0 640 940" role="img" aria-labelledby="title description">
  

  <title id="title">表示は軽くなる。集計の更新は必要。</title>
  <desc id="description">事前集計の模型 ／ 訂正・削除への対応も必要</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="940" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">表示は軽くなる。集計の更新は必要。</text>
  <text x="28" y="82" class="muted" text-anchor="start">事前集計の模型 ／ 訂正・削除への対応も必要</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="245" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">① 集計した件数を、表に保存する</text>
    <rect x="45" y="190" width="244" height="54" rx="12" class="box"/>
    <text x="167.0" y="225" class="" text-anchor="middle">記録を数える</text>
    <path d="M300 217 L346 217" class="arrow"/>
    <rect x="360" y="190" width="235" height="54" rx="12" class="card"/>
    <text x="477.5" y="225" class="" text-anchor="middle">本1：3件</text>
    <text x="44" y="308" class="small" text-anchor="start">画面は保存した件数を読み出せる</text>
    <rect x="20" y="385" width="600" height="245" rx="18" class="panel"/>
    <text x="40" y="425" class="bold" text-anchor="start">② 新しい記録が1件増える</text>
    <rect x="45" y="465" width="244" height="54" rx="12" class="hot"/>
    <text x="167.0" y="500" class="" text-anchor="middle">記録：合計4件</text>
    <rect x="360" y="465" width="235" height="54" rx="12" class="box"/>
    <text x="477.5" y="500" class="" text-anchor="middle">集計表：3件</text>
    <text x="44" y="583" class="orange" text-anchor="start">更新するまでは、保存した値は古い</text>
    <rect x="20" y="660" width="600" height="240" rx="18" class="panel"/>
    <text x="40" y="700" class="bold" text-anchor="start">③ 集計表を更新する</text>
    <rect x="45" y="740" width="244" height="54" rx="12" class="box"/>
    <text x="167.0" y="775" class="" text-anchor="middle">再集計・差分反映</text>
    <path d="M300 767 L346 767" class="arrow"/>
    <rect x="360" y="740" width="235" height="54" rx="12" class="card"/>
    <text x="477.5" y="775" class="" text-anchor="middle">本1：4件</text>
    <text x="44" y="854" class="small" text-anchor="start">いつ更新するか、誰が行うかを決める</text>
  </g>
</svg>
