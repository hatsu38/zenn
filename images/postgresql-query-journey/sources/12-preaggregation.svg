<svg xmlns="http://www.w3.org/2000/svg" width="640" height="656" viewBox="0 0 640 656" role="img" aria-labelledby="title">
  <title id="title">集計表は更新するまで古いまま</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}.model{fill:#566c7b}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
.storage{fill:#ece7f5;stroke:#735f9f;stroke-width:2}.file{fill:#fff;stroke:#735f9f;stroke-width:2}
  .cmp{fill:#dfe5ea}
.swap{fill:#dcefe8;stroke:#243b50;stroke-width:4}
.big{font-size:56px;font-weight:700}
  </style>
  <rect width="640" height="656" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">集計表は更新するまで古いまま</text>
  <rect x="548" y="22" width="68" height="36" rx="18" class="model"/>
  <text x="582" y="47" text-anchor="middle" class="tag">模型</text>

  <g id="timeline">
    <rect x="24" y="76" width="592" height="240" rx="14" class="panel"/>
    <rect x="44" y="112" width="110" height="70" rx="12" class="node"/>
    <text x="99" y="153" text-anchor="middle" class="b">① 集計</text>
    <path d="M154 131 H182 V121 L198 147 L182 173 V163 H154 Z" class="step"/>
    <rect x="198" y="112" width="210" height="70" rx="12" class="node"/>
    <text x="303" y="153" text-anchor="middle" class="b">② 記録が増える</text>
    <path d="M408 131 H436 V121 L452 147 L436 173 V163 H408 Z" class="step"/>
    <rect x="452" y="112" width="144" height="70" rx="12" class="node"/>
    <text x="524" y="153" text-anchor="middle" class="b">③ 数え直す</text>
  </g>

  <g id="stage-values">
    <rect x="15" y="200" width="168" height="34" rx="6" class="row"/>
    <text x="99" y="224" text-anchor="middle" class="s">集計表：3件</text>
    <rect x="219" y="200" width="168" height="34" rx="6" class="row"/>
    <text x="303" y="224" text-anchor="middle" class="s">読了記録＋1件</text>
    <rect x="440" y="200" width="168" height="34" rx="6" class="row"/>
    <text x="524" y="224" text-anchor="middle" class="s">集計表：4件</text>
  </g>

  <g id="stale-band">
    <path d="M303 234 V254" class="leader"/>
    <path d="M524 234 V254" class="leader"/>
    <rect x="303" y="254" width="221" height="40" rx="8" class="hot"/>
    <text x="413" y="280" text-anchor="middle" class="b">表示が古い時間</text>
  </g>

  <g id="screen">
    <rect x="24" y="336" width="592" height="300" rx="10" fill="#fff" stroke="#243b50" stroke-width="2.5"/>
    <path d="M24 374 H616" fill="none" stroke="#243b50" stroke-width="2.5"/>
    <text x="40" y="363" class="s">画面：週間ランキング</text>

    <rect x="44" y="394" width="260" height="150" rx="10" class="panel"/>
    <text x="60" y="424" class="b">集計表</text>
    <text x="60" y="452" class="mono">weekly_read</text>
    <text x="60" y="480" class="mono">_counts</text>
    <rect x="60" y="492" width="228" height="34" rx="4" class="row"/>
    <text x="72" y="516" class="s">1位　本1　3件</text>

    <rect x="360" y="394" width="228" height="150" rx="10" class="panel"/>
    <text x="380" y="460" class="b">上位20行</text>
    <text x="380" y="494" class="m">そのまま表示</text>

    <path d="M304 469 H356" class="flow"/>
    <text x="330" y="452" text-anchor="middle" class="s b teal">読む</text>

    <rect x="44" y="560" width="300" height="50" rx="10" class="ghost"/>
    <text x="60" y="591" class="m">読了記録　200万件</text>
    <text x="364" y="591" class="m">読まない</text>
  </g>
</svg>
