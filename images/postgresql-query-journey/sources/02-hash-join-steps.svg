<svg xmlns="http://www.w3.org/2000/svg" width="640" height="832" viewBox="0 0 640 832" role="img" aria-labelledby="title">
  <title id="title">Hash Joinが子を動かす順</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
.storage{fill:#ece7f5;stroke:#735f9f;stroke-width:2}.file{fill:#fff;stroke:#735f9f;stroke-width:2}
  .cmp{fill:#dfe5ea}
.swap{fill:#dcefe8;stroke:#243b50;stroke-width:4}
.big{font-size:56px;font-weight:700}
  </style>
  <rect width="640" height="832" fill="#f5f7f9"/>
  <text x="24" y="44" class="h"><tspan font-family="ui-monospace,Menlo,monospace">Hash Join</tspan>が子を動かす順</text>
  <g id="step-1">
    <rect x="24" y="68" width="592" height="370" rx="10" class="panel"/>
    <text x="44" y="100" class="s b">① <tspan class="mono">Hash</tspan>の側を最後まで動かす</text>
    <rect x="288" y="198" width="320" height="234" rx="14" class="hot"/>
    <rect x="36" y="116" width="568" height="44" rx="12" class="node"/>
    <text x="52" y="146" class="mono b">Hash Join</text>
    <rect x="36" y="204" width="244" height="104" rx="12" class="node"/>
    <text x="52" y="234" class="mono b">Seq Scan on</text>
    <text x="52" y="264" class="mono b">reading_records</text>
    <text x="52" y="294" class="m">まだ動かない</text>
    <rect x="296" y="204" width="304" height="76" rx="12" class="node"/>
    <text x="312" y="234" class="mono b">Hash</text>
    <text x="400" y="234" class="mono">rows=2.00</text>
    <text x="312" y="266" class="s">ハッシュ表</text>
    <rect x="436" y="244" width="56" height="28" rx="4" class="row"/>
    <text x="464" y="266" text-anchor="middle" class="s b">42</text>
    <rect x="500" y="244" width="56" height="28" rx="4" class="row"/>
    <text x="528" y="266" text-anchor="middle" class="s b">43</text>
    <rect x="296" y="320" width="304" height="104" rx="12" class="node"/>
    <text x="312" y="350" class="mono b">Index Scan using</text>
    <text x="312" y="380" class="mono b">books_pkey on books</text>
    <text x="312" y="410" class="mono">rows=2.00</text>
    <path d="M330 162 V202" class="req"/>
    <text x="358" y="188" class="s brown">求める</text>
    <path d="M570 204 V164" class="flow"/>
    <text x="550" y="188" text-anchor="end" class="s b teal">表を渡す</text>
    <path d="M330 282 V316" class="req"/>
    <text x="358" y="308" class="s brown">求める</text>
    <path d="M570 318 V284" class="flow"/>
    <text x="550" y="308" text-anchor="end" class="s b teal">2冊を渡す</text>
  </g>
  <g id="step-2">
    <rect x="24" y="450" width="592" height="370" rx="10" class="panel"/>
    <text x="44" y="482" class="s b">② 1件ずつ求めて照合する</text>
    <rect x="28" y="580" width="260" height="122" rx="14" class="hot"/>
    <rect x="36" y="498" width="568" height="44" rx="12" class="node"/>
    <text x="52" y="528" class="mono b">Hash Join</text>
    <text x="200" y="528" class="mono">rows=3.00</text>
    <rect x="36" y="586" width="244" height="104" rx="12" class="node"/>
    <text x="52" y="616" class="mono b">Seq Scan on</text>
    <text x="52" y="646" class="mono b">reading_records</text>
    <text x="52" y="676" class="mono">rows=2000000.00</text>
    <rect x="296" y="586" width="304" height="76" rx="12" class="node"/>
    <text x="312" y="616" class="mono b">Hash</text>
    <text x="400" y="616" class="mono">rows=2.00</text>
    <text x="312" y="648" class="s">ハッシュ表</text>
    <rect x="436" y="626" width="56" height="28" rx="4" class="row"/>
    <text x="464" y="648" text-anchor="middle" class="s b">42</text>
    <rect x="500" y="626" width="56" height="28" rx="4" class="row"/>
    <text x="528" y="648" text-anchor="middle" class="s b">43</text>
    <rect x="296" y="702" width="304" height="104" rx="12" class="node"/>
    <text x="312" y="732" class="mono b">Index Scan using</text>
    <text x="312" y="762" class="mono b">books_pkey on books</text>
    <text x="312" y="792" class="mono">rows=2.00</text>
    <path d="M60 544 V584" class="req"/>
    <text x="94" y="570" class="s brown">求める</text>
    <path d="M184 586 V546" class="flow"/>
    <text x="204" y="570" class="s b teal">1件ずつ渡す</text>
    <path d="M580 544 V584" class="ref"/>
    <text x="482" y="570" class="s b">表を引く</text>
    <path d="M540 496 V458" class="flow"/>
    <text x="526" y="482" text-anchor="end" class="s b teal">3件を返す</text>
  </g>
</svg>
