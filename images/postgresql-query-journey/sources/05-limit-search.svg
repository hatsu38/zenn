<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="885" viewBox="0 0 640 885" role="img" aria-labelledby="title description">
  

  <title id="title">LIMIT 1でも、探す量は変わる</title>
  <desc id="description">読み順を固定した模型 ／ SQLの行順を保証しない</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="885" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">LIMIT 1でも、探す量は変わる</text>
  <text x="28" y="82" class="muted" text-anchor="start">読み順を固定した模型 ／ SQLの行順を保証しない</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="230" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">① 早く見つかる</text>
    <rect x="47" y="193" width="96" height="60" rx="9" class="card"/>
    <text x="95.0" y="233.0" class="value" text-anchor="middle">本1</text>
    <rect x="159" y="193" width="96" height="60" rx="9" class="hot"/>
    <text x="207.0" y="233.0" class="value" text-anchor="middle">本2</text>
    <rect x="271" y="193" width="96" height="60" rx="9" class="card"/>
    <text x="319.0" y="233.0" class="value" text-anchor="middle">本3</text>
    <rect x="383" y="193" width="96" height="60" rx="9" class="card"/>
    <text x="431.0" y="233.0" class="value" text-anchor="middle">本4</text>
    <rect x="495" y="193" width="96" height="60" rx="9" class="card"/>
    <text x="543.0" y="233.0" class="value" text-anchor="middle">本5</text>
    <rect x="271" y="193" width="96" height="60" rx="9" class="ghost"/>
    <text x="319" y="232" class="small" text-anchor="middle">未読</text>
    <rect x="383" y="193" width="96" height="60" rx="9" class="ghost"/>
    <text x="431" y="232" class="small" text-anchor="middle">未読</text>
    <rect x="495" y="193" width="96" height="60" rx="9" class="ghost"/>
    <text x="543" y="232" class="small" text-anchor="middle">未読</text>
    <text x="45" y="308" class="bold" text-anchor="start">2枚目で一致 → ここで終了</text>
    <rect x="20" y="365" width="600" height="230" rx="18" class="panel"/>
    <text x="40" y="405" class="bold" text-anchor="start">② 後ろで見つかる</text>
    <rect x="47" y="448" width="96" height="60" rx="9" class="card"/>
    <text x="95.0" y="488.0" class="value" text-anchor="middle">本1</text>
    <rect x="159" y="448" width="96" height="60" rx="9" class="card"/>
    <text x="207.0" y="488.0" class="value" text-anchor="middle">本2</text>
    <rect x="271" y="448" width="96" height="60" rx="9" class="card"/>
    <text x="319.0" y="488.0" class="value" text-anchor="middle">本3</text>
    <rect x="383" y="448" width="96" height="60" rx="9" class="card"/>
    <text x="431.0" y="488.0" class="value" text-anchor="middle">本4</text>
    <rect x="495" y="448" width="96" height="60" rx="9" class="hot"/>
    <text x="543.0" y="488.0" class="value" text-anchor="middle">本5</text>
    <text x="45" y="563" class="bold" text-anchor="start">5枚目で一致 → 5枚を確認</text>
    <rect x="20" y="620" width="600" height="230" rx="18" class="panel"/>
    <text x="40" y="660" class="bold" text-anchor="start">③ 一致する本がない</text>
    <rect x="47" y="703" width="96" height="60" rx="9" class="card"/>
    <text x="95.0" y="743.0" class="value" text-anchor="middle">本1</text>
    <rect x="159" y="703" width="96" height="60" rx="9" class="card"/>
    <text x="207.0" y="743.0" class="value" text-anchor="middle">本2</text>
    <rect x="271" y="703" width="96" height="60" rx="9" class="card"/>
    <text x="319.0" y="743.0" class="value" text-anchor="middle">本3</text>
    <rect x="383" y="703" width="96" height="60" rx="9" class="card"/>
    <text x="431.0" y="743.0" class="value" text-anchor="middle">本4</text>
    <rect x="495" y="703" width="96" height="60" rx="9" class="card"/>
    <text x="543.0" y="743.0" class="value" text-anchor="middle">本5</text>
    <text x="45" y="818" class="bold" text-anchor="start">最後まで確認 → 0行を返す</text>
  </g>
</svg>
