<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img" aria-labelledby="title">
  <title id="title">メモリに収まらないときの並べ替え</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}.model{fill:#566c7b}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
.storage{fill:#ece7f5;stroke:#735f9f;stroke-width:2}.file{fill:#fff;stroke:#735f9f;stroke-width:2}
  .cmp{fill:#dfe5ea}
.swap{fill:#dcefe8;stroke:#243b50;stroke-width:4}
.big{font-size:56px;font-weight:700}
  </style>
  <rect width="640" height="690" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">メモリに収まらないときの並べ替え</text>
  <rect x="548" y="22" width="68" height="36" rx="18" class="model"/>
  <text x="582" y="47" text-anchor="middle" class="tag">模型</text>
  <g id="sort-runs">
    <rect x="24" y="76" width="280" height="120" rx="10" class="work"/>
    <text x="40" y="106" class="s b">作業用メモリ（2枚分）</text>
    <rect x="60" y="124" width="44" height="44" rx="6" class="val"/>
    <text x="82" y="155" text-anchor="middle" class="b">8</text>
    <rect x="116" y="124" width="44" height="44" rx="6" class="val"/>
    <text x="138" y="155" text-anchor="middle" class="b">3</text>
    <text x="340" y="106" class="m">次の入力</text>
    <rect x="340" y="124" width="44" height="44" rx="6" class="val"/>
    <text x="362" y="155" text-anchor="middle" class="b">6</text>
    <rect x="396" y="124" width="44" height="44" rx="6" class="val"/>
    <text x="418" y="155" text-anchor="middle" class="b">1</text>
  </g>
  <g id="temp-file">
    <rect x="24" y="280" width="592" height="152" rx="12" class="storage"/>
    <text x="600" y="308" text-anchor="end" class="s b">ストレージ（SSDなど）</text>
    <rect x="108" y="316" width="424" height="104" rx="10" class="hot"/>
    <rect x="116" y="324" width="408" height="88" rx="8" class="file"/>
    <text x="132" y="352" class="s b">一時ファイル</text>
    <text x="252" y="390" text-anchor="end" class="s">A</text>
    <rect x="260" y="362" width="40" height="36" rx="6" class="val"/>
    <text x="280" y="388" text-anchor="middle" class="b">8</text>
    <rect x="306" y="362" width="40" height="36" rx="6" class="val"/>
    <text x="326" y="388" text-anchor="middle" class="b">3</text>
    <text x="400" y="390" text-anchor="end" class="s">B</text>
    <rect x="408" y="362" width="40" height="36" rx="6" class="val"/>
    <text x="428" y="388" text-anchor="middle" class="b">6</text>
    <rect x="454" y="362" width="40" height="36" rx="6" class="val"/>
    <text x="474" y="388" text-anchor="middle" class="b">1</text>
  </g>
  <g id="merge">
    <rect x="24" y="500" width="280" height="166" rx="10" class="work"/>
    <text x="40" y="530" class="s b">作業用メモリ</text>
    <rect x="76" y="548" width="44" height="44" rx="6" class="val"/>
    <text x="98" y="579" text-anchor="middle" class="b">8</text>
    <rect x="176" y="548" width="44" height="44" rx="6" class="val"/>
    <text x="198" y="579" text-anchor="middle" class="b">6</text>
    <path d="M98 592 V604 H198 V592 M148 604 V614" class="leader"/>
    <rect x="106" y="614" width="84" height="30" rx="15" class="cmp"/>
    <text x="148" y="637" text-anchor="middle" class="s b">比べる</text>
    <rect x="344" y="520" width="272" height="124" rx="10" class="panel"/>
    <text x="360" y="550" class="s b">出力</text>
    <rect x="364" y="572" width="44" height="44" rx="6" class="val"/>
    <text x="386" y="603" text-anchor="middle" class="b">8</text>
    <rect x="428" y="572" width="44" height="44" rx="6" class="val"/>
    <text x="450" y="603" text-anchor="middle" class="b">6</text>
    <rect x="492" y="572" width="44" height="44" rx="6" class="val"/>
    <text x="514" y="603" text-anchor="middle" class="b">3</text>
    <rect x="556" y="572" width="44" height="44" rx="6" class="val"/>
    <text x="578" y="603" text-anchor="middle" class="b">1</text>
  </g>
  <g id="arrows">
    <path d="M164 196 V270" class="flow"/>
    <text x="178" y="242" class="s b teal">並べて書き出す</text>
    <path d="M164 422 V492" class="flow"/>
    <text x="178" y="466" class="s b teal">少しずつ読み戻す</text>
    <path d="M304 594 H338" class="flow"/>
    <text x="321" y="576" text-anchor="middle" class="s b teal">出す</text>
  </g>
</svg>
