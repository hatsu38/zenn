<svg xmlns="http://www.w3.org/2000/svg" width="640" height="632" viewBox="0 0 640 632" role="img" aria-labelledby="title">
  <title id="title">LIMITで減るのは、持つ量と返す行</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}.model{fill:#566c7b}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
  </style>
  <rect width="640" height="632" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">LIMITで減るのは、持つ量と返す行</text>
  <rect x="548" y="22" width="68" height="36" rx="18" class="real"/>
  <text x="582" y="47" text-anchor="middle" class="tag">実測</text>
  <g id="columns">
    <text x="24" y="104"><tspan class="mono b">ORDER BY</tspan><tspan class="s b">だけ</tspan></text>
    <text x="24" y="134" class="mono m">work_mem 64MB</text>
    <text x="336" y="104" class="mono b">ORDER BY … LIMIT 20</text>
    <text x="336" y="134" class="mono m">work_mem 4MB</text>
  </g>
  <g id="rules">
    <path d="M24 160 H616" class="panel"/>
    <path d="M24 268 H616" class="panel"/>
    <path d="M24 376 H616" class="panel"/>
    <path d="M24 524 H616" class="panel"/>
  </g>
  <g id="row-scan">
    <text x="24" y="194" class="s b">調べる</text>
    <text x="102" y="194" class="m">＝同じ</text>
    <rect x="24" y="208" width="280" height="36" rx="4" class="band"/>
    <text x="38" y="233" class="s b">2,000,000行</text>
    <rect x="336" y="208" width="280" height="36" rx="4" class="band"/>
    <text x="350" y="233" class="s b">2,000,000行</text>
  </g>
  <g id="row-sort-input">
    <text x="24" y="302" class="s b"><tspan class="mono">Sort</tspan>に入る</text>
    <text x="155" y="302" class="m">＝同じ</text>
    <rect x="24" y="316" width="70" height="36" rx="4" class="band"/>
    <text x="106" y="341" class="s b">499,998行</text>
    <rect x="336" y="316" width="70" height="36" rx="4" class="band"/>
    <text x="418" y="341" class="s b">499,998行</text>
  </g>
  <g id="row-memory">
    <text x="24" y="410" class="s b">持つ</text>
    <text x="24" y="440" class="mono">quicksort</text>
    <rect x="24" y="460" width="70" height="36" rx="4" class="band"/>
    <text x="106" y="485" class="s b">27,913kB</text>
    <text x="336" y="440" class="mono">top-N heapsort</text>
    <rect x="336" y="460" width="2" height="36" rx="1" class="band"/>
    <rect x="350" y="456" width="92" height="44" rx="6" class="hot"/>
    <text x="396" y="487" text-anchor="middle" class="b">26kB</text>
  </g>
  <g id="row-return">
    <text x="24" y="558" class="s b">返す</text>
    <rect x="24" y="572" width="70" height="36" rx="4" class="band"/>
    <text x="106" y="597" class="s b">499,998行</text>
    <rect x="336" y="572" width="2" height="36" rx="1" class="band"/>
    <text x="350" y="597" class="s b">20行</text>
  </g>
</svg>
