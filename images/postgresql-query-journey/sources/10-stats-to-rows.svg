<svg xmlns="http://www.w3.org/2000/svg" width="640" height="714" viewBox="0 0 640 714" role="img" aria-labelledby="title">
  <title id="title">割合のメモから、行数を見積もる</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}.model{fill:#566c7b}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
  </style>
  <rect width="640" height="714" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">割合のメモから、行数を見積もる</text>
  <rect x="548" y="22" width="68" height="36" rx="18" class="model"/>
  <text x="582" y="47" text-anchor="middle" class="tag">模型</text>
  <g id="table">
    <text x="24" y="102" class="s b">表 <tspan class="mono">stats_demo</tspan> の1万行</text>
    <rect x="24" y="116" width="527.4" height="48" rx="4" class="band"/>
    <rect x="557.4" y="116" width="58.6" height="48" rx="4" class="band"/>
    <text x="40" y="148" class="s b"><tspan class="mono">popular</tspan> 9,000行（90%）</text>
    <text x="616" y="192" text-anchor="end" class="s b"><tspan class="mono">rare</tspan> 1,000行（10%）</text>
    <path d="M586.7 164 V169" fill="none" stroke="#243b50" stroke-width="2"/>
  </g>
  <g id="stats">
    <rect x="24" y="264" width="592" height="124" rx="10" class="panel"/>
    <text x="44" y="298" class="s b"><tspan class="mono">pg_stats</tspan>（<tspan class="mono">ANALYZE</tspan> のメモ）</text>
    <text x="44" y="336" class="mono">most_common_vals</text>
    <text x="300" y="336" class="mono">{popular,rare}</text>
    <text x="44" y="370" class="mono">most_common_freqs</text>
    <text x="300" y="370" class="mono">{0.9,0.1}</text>
  </g>
  <g id="estimate">
    <rect x="24" y="456" width="592" height="110" rx="10" class="panel"/>
    <text x="164" y="494" text-anchor="end"><tspan class="mono">popular</tspan>：</text>
    <text x="164" y="494">10,000 × 0.9 ＝ 9,000</text>
    <rect x="72" y="510" width="392" height="44" rx="6" class="hot"/>
    <text x="164" y="540" text-anchor="end" class="b"><tspan class="mono">rare</tspan>：</text>
    <text x="164" y="540" class="b">10,000 × 0.1 ＝ 1,000</text>
  </g>
  <g id="plan">
    <rect x="24" y="634" width="592" height="56" rx="12" class="node"/>
    <text x="44" y="669" class="mono">WHERE category = 'rare'</text>
    <text x="596" y="669" text-anchor="end" class="mono b">rows=1000</text>
  </g>
  <g id="steps">
    <path d="M69 208 V236 H58 L80 252 L102 236 H91 V208 Z" class="step"/>
    <text x="118" y="237" class="s"><tspan class="mono">ANALYZE</tspan> が数える</text>
    <path d="M69 400 V428 H58 L80 444 L102 428 H91 V400 Z" class="step"/>
    <text x="118" y="429" class="s">プランナが表の行数を掛ける</text>
    <path d="M69 578 V606 H58 L80 622 L102 606 H91 V578 Z" class="step"/>
    <text x="118" y="607" class="s">計画に書く</text>
  </g>
</svg>
