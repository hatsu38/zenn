<svg xmlns="http://www.w3.org/2000/svg" width="640" height="830" viewBox="0 0 640 830" role="img" aria-labelledby="title">
  <title id="title">Bが確定しても、Aは版1を読む</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
.storage{fill:#ece7f5;stroke:#735f9f;stroke-width:2}.file{fill:#fff;stroke:#735f9f;stroke-width:2}
  .cmp{fill:#dfe5ea}
.swap{fill:#dcefe8;stroke:#243b50;stroke-width:4}
.big{font-size:56px;font-weight:700}
  </style>
  <rect width="640" height="830" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">Bが確定しても、Aは版1を読む</text>
  <g id="panel-1">
    <rect x="24" y="72" width="592" height="140" rx="14" class="panel"/>
    <text x="44" y="106" class="b">① Aが最初に読む（スナップショット）</text>
    <text x="286" y="136" class="m">版</text>
    <text x="372" y="136" text-anchor="middle" class="mono m">xmin</text>
    <text x="450" y="136" text-anchor="middle" class="mono m">xmax</text>
    <text x="500" y="136" class="m">題名</text>
    <rect x="272" y="148" width="328" height="36" rx="4" class="hot"/>
    <text x="286" y="173" class="s b">版1</text>
    <text x="372" y="173" text-anchor="middle" class="mono">948</text>
    <text x="450" y="173" text-anchor="middle" class="mono">0</text>
    <text x="500" y="173" class="s b">元の題名</text>
    <rect x="36" y="126" width="226" height="74" rx="8" fill="#fff" stroke="#243b50" stroke-width="2.5"/>
    <rect x="36" y="126" width="226" height="36" rx="8" fill="#243b50"/>
    <rect x="36" y="150" width="226" height="12" fill="#243b50"/>
    <text x="149" y="152" text-anchor="middle" class="tag">Aのスナップショット</text>
    <text x="149" y="189" text-anchor="middle" class="s b"><tspan class="mono b">998</tspan>まで確定済み</text>
  </g>
  <g id="panel-2">
    <rect x="24" y="222" width="592" height="160" rx="14" class="panel"/>
    <text x="44" y="256" class="b">② BがUPDATEしてCOMMIT</text>
    <text x="286" y="286" class="m">版</text>
    <text x="372" y="286" text-anchor="middle" class="mono m">xmin</text>
    <text x="450" y="286" text-anchor="middle" class="mono m">xmax</text>
    <text x="500" y="286" class="m">題名</text>
    <rect x="272" y="296" width="328" height="36" rx="4" class="row"/>
    <text x="286" y="321" class="s b">版1</text>
    <text x="372" y="321" text-anchor="middle" class="mono">948</text>
    <text x="450" y="321" text-anchor="middle" class="mono b">999</text>
    <text x="500" y="321" class="s">元の題名</text>
    <rect x="272" y="340" width="328" height="36" rx="4" class="hot"/>
    <text x="286" y="365" class="s b">版2</text>
    <text x="372" y="365" text-anchor="middle" class="mono b">999</text>
    <text x="450" y="365" text-anchor="middle" class="mono">0</text>
    <text x="500" y="365" class="s b">改訂版</text>
    <circle cx="62" cy="306" r="18" fill="#243b50"/>
    <text x="62" y="314" text-anchor="middle" class="tag">B</text>
    <text x="92" y="314" class="s">番号<tspan class="mono b">999</tspan></text>
    <text x="92" y="348" class="s teal">版2を作る</text>
    <path d="M84 360 L268 360" class="flow"/>
  </g>
  <g id="panel-3">
    <rect x="24" y="392" width="592" height="204" rx="14" class="panel"/>
    <text x="44" y="426" class="b">③ Aがもう一度読む（番号を比べる）</text>
    <text x="286" y="456" class="m">版</text>
    <text x="372" y="456" text-anchor="middle" class="mono m">xmin</text>
    <text x="450" y="456" text-anchor="middle" class="mono m">xmax</text>
    <text x="500" y="456" class="m">結果</text>
    <rect x="272" y="466" width="328" height="56" rx="4" class="hot"/>
    <text x="286" y="502" class="s b">版1</text>
    <text x="372" y="490" text-anchor="middle" class="mono">948</text>
    <text x="450" y="490" text-anchor="middle" class="mono">999</text>
    <text x="372" y="515" text-anchor="middle" class="s teal">確定</text>
    <text x="450" y="515" text-anchor="middle" class="s brown">未確定</text>
    <text x="500" y="502" class="s b teal">見せる</text>
    <rect x="272" y="528" width="328" height="56" rx="4" class="ghost"/>
    <text x="286" y="564" class="s b m">版2</text>
    <text x="372" y="552" text-anchor="middle" class="mono">999</text>
    <text x="450" y="552" text-anchor="middle" class="mono m">0</text>
    <text x="372" y="577" text-anchor="middle" class="s brown">未確定</text>
    <text x="500" y="564" class="s b m">見せない</text>
    <rect x="36" y="490" width="226" height="74" rx="8" fill="#fff" stroke="#243b50" stroke-width="2.5"/>
    <rect x="36" y="490" width="226" height="36" rx="8" fill="#243b50"/>
    <rect x="36" y="514" width="226" height="12" fill="#243b50"/>
    <text x="149" y="516" text-anchor="middle" class="tag">Aのスナップショット</text>
    <text x="149" y="553" text-anchor="middle" class="s b"><tspan class="mono b">998</tspan>まで確定済み</text>
  </g>
  <g id="panel-4">
    <rect x="24" y="606" width="592" height="204" rx="14" class="panel"/>
    <text x="44" y="640" class="b">④ AがCOMMITして、新しく読む</text>
    <text x="286" y="670" class="m">版</text>
    <text x="372" y="670" text-anchor="middle" class="mono m">xmin</text>
    <text x="450" y="670" text-anchor="middle" class="mono m">xmax</text>
    <text x="500" y="670" class="m">結果</text>
    <rect x="272" y="680" width="328" height="56" rx="4" class="ghost"/>
    <text x="286" y="716" class="s b m">版1</text>
    <text x="372" y="704" text-anchor="middle" class="mono">948</text>
    <text x="450" y="704" text-anchor="middle" class="mono">999</text>
    <text x="372" y="729" text-anchor="middle" class="s teal">確定</text>
    <text x="450" y="729" text-anchor="middle" class="s teal">確定</text>
    <text x="500" y="716" class="s b m">見せない</text>
    <rect x="272" y="742" width="328" height="56" rx="4" class="hot"/>
    <text x="286" y="778" class="s b">版2</text>
    <text x="372" y="766" text-anchor="middle" class="mono">999</text>
    <text x="450" y="766" text-anchor="middle" class="mono m">0</text>
    <text x="372" y="791" text-anchor="middle" class="s teal">確定</text>
    <text x="500" y="778" class="s b teal">見せる</text>
    <rect x="36" y="704" width="226" height="74" rx="8" fill="#fff" stroke="#243b50" stroke-width="2.5"/>
    <rect x="36" y="704" width="226" height="36" rx="8" fill="#243b50"/>
    <rect x="36" y="728" width="226" height="12" fill="#243b50"/>
    <text x="149" y="730" text-anchor="middle" class="tag">Aのスナップショット</text>
    <text x="149" y="767" text-anchor="middle" class="s b"><tspan class="mono b">999</tspan>まで確定済み</text>
  </g>
</svg>
