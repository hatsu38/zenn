<svg xmlns="http://www.w3.org/2000/svg" width="640" height="782" viewBox="0 0 640 782" role="img" aria-labelledby="title">
  <title id="title">Bが確定しても、Aは版1を読む</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
  </style>
  <rect width="640" height="782" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">Bが確定しても、Aは版1を読む</text>
  <g id="panel-1">
    <rect x="24" y="76" width="592" height="218" rx="14" class="panel"/>
    <text x="44" y="114" class="b">① Aが読む（Repeatable Read）</text>
    <rect x="306" y="132" width="294" height="146" rx="10" class="page"/>
    <text x="348" y="160" class="s b">本42を含むページ</text>
    <rect x="348" y="176" width="236" height="36" rx="4" class="row"/>
    <text x="362" y="201" class="s">版1　実験用の本 42</text>
    <circle cx="62" cy="194" r="18" fill="#243b50"/>
    <text x="62" y="202" text-anchor="middle" class="tag">A</text>
    <text x="100" y="182" class="s">見る</text>
    <path d="M88 194 L346 194" class="ref"/>
  </g>
  <g id="panel-2">
    <rect x="24" y="308" width="592" height="218" rx="14" class="panel"/>
    <text x="44" y="346" class="b">② BがUPDATEしてCOMMIT</text>
    <text x="76" y="378" class="b">Aがもう一度読む</text>
    <rect x="306" y="364" width="294" height="146" rx="10" class="page"/>
    <text x="348" y="392" class="s b">本42を含むページ</text>
    <rect x="348" y="408" width="236" height="36" rx="4" class="hot"/>
    <text x="362" y="433" class="s b">版1　実験用の本 42</text>
    <rect x="348" y="458" width="236" height="36" rx="4" class="row"/>
    <text x="362" y="483" class="s">版2　改訂版の本 42</text>
    <circle cx="62" cy="426" r="18" fill="#243b50"/>
    <text x="62" y="434" text-anchor="middle" class="tag">A</text>
    <text x="100" y="414" class="s">見る</text>
    <circle cx="62" cy="476" r="18" fill="#243b50"/>
    <text x="62" y="484" text-anchor="middle" class="tag">B</text>
    <text x="100" y="464" class="s teal">新しい版を作る</text>
    <path d="M88 426 L346 426" class="ref"/>
    <path d="M88 476 L345 476" class="flow"/>
  </g>
  <g id="panel-3">
    <rect x="24" y="540" width="592" height="218" rx="14" class="panel"/>
    <text x="44" y="578" class="b">③ AがCOMMITして、新しく読む</text>
    <rect x="306" y="596" width="294" height="146" rx="10" class="page"/>
    <text x="348" y="624" class="s b">本42を含むページ</text>
    <rect x="348" y="640" width="236" height="36" rx="4" class="row"/>
    <text x="362" y="665" class="s">版1　実験用の本 42</text>
    <rect x="348" y="690" width="236" height="36" rx="4" class="row"/>
    <text x="362" y="715" class="s">版2　改訂版の本 42</text>
    <circle cx="62" cy="658" r="18" fill="#243b50"/>
    <text x="62" y="666" text-anchor="middle" class="tag">A</text>
    <text x="100" y="646" class="s">見る</text>
    <path d="M88 658 L346 708" class="ref"/>
  </g>
</svg>
