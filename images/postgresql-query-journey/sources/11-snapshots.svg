<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="985" viewBox="0 0 640 985" role="img" aria-labelledby="title description">
  

  <title id="title">読む時点によって、見える版が変わる</title>
  <desc id="description">本文の実験順序 ／ Repeatable Readを明示して実行</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="985" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">読む時点によって、見える版が変わる</text>
  <text x="28" y="82" class="muted" text-anchor="start">本文の実験順序 ／ Repeatable Readを明示して実行</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="265" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">① Aが検索し、読む時点を固定</text>
    <text x="44" y="196" class="small" text-anchor="start">A：Repeatable Readのトランザクション</text>
    <rect x="44" y="228" width="260" height="54" rx="12" class="box"/>
    <text x="174.0" y="263" class="" text-anchor="middle">Aから見える版</text>
    <rect x="360" y="228" width="236" height="54" rx="12" class="card"/>
    <text x="478.0" y="263" class="" text-anchor="middle">元の題名</text>
    <path d="M312 255 L350 255" class="arrow"/>
    <text x="44" y="342" class="small" text-anchor="start">idは同じ42。見える行バージョンが違う。</text>
    <rect x="20" y="395" width="600" height="265" rx="18" class="panel"/>
    <text x="40" y="435" class="bold" text-anchor="start">② Bが更新してCOMMIT</text>
    <text x="44" y="481" class="small" text-anchor="start">A：同じトランザクションで再検索</text>
    <rect x="44" y="513" width="260" height="54" rx="12" class="box"/>
    <text x="174.0" y="548" class="" text-anchor="middle">Aから見える版</text>
    <rect x="360" y="513" width="236" height="54" rx="12" class="card"/>
    <text x="478.0" y="548" class="" text-anchor="middle">元の題名</text>
    <path d="M312 540 L350 540" class="arrow"/>
    <text x="44" y="627" class="small" text-anchor="start">idは同じ42。見える行バージョンが違う。</text>
    <rect x="20" y="680" width="600" height="265" rx="18" class="panel"/>
    <text x="40" y="720" class="bold" text-anchor="start">③ AがCOMMIT後、改めて検索</text>
    <text x="44" y="766" class="small" text-anchor="start">A：新しい検索で見る状態が変わる</text>
    <rect x="44" y="798" width="260" height="54" rx="12" class="box"/>
    <text x="174.0" y="833" class="" text-anchor="middle">Aから見える版</text>
    <rect x="360" y="798" width="236" height="54" rx="12" class="hot"/>
    <text x="478.0" y="833" class="" text-anchor="middle">改訂版</text>
    <path d="M312 825 L350 825" class="arrow"/>
    <text x="44" y="912" class="small" text-anchor="start">idは同じ42。見える行バージョンが違う。</text>
  </g>
</svg>
