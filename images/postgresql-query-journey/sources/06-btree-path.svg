<svg xmlns="http://www.w3.org/2000/svg" width="640" height="590" viewBox="0 0 640 590" role="img" aria-labelledby="title">
  <title id="title">境目を見て、開く箱を選ぶ</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
  </style>
  <rect width="640" height="590" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">境目を見て、開く箱を選ぶ</text>
  <g id="signboard">
    <rect x="230" y="80" width="180" height="88" rx="10" class="route"/>
    <text x="320" y="114" text-anchor="middle" class="b">案内板</text>
    <text x="320" y="150" text-anchor="middle">境目　4｜7</text>
  </g>
  <g id="box-left">
    <rect x="24" y="320" width="168" height="178" rx="10" class="ghost"/>
    <text x="108" y="354" text-anchor="middle" class="m">4未満</text>
    <rect x="38" y="370" width="44" height="34" rx="4" fill="#fff" stroke="#b5c2cc" stroke-width="2"/>
    <text x="60" y="395" text-anchor="middle" class="m">1</text>
    <text x="92" y="395" class="m">▸ 場所</text>
    <rect x="38" y="410" width="44" height="34" rx="4" fill="#fff" stroke="#b5c2cc" stroke-width="2"/>
    <text x="60" y="435" text-anchor="middle" class="m">2</text>
    <text x="92" y="435" class="m">▸ 場所</text>
    <rect x="38" y="450" width="44" height="34" rx="4" fill="#fff" stroke="#b5c2cc" stroke-width="2"/>
    <text x="60" y="475" text-anchor="middle" class="m">3</text>
    <text x="92" y="475" class="m">▸ 場所</text>
    <path d="M183 311 L201 329 M201 311 L183 329" fill="none" stroke="#7d93a3" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g id="box-middle">
    <rect x="236" y="320" width="168" height="178" rx="10" class="ghost"/>
    <text x="320" y="354" text-anchor="middle" class="m">4以上7未満</text>
    <rect x="250" y="370" width="44" height="34" rx="4" fill="#fff" stroke="#b5c2cc" stroke-width="2"/>
    <text x="272" y="395" text-anchor="middle" class="m">4</text>
    <text x="304" y="395" class="m">▸ 場所</text>
    <rect x="250" y="410" width="44" height="34" rx="4" fill="#fff" stroke="#b5c2cc" stroke-width="2"/>
    <text x="272" y="435" text-anchor="middle" class="m">5</text>
    <text x="304" y="435" class="m">▸ 場所</text>
    <rect x="250" y="450" width="44" height="34" rx="4" fill="#fff" stroke="#b5c2cc" stroke-width="2"/>
    <text x="272" y="475" text-anchor="middle" class="m">6</text>
    <text x="304" y="475" class="m">▸ 場所</text>
    <path d="M395 311 L413 329 M413 311 L395 329" fill="none" stroke="#7d93a3" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g id="box-right">
    <rect x="448" y="320" width="168" height="178" rx="10" class="route"/>
    <text x="532" y="354" text-anchor="middle" class="s">7以上</text>
    <rect x="462" y="370" width="44" height="34" rx="4" class="row"/>
    <text x="484" y="395" text-anchor="middle" class="s">7</text>
    <text x="516" y="395" class="s">▸ 場所</text>
    <rect x="462" y="410" width="44" height="34" rx="4" class="hot"/>
    <text x="484" y="435" text-anchor="middle" class="s b">8</text>
    <text x="516" y="435" class="s b">▸ 場所</text>
    <rect x="462" y="450" width="44" height="34" rx="4" class="row"/>
    <text x="484" y="475" text-anchor="middle" class="s">9</text>
    <text x="516" y="475" class="s">▸ 場所</text>
  </g>
  <g id="branches">
    <path d="M280 169.5 L108 320" fill="none" stroke="#b5c2cc" stroke-width="2"/>
    <path d="M320 169.5 V320" fill="none" stroke="#b5c2cc" stroke-width="2"/>
  </g>
  <g id="search">
    <path d="M360 169.5 L529 316" class="ref"/>
  </g>
  <g id="labels">
    <text x="616" y="206" text-anchor="end" class="s">① 7以上なので右へ</text>
    <text x="108" y="530" text-anchor="middle" class="m">開かない</text>
    <text x="320" y="530" text-anchor="middle" class="m">開かない</text>
    <text x="532" y="530" text-anchor="middle" class="s b">② 箱の中で</text>
    <text x="532" y="560" text-anchor="middle" class="s b">8を見つける</text>
  </g>
</svg>
