<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="722" viewBox="0 0 640 722" role="img" aria-labelledby="title desc">
  

  <title id="title">8を探す：範囲を選んでから、値を探す</title>
  <desc id="desc">番号1〜9で説明する図 ／ 矢印は探索で進む向き</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#99631b"/>
    </marker>
  </defs>
  

  <style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:28px;font-weight:700} .bold{font-weight:700} .small{font-size:21px} .value{font-size:30px;font-weight:700} .muted{font-size:21px;fill:#566c7b} .teal{fill:#176e65;font-weight:700} .panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .row{fill:#dcefe8;stroke:#448b7c;stroke-width:1.5} .edge{fill:none;stroke:#9cabb5;stroke-width:2} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)} .request{fill:none;stroke:#99631b;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#b)}</style>
  

  <rect width="640" height="722" fill="#f5f7f9"/>
  <text x="28" y="46" class="title">8を探す：範囲を選んでから、値を探す</text>
  <text x="28" y="83" class="muted">番号1〜9で説明する図 ／ 矢印は探索で進む向き</text>
  <rect x="20" y="112" width="600" height="210" rx="12" class="panel"/>
  <text x="40" y="150" class="bold">① 8が入る箱を選ぶ</text>
  <rect x="75" y="174" width="490" height="115" rx="12" class="box"/>
  <text x="100" y="213" class="bold">案内板：境目は 4 と 7</text>
  <text x="100" y="253" class="">8は「7以上」 → 右の箱へ</text>
  <path d="M320 290 L115 390" class="edge"/>
  <rect x="30" y="396" width="170" height="110" rx="12" class="box"/>
  <text x="45" y="428" class="small">4未満</text>
  <text x="49" y="477" class="value">1   2   3</text>
  <path d="M320 290 L320 390" class="edge"/>
  <rect x="235" y="396" width="170" height="110" rx="12" class="box"/>
  <text x="250" y="428" class="small">4以上7未満</text>
  <text x="254" y="477" class="value">4   5   6</text>
  <path d="M320 290 L525 390" class="arrow"/>
  <rect x="440" y="396" width="170" height="110" rx="12" class="hot"/>
  <text x="455" y="428" class="small">7以上</text>
  <text x="459" y="477" class="value">7   8   9</text>
  <rect x="20" y="542" width="600" height="150" rx="12" class="panel"/>
  <text x="40" y="581" class="bold">② 選んだ箱の中で8を見つける</text>
  <text x="40" y="624" class="">左と真ん中の箱は、開かなくてよい。</text>
  <text x="40" y="659" class="small">実際には、表の行の場所も入る。</text>
</svg>
