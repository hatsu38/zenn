<svg xmlns="http://www.w3.org/2000/svg" width="640" height="528" viewBox="0 0 640 528" role="img" aria-labelledby="title">
  <title id="title">ページの中の並び</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
  </style>
  <rect width="640" height="528" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">ページの中の並び</text>
  <g id="page">
    <rect x="24" y="76" width="592" height="428" rx="12" class="page"/>
    <text x="44" y="108" class="s b">ページ0</text>
    <rect x="44" y="120" width="552" height="42" rx="4" class="band"/>
    <text x="320" y="149" text-anchor="middle" class="s">ページの管理情報</text>
  </g>
  <g id="free">
    <path d="M296 206 H596 V396 H44 V252 H296 Z" class="ghost"/>
    <text x="470" y="318" text-anchor="middle" class="m">空き領域</text>
  </g>
  <g id="items">
    <text x="44" y="196" class="s b">前から並ぶ項目</text>
    <rect x="44" y="208" width="40" height="36" rx="4" class="panel"/>
    <text x="64" y="234" text-anchor="middle" class="s">1</text>
    <rect x="92" y="208" width="40" height="36" rx="4" class="panel"/>
    <text x="112" y="234" text-anchor="middle" class="s">2</text>
    <rect x="140" y="208" width="40" height="36" rx="4" class="panel"/>
    <text x="160" y="234" text-anchor="middle" class="s">3</text>
    <rect x="224" y="208" width="56" height="36" rx="4" class="panel"/>
    <text x="252" y="234" text-anchor="middle" class="s">136</text>
    <text x="202" y="234" text-anchor="middle" class="s b">…</text>
  </g>
  <g id="records">
    <rect x="496" y="406" width="100" height="36" rx="4" class="row"/>
    <text x="546" y="431" text-anchor="middle" class="s">本1</text>
    <rect x="384" y="406" width="100" height="36" rx="4" class="row"/>
    <text x="434" y="431" text-anchor="middle" class="s">本2</text>
    <rect x="272" y="406" width="100" height="36" rx="4" class="row"/>
    <text x="322" y="431" text-anchor="middle" class="s">本3</text>
    <rect x="44" y="406" width="116" height="36" rx="4" class="row"/>
    <text x="102" y="431" text-anchor="middle" class="s">本136</text>
    <text x="216" y="431" text-anchor="middle" class="s b">…</text>
    <text x="596" y="478" text-anchor="end" class="s b">後ろから並ぶレコード</text>
  </g>
  <g id="pointers">
    <path d="M64 246 L546 402" class="ref"/>
    <path d="M112 246 L434 402" class="ref"/>
    <path d="M160 246 L322 402" class="ref"/>
    <path d="M252 246 L102 402" class="ref"/>
  </g>
</svg>
