<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" role="img"><title>本の一覧は、どこに保存される？</title><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif}</style><rect width="640" height="530" fill="#fffdf7"/><g id="chapter-scene"><text x="28" y="43" font-size="27" fill="#25374b">本の一覧は、どこに保存される？</text><text x="28" y="79" font-size="18" fill="#25374b">画面の1行と、保存先の単位を考える。</text><rect x="37" y="131" width="240" height="190" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><path d="M37 166 H277" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="51" y="156" font-size="17" fill="#25374b">books</text><path d="M157.0 321 v18 m-38 0 h76" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="58" y="184" width="196" height="36" rx="5" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="70" y="209" font-size="18" fill="#25374b">1　星の図鑑</text><rect x="58" y="227" width="196" height="36" rx="5" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="70" y="252" font-size="18" fill="#25374b">2　海の図鑑</text><text x="303" y="239" font-size="49" fill="#25374b">？</text><rect x="406" y="128" width="177" height="215" rx="10" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><rect x="429" y="160" width="133" height="43" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><rect x="429" y="220" width="133" height="43" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><text x="442" y="190" font-size="19" fill="#25374b">ファイル</text><text x="441" y="250" font-size="19" fill="#25374b">ページ？</text><text x="428" y="310" font-size="16" fill="#25374b">保存先を調べる</text><rect x="24" y="420" width="592" height="70" rx="10" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="43" y="463" font-size="21" fill="#25374b">本1冊につき、ファイルが1個ある？</text><text x="28" y="515" font-size="14" fill="#25374b">学ぶきっかけを描く絵 ／ 実行結果や内部配置の実測ではありません</text></g></svg>