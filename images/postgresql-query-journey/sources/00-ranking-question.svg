<svg xmlns="http://www.w3.org/2000/svg" width="640" height="807" viewBox="0 0 640 807" role="img" aria-labelledby="title">
  <title id="title">200万件から、20行を返す</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}.model{fill:#566c7b}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
  </style>
  <rect width="640" height="807" fill="#fffdf7"/>
  <text x="24" y="48" class="h">200万件から、20行を返す</text>
  <g id="inputs">
    <rect x="24" y="72" width="280" height="80" rx="10" class="panel"/>
    <text x="44" y="104" class="s b">読了記録　200万件</text>
    <text x="44" y="136" class="mono">reading_records</text>
    <rect x="336" y="72" width="280" height="80" rx="10" class="panel"/>
    <text x="356" y="104" class="s b">本　100万冊</text>
    <text x="356" y="136" class="mono">books</text>
  </g>
  <g id="sql">
    <rect x="24" y="180" width="592" height="430" rx="12" fill="none" stroke="#243b50" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="136" y="212" class="m">SQLの中（結果からは見えない）</text>
    <rect x="44" y="228" width="426" height="44" rx="8" class="panel"/>
    <text x="60" y="258" class="mono b">WHERE</text>
    <text x="300" y="258" class="s">対象の週に絞る</text>
    <rect x="44" y="336" width="426" height="44" rx="8" class="panel"/>
    <text x="60" y="366" class="mono b">JOIN</text>
    <text x="300" y="366" class="s">題名を付ける</text>
    <rect x="44" y="444" width="426" height="44" rx="8" class="panel"/>
    <text x="60" y="474" class="mono b">GROUP BY</text>
    <text x="300" y="474" class="s">本ごとに数える</text>
    <rect x="44" y="552" width="426" height="44" rx="8" class="panel"/>
    <text x="60" y="582" class="mono b">ORDER BY / LIMIT</text>
    <text x="300" y="582" class="s">多い順に20冊</text>
  </g>
  <g id="counts">
    <rect x="137" y="284" width="76" height="40" rx="6" class="hot"/>
    <text x="151" y="312" class="b">？行</text>
    <text x="151" y="421" class="b">？行</text>
    <text x="151" y="529" class="b">？冊</text>
  </g>
  <g id="result">
    <rect x="24" y="655" width="280" height="52" rx="10" class="panel"/>
    <text x="44" y="689" class="s b">結果　20行</text>
  </g>
  <g id="flows">
    <path d="M92 152 V218" class="flow"/>
    <path d="M560 152 V346 Q560 358 548 358 H480" class="flow"/>
    <path d="M92 272 V326" class="flow"/>
    <path d="M92 380 V434" class="flow"/>
    <path d="M92 488 V542" class="flow"/>
    <path d="M92 596 V645" class="flow"/>
  </g>
  <rect x="24" y="727" width="592" height="60" rx="10" fill="#fff0d3" stroke="#243b50" stroke-width="2.5"/>
  <text x="44" y="766" class="b">途中で、何行を扱っている？</text>
</svg>
