<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" role="img" aria-labelledby="title">
  <title id="title">Limitは3行で要求を止める</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
.storage{fill:#ece7f5;stroke:#735f9f;stroke-width:2}.file{fill:#fff;stroke:#735f9f;stroke-width:2}
  .cmp{fill:#dfe5ea}
.swap{fill:#dcefe8;stroke:#243b50;stroke-width:4}
.big{font-size:56px;font-weight:700}
  </style>
  <rect width="640" height="580" fill="#f5f7f9"/>
  <text x="24" y="48" class="h"><tspan font-family="ui-monospace,Menlo,monospace">Limit</tspan>は3行で要求を止める</text>
  <g id="limit">
    <rect x="24" y="80" width="592" height="48" rx="12" class="node"/>
    <text x="44" y="112" class="mono b">Limit</text>
    <text x="136" y="112" class="mono">rows=3</text>
  </g>
  <g id="index-scan">
    <rect x="24" y="352" width="592" height="80" rx="12" class="node"/>
    <text x="44" y="384" class="mono b">Index Scan using books_title_idx on books</text>
    <text x="44" y="416" class="mono">rows=1000000</text>
  </g>
  <g id="index-entries">
    <rect x="24" y="452" width="592" height="104" rx="10" class="ipage"/>
    <text x="44" y="484" class="s b">Indexの項目（題名の順）</text>
    <rect x="44" y="500" width="40" height="36" rx="4" class="row"/>
    <text x="64" y="525" text-anchor="middle" class="s">①</text>
    <rect x="92" y="500" width="40" height="36" rx="4" class="row"/>
    <text x="112" y="525" text-anchor="middle" class="s">②</text>
    <rect x="140" y="500" width="40" height="36" rx="4" class="row"/>
    <text x="160" y="525" text-anchor="middle" class="s">③</text>
    <rect x="196" y="500" width="408" height="36" rx="4" class="ghost"/>
    <text x="212" y="525" class="m">…</text>
    <text x="248" y="525" class="m">4件目から先は要求されない</text>
  </g>
  <g id="returned-rows">
    <path d="M132 352 V138" class="flow"/>
    <path d="M176 352 V138" class="flow"/>
    <path d="M220 352 V138" class="flow"/>
    <text x="24" y="334" class="s b teal">行を返す</text>
    <text x="138" y="334" class="s b teal">①</text>
    <text x="182" y="334" class="s b teal">②</text>
    <text x="226" y="334" class="s b teal">③</text>
  </g>
  <g id="requests">
    <path d="M293 132 V342" class="req"/>
    <path d="M337 132 V342" class="req"/>
    <path d="M381 132 V342" class="req"/>
    <text x="299" y="166" class="s brown">①</text>
    <text x="343" y="166" class="s brown">②</text>
    <text x="387" y="166" class="s brown">③</text>
    <text x="429" y="166" class="s brown">次の行を要求</text>
  </g>
  <g id="fourth-request">
    <rect x="420" y="196" width="196" height="126" rx="8" class="hot"/>
    <text x="494" y="250" class="s b brown">4回目は</text>
    <text x="494" y="282" class="s b brown">要求しない</text>
    <path d="M448 206 V302" class="req"/>
    <text x="448" y="246" text-anchor="middle" class="h">×</text>
  </g>
</svg>
