<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="858" viewBox="0 0 640 858" role="img" aria-labelledby="title desc">
  

  <title id="title">Index Scanから、Limitへ行が渡る</title>
  <desc id="desc">ORDER BY title LIMIT 3 の計画の模型</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#99631b"/>
    </marker>
  </defs>
  

  <style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:28px;font-weight:700} .bold{font-weight:700} .small{font-size:21px} .value{font-size:30px;font-weight:700} .muted{font-size:21px;fill:#566c7b} .teal{fill:#176e65;font-weight:700} .panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .row{fill:#dcefe8;stroke:#448b7c;stroke-width:1.5} .edge{fill:none;stroke:#9cabb5;stroke-width:2} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)} .request{fill:none;stroke:#99631b;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#b)}</style>
  

  <rect width="640" height="858" fill="#f5f7f9"/>
  <text x="28" y="46" class="title">Index Scanから、Limitへ行が渡る</text>
  <text x="28" y="83" class="muted">ORDER BY title LIMIT 3 の計画の模型</text>
  <rect x="120" y="125" width="400" height="85" rx="12" class="hot"/>
  <text x="146" y="160" class="bold">psqlへ結果を返す</text>
  <text x="146" y="191" class="small">最大3行</text>
  <path d="M200 280 L200 219" class="arrow"/>
  <text x="225" y="253" class="small">行を返す</text>
  <rect x="120" y="289" width="400" height="112" rx="12" class="panel"/>
  <text x="145" y="330" class="value">Limit</text>
  <text x="145" y="375" class="small">3行受け取ったら要求を止める</text>
  <path d="M195 515 L195 414" class="arrow"/>
  <text x="40" y="452" class="small">1行ずつ</text>
  <text x="40" y="482" class="small">返す</text>
  <path d="M460 414 L460 515" class="request"/>
  <text x="476" y="452" class="small">次の行を</text>
  <text x="476" y="482" class="small">要求</text>
  <rect x="120" y="530" width="400" height="148" rx="12" class="memory"/>
  <text x="145" y="570" class="value">Index Scan</text>
  <text x="145" y="611" class="small">題名のIndex順にたどり、</text>
  <text x="145" y="642" class="small">表から id と title を取り出す</text>
  <rect x="25" y="720" width="590" height="109" rx="12" class="panel"/>
  <text x="45" y="761" class="small">実線：行を返す向き ↑</text>
  <text x="45" y="798" class="small">破線：次の行を要求する向き ↓</text>
</svg>
