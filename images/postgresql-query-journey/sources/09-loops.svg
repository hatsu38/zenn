<svg xmlns="http://www.w3.org/2000/svg" width="640" height="592" viewBox="0 0 640 592" role="img" aria-labelledby="title">
  <title id="title">1回1件を20回で、20件</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
  </style>
  <rect width="640" height="592" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">1回1件を20回で、20件</text>
  <rect x="548" y="22" width="68" height="36" rx="18" class="real"/>
  <text x="582" y="47" text-anchor="middle" class="tag">実測</text>
  <g id="nested-loop">
    <rect x="80" y="76" width="380" height="80" rx="12" class="node"/>
    <text x="100" y="108" class="mono b">Nested Loop</text>
    <text x="100" y="140" class="mono">rows=20.00</text>
  </g>
  <g id="limit">
    <rect x="24" y="228" width="176" height="80" rx="12" class="node"/>
    <text x="44" y="260" class="mono b">Limit</text>
    <text x="44" y="292" class="mono">rows=20.00</text>
  </g>
  <g id="index-scan">
    <rect x="222" y="228" width="394" height="48" rx="12" class="node"/>
    <text x="242" y="260" class="mono b">Index Scan using books_pkey</text>
  </g>
  <g id="values">
    <rect x="24" y="324" width="592" height="244" rx="12" class="panel"/>
    <path d="M560 276 V324" class="leader"/>
  </g>
  <g id="rows-and-loops">
    <text x="44" y="364" class="mono">rows=1.00</text>
    <text x="179" y="364" class="s b">1回当たり</text>
    <text x="44" y="408" class="mono">loops=20</text>
    <path d="M296 346 Q306 346 306 356 V368 Q306 378 316 378 Q306 378 306 388 V402 Q306 412 296 412" fill="none" stroke="#243b50" stroke-width="2"/>
  </g>
  <g id="focus">
    <rect x="330" y="354" width="260" height="48" rx="8" class="hot"/>
    <text x="460" y="387" text-anchor="middle" class="b">1.00 × 20 ＝ 20件</text>
  </g>
  <g id="time-and-buffers">
    <text x="44" y="452" class="mono">actual time=0.150..0.150</text>
    <text x="378" y="452" class="s b">1回当たり</text>
    <text x="44" y="496" class="mono">Buffers: shared hit=46 read=34</text>
    <path d="M256 505 Q256 513 266 513 H339 Q349 513 349 521 Q349 513 359 513 H431 Q441 513 441 505" fill="none" stroke="#243b50" stroke-width="2"/>
    <text x="349" y="548" text-anchor="middle" class="s b">20回分の合計（46＋34＝80）</text>
  </g>
  <g id="flows">
    <path d="M112 228 V166" class="flow"/>
    <path d="M419 228 V166" class="flow"/>
    <text x="394" y="206" text-anchor="end" class="s b teal">レコードを渡す</text>
  </g>
</svg>
