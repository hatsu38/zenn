<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="830" viewBox="0 0 640 830" role="img" aria-labelledby="title desc">
  

  <title id="title">索引をたどって、表の行へ届く</title>
  <desc id="desc">索引3段の模型 ／ 矢印は参照する順番</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#99631b"/>
    </marker>
  </defs>
  

  <style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:28px;font-weight:700} .bold{font-weight:700} .small{font-size:21px} .value{font-size:30px;font-weight:700} .muted{font-size:21px;fill:#566c7b} .teal{fill:#176e65;font-weight:700} .panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .row{fill:#dcefe8;stroke:#448b7c;stroke-width:1.5} .edge{fill:none;stroke:#9cabb5;stroke-width:2} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)} .request{fill:none;stroke:#99631b;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#b)}</style>
  

  <rect width="640" height="830" fill="#f5f7f9"/>
  <text x="28" y="46" class="title">索引をたどって、表の行へ届く</text>
  <text x="28" y="83" class="muted">索引3段の模型 ／ 矢印は参照する順番</text>
  <rect x="30" y="110" width="580" height="450" rx="12" class="memory"/>
  <text x="50" y="148" class="bold">題名の索引：3段の経路</text>
  <rect x="60" y="171" width="520" height="105" rx="12" class="box"/>
  <text x="82" y="209" class="bold">① 根のページ</text>
  <text x="82" y="248" class="small">題名の範囲から進む先を選ぶ</text>
  <path d="M320 277 L320 299" class="arrow"/>
  <rect x="60" y="300" width="520" height="105" rx="12" class="box"/>
  <text x="82" y="338" class="bold">② 途中の案内のページ</text>
  <text x="82" y="377" class="small">さらに狭い範囲を選ぶ</text>
  <path d="M320 406 L320 428" class="arrow"/>
  <rect x="60" y="429" width="520" height="105" rx="12" class="box"/>
  <text x="82" y="467" class="bold">③ 葉のページ</text>
  <text x="82" y="506" class="small">題名と、表の行の場所を見つける</text>
  <path d="M320 535 L320 602" class="arrow"/>
  <rect x="30" y="609" width="580" height="110" rx="12" class="hot"/>
  <text x="52" y="648" class="">④ 表のページ</text>
  <text x="52" y="688" class="small">見つけた場所から id と title を取り出す</text>
  <text x="30" y="763" class="small">索引3ページ ＋ 表1ページという経路の例。</text>
  <text x="30" y="797" class="small">hit / read の内訳を特定した図ではない。</text>
</svg>
