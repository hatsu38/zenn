<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" role="img"><title>同じ検索を、もう一度</title><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif}</style><rect width="640" height="530" fill="#fffdf7"/><g id="chapter-scene"><text x="28" y="43" font-size="27" fill="#25374b">同じ検索を、もう一度</text><text x="28" y="79" font-size="18" fill="#25374b">速さだけで、理由を決めない。</text><rect x="39" y="134" width="262" height="187" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><path d="M39 169 H301" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="53" y="159" font-size="17" fill="#25374b">題名で1冊を検索</text><path d="M170.0 321 v18 m-38 0 h76" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="205" font-size="26" fill="#25374b">同じSQL</text><text x="62" y="250" font-size="22" fill="#25374b">同じ1冊が返る</text><rect x="342" y="119" width="254" height="242" rx="10" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="363" y="156" font-size="23" fill="#25374b">観察ノート</text><text x="361" y="203" font-size="20" fill="#25374b">□ 処理の名前</text><text x="361" y="241" font-size="20" fill="#25374b">□ 調べた行数</text><text x="361" y="279" font-size="20" fill="#25374b">□ BUFFERS</text><text x="361" y="317" font-size="20" fill="#25374b">□ 実行時間</text><rect x="24" y="420" width="592" height="70" rx="10" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="43" y="463" font-size="21" fill="#25374b">時間が変わった。ほかの値はどうだろう？</text><text x="28" y="515" font-size="14" fill="#25374b">学ぶきっかけを描く絵 ／ 実行結果や内部配置の実測ではありません</text></g></svg>