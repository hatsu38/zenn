<svg xmlns="http://www.w3.org/2000/svg" width="640" height="664" viewBox="0 0 640 664" role="img" aria-labelledby="title">
  <title id="title">本の番号だけでは、題名が分からない</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}.model{fill:#566c7b}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
  </style>
  <rect width="640" height="664" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">本の番号だけでは、題名が分からない</text>
  <g id="screen">
    <rect x="24" y="72" width="592" height="240" rx="10" fill="#fff" stroke="#243b50" stroke-width="2.5"/>
    <path d="M24 110 H616" fill="none" stroke="#243b50" stroke-width="2.5"/>
    <text x="40" y="99" class="s">最新の読了記録</text>
    <g id="record-1">
      <rect x="80" y="124" width="360" height="40" rx="4" class="panel"/>
      <text x="102" y="152" class="s">本番号 2</text>
      <rect x="232" y="124" width="208" height="40" rx="4" class="hot"/>
      <text x="254" y="152" class="s b">題名 ？</text>
    </g>
    <g id="record-2">
      <rect x="80" y="172" width="360" height="40" rx="4" class="panel"/>
      <path d="M232 172 V212" fill="none" stroke="#cedae1" stroke-width="2"/>
      <text x="102" y="200" class="s">本番号 1</text>
      <text x="254" y="200" class="s">題名 ？</text>
    </g>
    <g id="record-3">
      <rect x="80" y="220" width="360" height="40" rx="4" class="panel"/>
      <path d="M232 220 V260" fill="none" stroke="#cedae1" stroke-width="2"/>
      <text x="102" y="248" class="s">本番号 2</text>
      <text x="254" y="248" class="s">題名 ？</text>
    </g>
    <text x="102" y="292" class="m">…20件</text>
    <path d="M320 312 V328 M280 328 H360" fill="none" stroke="#243b50" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g id="books">
    <rect x="24" y="376" width="592" height="188" rx="10" class="page"/>
    <text x="80" y="408" class="s b">本の表 books（100万冊）</text>
    <rect x="80" y="424" width="360" height="40" rx="4" class="row"/>
    <text x="102" y="452" class="s">1　星の図鑑</text>
    <rect x="80" y="472" width="360" height="40" rx="4" class="row"/>
    <text x="102" y="500" class="s">2　海の図鑑</text>
    <text x="108" y="544" text-anchor="middle" class="b">⋮</text>
  </g>
  <g id="lookup">
    <path d="M80 144 H60 Q48 144 48 156 V480 Q48 492 60 492 H80" class="ref"/>
    <text x="64" y="356" class="s">番号で探す</text>
  </g>
  <rect x="24" y="584" width="592" height="60" rx="10" fill="#fff0d3" stroke="#243b50" stroke-width="2.5"/>
  <text x="44" y="623" class="b">番号から、どうやって題名を付ける？</text>
</svg>
