<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" role="img"><title>本の番号だけでは、題名が分からない</title><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif}</style><rect width="640" height="530" fill="#fffdf7"/><g id="chapter-scene"><text x="28" y="43" font-size="27" fill="#25374b">本の番号だけでは、題名が分からない</text><text x="28" y="79" font-size="18" fill="#25374b">読了記録と、本の一覧を対応させたい。</text><rect x="32" y="127" width="240" height="221" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><path d="M32 162 H272" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="152" font-size="17" fill="#25374b">読了記録</text><path d="M152.0 348 v18 m-38 0 h76" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="52" y="180" width="201" height="36" rx="5" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="64" y="205" font-size="18" fill="#25374b">本番号2　9/14</text><rect x="52" y="223" width="201" height="36" rx="5" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="64" y="248" font-size="18" fill="#25374b">本番号1　9/15</text><rect x="52" y="266" width="201" height="36" rx="5" fill="#efedf5" stroke="#25374b" stroke-width="2.5"/><text x="64" y="291" font-size="18" fill="#25374b">本番号2　9/16</text><rect x="358" y="127" width="251" height="221" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><path d="M358 162 H609" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="372" y="152" font-size="17" fill="#25374b">本の一覧</text><path d="M483.5 348 v18 m-38 0 h76" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="378" y="180" width="211" height="36" rx="5" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="390" y="205" font-size="18" fill="#25374b">1　星の図鑑</text><rect x="378" y="223" width="211" height="36" rx="5" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="390" y="248" font-size="18" fill="#25374b">2　海の図鑑</text><text x="293" y="247" font-size="36" fill="#25374b">↔</text><rect x="24" y="420" width="592" height="70" rx="10" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="43" y="463" font-size="21" fill="#25374b">同じ本の番号を、どう見つけて合わせる？</text><text x="28" y="515" font-size="14" fill="#25374b">学ぶきっかけを描く絵 ／ 実行結果や内部配置の実測ではありません</text></g></svg>