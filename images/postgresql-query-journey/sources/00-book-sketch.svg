<svg xmlns="http://www.w3.org/2000/svg" width="640" height="830" viewBox="0 0 640 830" role="img" aria-labelledby="title">
  <title id="title">この本で、一緒に調べること</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
  </style>
  <rect width="640" height="830" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">この本で、一緒に調べること</text>
  <g id="prologue">
    <rect x="24" y="72" width="592" height="72" rx="10" fill="#fff0d3" stroke="#243b50" stroke-width="2.5"/>
    <text x="44" y="101" class="m">序章</text>
    <text x="44" y="131" class="b">20冊のランキングが、なかなか出てこない</text>
  </g>
  <g id="chapter-1">
    <rect x="24" y="180" width="592" height="72" rx="10" class="hot"/>
    <text x="44" y="209" class="m">第1章</text>
    <text x="44" y="239" class="b"><tspan class="mono">EXPLAIN</tspan> で、SQLの中を見る</text>
  </g>
  <g id="mechanisms">
    <rect x="24" y="288" width="592" height="226" rx="12" class="step"/>
    <text x="44" y="320" class="s b">SQLの中の仕組み</text>
    <g id="card-search">
      <rect x="40" y="332" width="176" height="170" rx="10" class="panel"/>
      <text x="56" y="360" class="m">第2〜3章</text>
      <text x="56" y="389" class="b">探す</text>
      <circle cx="128" cy="414" r="12" fill="#fff" stroke="#243b50" stroke-width="2.5"/>
      <circle cx="88" cy="476" r="12" fill="#fff" stroke="#243b50" stroke-width="2.5"/>
      <circle cx="168" cy="476" r="12" fill="#fff" stroke="#243b50" stroke-width="2.5"/>
      <path d="M121.5 424.1 L94.5 465.9 M134.5 424.1 L161.5 465.9" fill="none" stroke="#243b50" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="card-sort">
      <rect x="232" y="332" width="176" height="170" rx="10" class="panel"/>
      <text x="248" y="360" class="m">第7〜8章</text>
      <text x="248" y="389" class="b">並べる</text>
      <rect x="264" y="400" width="34" height="28" rx="5" class="val"/>
      <text x="281" y="422" text-anchor="middle" class="s b">3</text>
      <rect x="264" y="432" width="34" height="28" rx="5" class="val"/>
      <text x="281" y="454" text-anchor="middle" class="s b">1</text>
      <rect x="264" y="464" width="34" height="28" rx="5" class="val"/>
      <text x="281" y="486" text-anchor="middle" class="s b">2</text>
      <rect x="342" y="400" width="34" height="28" rx="5" class="val"/>
      <text x="359" y="422" text-anchor="middle" class="s b">1</text>
      <rect x="342" y="432" width="34" height="28" rx="5" class="val"/>
      <text x="359" y="454" text-anchor="middle" class="s b">2</text>
      <rect x="342" y="464" width="34" height="28" rx="5" class="val"/>
      <text x="359" y="486" text-anchor="middle" class="s b">3</text>
      <text x="320" y="454" text-anchor="middle" class="b">→</text>
    </g>
    <g id="card-join">
      <rect x="424" y="332" width="176" height="170" rx="10" class="panel"/>
      <text x="440" y="360" class="m">第9章</text>
      <text x="440" y="389" class="b">組み合わせる</text>
      <circle cx="460" cy="414" r="7" fill="#243b50"/>
      <circle cx="460" cy="478" r="7" fill="#243b50"/>
      <path d="M467 414 H488 L520 446 H568 M467 478 H488 L520 446" fill="none" stroke="#243b50" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>
  <g id="foundation">
    <rect x="24" y="522" width="592" height="72" rx="10" class="step"/>
    <text x="44" y="551" class="m">第4〜6章</text>
    <text x="44" y="581" class="b">支える：ページ・メモリ・プロセス</text>
  </g>
  <g id="chapters-10-11">
    <rect x="24" y="630" width="592" height="72" rx="10" class="step"/>
    <text x="44" y="659" class="m">第10〜11章</text>
    <text x="44" y="689" class="b">計画の選び方・更新と保守</text>
  </g>
  <g id="chapter-12">
    <rect x="24" y="738" width="592" height="72" rx="10" fill="#fff0d3" stroke="#243b50" stroke-width="2.5"/>
    <text x="44" y="767" class="m">第12章</text>
    <text x="44" y="797" class="b">もう一度、ランキングへ</text>
  </g>
  <g id="steps">
    <path d="M309 148 V160 H298 L320 176 L342 160 H331 V148 Z" class="step"/>
    <path d="M309 256 V268 H298 L320 284 L342 268 H331 V256 Z" class="step"/>
    <path d="M309 598 V610 H298 L320 626 L342 610 H331 V598 Z" class="step"/>
    <path d="M309 706 V718 H298 L320 734 L342 718 H331 V706 Z" class="step"/>
  </g>
  <g id="magnifier">
    <circle cx="540" cy="288" r="26" fill="#fff" fill-opacity="0.6" stroke="#243b50" stroke-width="4"/>
    <path d="M559.8 268.2 L586.7 241.3" fill="none" stroke="#243b50" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
