<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1060" viewBox="0 0 640 1060" role="img"><title>本の読書体験：ランキングの疑問から、実験と仕組みを通して改善へ戻る</title><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif}path{stroke-linejoin:round;stroke-linecap:round}</style><rect width="640" height="1060" fill="#fffdf7"/><g id="illustration"><text x="32" y="46" font-size="29" fill="#25374b" font-weight="700">この本で、一緒に調べること</text><text x="32" y="80" font-size="18" fill="#25374b" font-weight="400">いつものSQLから、仕組みが見えてくる</text><rect x="28" y="106" width="584" height="165" rx="15" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><g transform="translate(53 145)"><circle cx="32" cy="25" r="23" fill="#f4d3b3" stroke="#25374b" stroke-width="3"/><path d="M9 22 Q5 -8 37 1 Q64 3 54 25 L44 12 Q24 20 9 22" fill="#25374b"/><path d="M0 106 Q-3 57 32 55 Q68 57 65 106" fill="#79b8c1" stroke="#25374b" stroke-width="3"/><circle cx="25" cy="26" r="2"/><circle cx="42" cy="26" r="2"/><path d="M28 38 Q34 44 40 37" fill="none" stroke="#25374b" stroke-width="2"/></g><g transform="translate(53 222) scale(0.7)"><path d="M0 4 Q25 -4 50 8 L50 70 Q23 56 0 65 Z" fill="#79b8c1" stroke="#25374b" stroke-width="3"/><path d="M50 8 Q74 -4 100 4 L100 65 Q75 56 50 70 Z" fill="#fff" stroke="#25374b" stroke-width="3"/><path d="M60 20 L89 16 M60 32 L89 28 M60 44 L89 40" stroke="#8fa8b5" stroke-width="3"/></g><text x="165" y="145" font-size="25" fill="#25374b" font-weight="700">20冊のランキング。</text><text x="165" y="184" font-size="21" fill="#25374b" font-weight="400">どうして、こんなに待つんだろう？</text><text x="165" y="226" font-size="18" fill="#25374b" font-weight="400">Indexを付ける？　先に数えておく？</text><text x="165" y="251" font-size="18" fill="#25374b" font-weight="400">まだ、選ぶ根拠がない。</text><path d="M320 280 q-7 18 0 35 m-9 -10 l9 10 9 -10" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round"/><text x="40" y="354" font-size="25" fill="#25374b" font-weight="700">まずは、小さなSQLで実験する</text><rect x="30" y="379" width="180" height="104" rx="15" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="47" y="414" font-size="23" fill="#25374b" font-weight="700">予想する</text><text x="47" y="453" font-size="18" fill="#25374b" font-weight="400">何行調べる？</text><rect x="230" y="379" width="180" height="104" rx="15" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="247" y="414" font-size="23" fill="#25374b" font-weight="700">動かす</text><text x="247" y="453" font-size="18" fill="#25374b" font-weight="400">SQLを試そう</text><rect x="430" y="379" width="180" height="104" rx="15" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="447" y="414" font-size="23" fill="#25374b" font-weight="700">見比べる</text><text x="447" y="453" font-size="18" fill="#25374b" font-weight="400">どこが違う？</text><path d="M320 490 q-7 18 0 35 m-9 -10 l9 10 9 -10" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round"/><text x="40" y="567" font-size="24" fill="#25374b" font-weight="700">SQLの中に、知っている仕組みがある</text><rect x="32" y="590" width="168" height="180" rx="15" fill="#fff" stroke="#25374b" stroke-width="2.5"/><path d="M115 635 L74 671 M115 635 L151 671" stroke="#25374b" stroke-width="3"/><circle cx="115" cy="627" r="12" fill="#79b8c1" stroke="#25374b" stroke-width="2"/><circle cx="74" cy="681" r="12" fill="#79b8c1" stroke="#25374b" stroke-width="2"/><circle cx="151" cy="681" r="12" fill="#79b8c1" stroke="#25374b" stroke-width="2"/><text x="47" y="743" font-size="21" fill="#25374b" font-weight="700">探す</text><rect x="236" y="590" width="168" height="180" rx="15" fill="#fff" stroke="#25374b" stroke-width="2.5"/><rect x="260" y="662" width="25" height="28" rx="3" fill="#e8b359" stroke="#25374b" stroke-width="2"/><rect x="299" y="641" width="25" height="49" rx="3" fill="#e8b359" stroke="#25374b" stroke-width="2"/><rect x="338" y="618" width="25" height="72" rx="3" fill="#e8b359" stroke="#25374b" stroke-width="2"/><text x="251" y="743" font-size="21" fill="#25374b" font-weight="700">並べる</text><rect x="440" y="590" width="168" height="180" rx="15" fill="#fff" stroke="#25374b" stroke-width="2.5"/><path d="M460 639 L482 639 L513 667 L579 667 M460 695 L482 695 L513 667" fill="none" stroke="#25374b" stroke-width="3"/><circle cx="460" cy="639" r="9" fill="#79b8c1"/><circle cx="460" cy="695" r="9" fill="#e8b359"/><text x="455" y="743" font-size="21" fill="#25374b" font-weight="700">組み合わせる</text><text x="48" y="813" font-size="20" fill="#25374b" font-weight="400">その下で支える、ページ・メモリ・プロセス。</text><path d="M320 830 q-7 18 0 35 m-9 -10 l9 10 9 -10" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round"/><rect x="28" y="883" width="584" height="119" rx="15" fill="#e4f0e4" stroke="#25374b" stroke-width="2.5"/><text x="53" y="922" font-size="26" fill="#25374b" font-weight="700">もう一度、ランキングへ。</text><text x="53" y="959" font-size="21" fill="#25374b" font-weight="400">「何が減るか」を確かめて、改善を選べる。</text><text x="32" y="1034" font-size="20" fill="#25374b" font-weight="400">予想 → 観察 → 検証を、自分の開発でも。</text></g></svg>