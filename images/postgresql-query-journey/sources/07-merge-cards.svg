<svg xmlns="http://www.w3.org/2000/svg" width="640" height="706" viewBox="0 0 640 706" role="img" aria-labelledby="title">
  <title id="title">4枚を、比較5回で並べる</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}.model{fill:#566c7b}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
.storage{fill:#ece7f5;stroke:#735f9f;stroke-width:2}.file{fill:#fff;stroke:#735f9f;stroke-width:2}
  .cmp{fill:#dfe5ea}
.swap{fill:#dcefe8;stroke:#243b50;stroke-width:4}
.big{font-size:56px;font-weight:700}
  </style>
  <rect width="640" height="706" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">4枚を、比較5回で並べる</text>
  <rect x="548" y="22" width="68" height="36" rx="18" class="model"/>
  <text x="582" y="47" text-anchor="middle" class="tag">模型</text>
  <g id="stage-1">
    <text x="24" y="110" class="b">1段目　二組に分けて比べる</text>
    <text x="24" y="156" class="s b">入力</text>
    <rect x="140" y="126" width="44" height="44" rx="6" class="val"/>
    <text x="162" y="157" text-anchor="middle" class="b">8</text>
    <rect x="196" y="126" width="44" height="44" rx="6" class="val"/>
    <text x="218" y="157" text-anchor="middle" class="b">3</text>
    <rect x="400" y="126" width="44" height="44" rx="6" class="val"/>
    <text x="422" y="157" text-anchor="middle" class="b">6</text>
    <rect x="456" y="126" width="44" height="44" rx="6" class="val"/>
    <text x="478" y="157" text-anchor="middle" class="b">1</text>
    <rect x="148" y="190" width="84" height="30" rx="15" class="cmp"/>
    <text x="190" y="213" text-anchor="middle" class="s b">比較1</text>
    <rect x="408" y="190" width="84" height="30" rx="15" class="cmp"/>
    <text x="450" y="213" text-anchor="middle" class="s b">比較2</text>
    <rect x="128" y="276" width="124" height="60" rx="10" class="panel"/>
    <rect x="388" y="276" width="124" height="60" rx="10" class="panel"/>
    <rect x="140" y="284" width="44" height="44" rx="6" class="val"/>
    <text x="162" y="315" text-anchor="middle" class="b">8</text>
    <rect x="196" y="284" width="44" height="44" rx="6" class="val"/>
    <text x="218" y="315" text-anchor="middle" class="b">3</text>
    <rect x="400" y="284" width="44" height="44" rx="6" class="val"/>
    <text x="422" y="315" text-anchor="middle" class="b">6</text>
    <rect x="456" y="284" width="44" height="44" rx="6" class="val"/>
    <text x="478" y="315" text-anchor="middle" class="b">1</text>
    <path d="M162 170 V182 H218 V170 M190 182 V190 M422 170 V182 H478 V170 M450 182 V190" class="leader"/>
    <text x="77" y="254" class="s b teal">並べる</text>
    <path d="M190 220 V273" class="flow"/>
    <path d="M450 220 V273" class="flow"/>
  </g>
  <g id="merge">
    <text x="24" y="378" class="b">2段目　先頭同士を比べて合流する</text>
    <rect x="100" y="394" width="44" height="44" rx="6" class="val"/>
    <text x="122" y="425" text-anchor="middle" class="b">8</text>
    <rect x="156" y="394" width="44" height="44" rx="6" class="val"/>
    <text x="178" y="425" text-anchor="middle" class="b">6</text>
    <rect x="108" y="458" width="84" height="30" rx="15" class="cmp"/>
    <text x="150" y="481" text-anchor="middle" class="s b">比較3</text>
    <rect x="236" y="394" width="44" height="44" rx="6" class="val"/>
    <text x="258" y="425" text-anchor="middle" class="b">3</text>
    <rect x="292" y="394" width="44" height="44" rx="6" class="val"/>
    <text x="314" y="425" text-anchor="middle" class="b">6</text>
    <rect x="244" y="458" width="84" height="30" rx="15" class="cmp"/>
    <text x="286" y="481" text-anchor="middle" class="s b">比較4</text>
    <rect x="372" y="394" width="44" height="44" rx="6" class="val"/>
    <text x="394" y="425" text-anchor="middle" class="b">3</text>
    <rect x="428" y="394" width="44" height="44" rx="6" class="val"/>
    <text x="450" y="425" text-anchor="middle" class="b">1</text>
    <rect x="380" y="458" width="84" height="30" rx="15" class="cmp"/>
    <text x="422" y="481" text-anchor="middle" class="s b">比較5</text>
    <rect x="536" y="394" width="44" height="44" rx="6" class="val"/>
    <text x="558" y="425" text-anchor="middle" class="b">1</text>
    <text x="558" y="481" text-anchor="middle" class="m">そのまま</text>
    <rect x="112" y="544" width="484" height="60" rx="10" class="panel"/>
    <text x="24" y="582" class="s b">出力</text>
    <rect x="128" y="552" width="44" height="44" rx="6" class="val"/>
    <text x="150" y="583" text-anchor="middle" class="b">8</text>
    <rect x="264" y="552" width="44" height="44" rx="6" class="val"/>
    <text x="286" y="583" text-anchor="middle" class="b">6</text>
    <rect x="400" y="552" width="44" height="44" rx="6" class="val"/>
    <text x="422" y="583" text-anchor="middle" class="b">3</text>
    <rect x="536" y="552" width="44" height="44" rx="6" class="val"/>
    <text x="558" y="583" text-anchor="middle" class="b">1</text>
    <path d="M122 438 V450 H178 V438 M150 450 V458 M258 438 V450 H314 V438 M286 450 V458 M394 438 V450 H450 V438 M422 450 V458 M558 438 V458" class="leader"/>
    <text x="59" y="532" class="s b teal">出す</text>
    <path d="M150 488 V541" class="flow"/>
    <path d="M286 488 V541" class="flow"/>
    <path d="M422 488 V541" class="flow"/>
    <path d="M558 488 V541" class="flow"/>
  </g>
  <g id="count">
    <rect x="24" y="632" width="332" height="50" rx="6" class="hot"/>
    <text x="40" y="665" class="b">この4枚なら 比較5回・2段</text>
  </g>
</svg>
