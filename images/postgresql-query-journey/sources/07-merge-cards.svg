<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="885" viewBox="0 0 640 885" role="img" aria-labelledby="title description">
  

  <title id="title">二つの並びを、比べながら合流する</title>
  <desc id="description">比較の模型 ／ PostgreSQLの実装そのものではない</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="885" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">二つの並びを、比べながら合流する</text>
  <text x="28" y="82" class="muted" text-anchor="start">比較の模型 ／ PostgreSQLの実装そのものではない</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="230" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">① それぞれ大きい順に並んだ二組</text>
    <rect x="65" y="184" width="96" height="60" rx="9" class="hot"/>
    <text x="113.0" y="224.0" class="value" text-anchor="middle">8</text>
    <rect x="179" y="184" width="96" height="60" rx="9" class="card"/>
    <text x="227.0" y="224.0" class="value" text-anchor="middle">3</text>
    <rect x="369" y="184" width="96" height="60" rx="9" class="hot"/>
    <text x="417.0" y="224.0" class="value" text-anchor="middle">6</text>
    <rect x="483" y="184" width="96" height="60" rx="9" class="card"/>
    <text x="531.0" y="224.0" class="value" text-anchor="middle">1</text>
    <text x="320" y="307" class="bold" text-anchor="middle">先頭の8と6を比較</text>
    <rect x="20" y="365" width="600" height="230" rx="18" class="panel"/>
    <text x="40" y="405" class="bold" text-anchor="start">② 大きい8を出し、次は3と6を比較</text>
    <rect x="179" y="441" width="96" height="60" rx="9" class="hot"/>
    <text x="227.0" y="481.0" class="value" text-anchor="middle">3</text>
    <rect x="369" y="441" width="96" height="60" rx="9" class="hot"/>
    <text x="417.0" y="481.0" class="value" text-anchor="middle">6</text>
    <rect x="483" y="441" width="96" height="60" rx="9" class="card"/>
    <text x="531.0" y="481.0" class="value" text-anchor="middle">1</text>
    <rect x="44" y="520" width="550" height="54" rx="12" class="paper"/>
    <text x="319.0" y="555" class="" text-anchor="middle">出力済み：8</text>
    <rect x="20" y="620" width="600" height="230" rx="18" class="panel"/>
    <text x="40" y="660" class="bold" text-anchor="start">③ 同じ操作を繰り返す</text>
    <rect x="100" y="700" width="96" height="60" rx="9" class="card"/>
    <text x="148.0" y="740.0" class="value" text-anchor="middle">8</text>
    <rect x="214" y="700" width="96" height="60" rx="9" class="card"/>
    <text x="262.0" y="740.0" class="value" text-anchor="middle">6</text>
    <rect x="328" y="700" width="96" height="60" rx="9" class="card"/>
    <text x="376.0" y="740.0" class="value" text-anchor="middle">3</text>
    <rect x="442" y="700" width="96" height="60" rx="9" class="card"/>
    <text x="490.0" y="740.0" class="value" text-anchor="middle">1</text>
    <text x="44" y="813" class="small" text-anchor="start">先頭同士を比べながら、一つの並びへ</text>
  </g>
</svg>
