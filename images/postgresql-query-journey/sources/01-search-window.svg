<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" role="img"><title>まずは、1冊だけ探してみる</title><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif}</style><rect width="640" height="530" fill="#fffdf7"/><g id="chapter-scene"><text x="28" y="43" font-size="27" fill="#25374b">まずは、1冊だけ探してみる</text><text x="28" y="79" font-size="18" fill="#25374b">画面の結果から、SQLの内側へ。</text><rect x="38" y="128" width="340" height="210" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><path d="M38 163 H378" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="153" font-size="17" fill="#25374b">読書ノート / 本を探す</text><path d="M208.0 338 v18 m-38 0 h76" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="57" y="182" width="300" height="42" rx="10" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="70" y="210" font-size="22" fill="#25374b">実験用の本 42</text><text x="62" y="264" font-size="21" fill="#25374b">検索結果：1冊</text><text x="62" y="303" font-size="21" fill="#25374b">42　実験用の本 42</text><g transform="translate(463 180)"><circle cx="25" cy="24" r="21" fill="#f4d3b3" stroke="#25374b" stroke-width="2.5"/><path d="M4 20 Q0 -3 27 2 Q48 1 46 20" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="24" r="2"/><circle cx="32" cy="24" r="2"/><path d="M19 34 Q26 40 32 34" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 98 Q-4 54 25 52 Q54 54 52 98" fill="#79b8c1" stroke="#25374b" stroke-width="2.5"/></g><circle cx="440" cy="289" r="30" fill="#e9f3f4" fill-opacity=".75" stroke="#25374b" stroke-width="5"/><path d="M463 312 l30 30" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="420" width="592" height="70" rx="10" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="43" y="463" font-size="21" fill="#25374b">1冊が返るまでに、何冊を調べた？</text><text x="28" y="515" font-size="14" fill="#25374b">学ぶきっかけを描く絵 ／ 実行結果や内部配置の実測ではありません</text></g></svg>