<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="815" viewBox="0 0 640 815" role="img" aria-labelledby="title description">
  

  <title id="title">入口の見積もりが、後ろの判断に響く</title>
  <desc id="description">推定と実測のずれの説明例 ／ 実測ログではない</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="815" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">入口の見積もりが、後ろの判断に響く</text>
  <text x="28" y="82" class="muted" text-anchor="start">推定と実測のずれの説明例 ／ 実測ログではない</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="295" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">見積もりでは1行。実際は10万行。</text>
    <text x="48" y="208" class="bold" text-anchor="start">推定</text>
    <rect x="150" y="175" width="10" height="49" rx="3" class="box"/>
    <text x="180" y="208" class="small" text-anchor="start">1行</text>
    <text x="48" y="298" class="bold" text-anchor="start">実際</text>
    <rect x="150" y="267" width="390" height="11" rx="3" class="card"/>
    <rect x="150" y="284" width="390" height="11" rx="3" class="card"/>
    <rect x="150" y="301" width="390" height="11" rx="3" class="card"/>
    <rect x="150" y="318" width="390" height="11" rx="3" class="card"/>
    <rect x="150" y="335" width="390" height="11" rx="3" class="card"/>
    <text x="48" y="379" class="small" text-anchor="start">件数差の模型（帯の幅は縮尺ではない）</text>
    <path d="M320 417 L320 460" class="arrow"/>
    <rect x="20" y="475" width="600" height="300" rx="18" class="panel"/>
    <text x="40" y="515" class="bold" text-anchor="start">後続の処理にも、行が多く渡る</text>
    <rect x="45" y="551" width="550" height="54" rx="12" class="box"/>
    <text x="320.0" y="586" class="" text-anchor="middle">Nested Loop：内側を繰り返し探す</text>
    <path d="M320 612 L320 646" class="arrow"/>
    <rect x="45" y="663" width="550" height="54" rx="12" class="box"/>
    <text x="320.0" y="698" class="" text-anchor="middle">Sort：想定より多くの行を並べる</text>
  </g>
</svg>
