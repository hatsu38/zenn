<svg xmlns="http://www.w3.org/2000/svg" width="640" height="576" viewBox="0 0 640 576" role="img" aria-labelledby="title">
  <title id="title">外側の行ごとに、内側を1回たどる</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}.model{fill:#566c7b}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
  </style>
  <rect width="640" height="576" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">外側の行ごとに、内側を1回たどる</text>
  <rect x="548" y="22" width="68" height="36" rx="18" class="model"/>
  <text x="582" y="47" text-anchor="middle" class="tag">模型</text>

  <g id="iteration-1">
    <text x="24" y="112" class="b">① 1件目：本2を探す</text>
    <rect x="24" y="134" width="120" height="48" rx="4" class="row"/>
    <text x="84" y="165" text-anchor="middle" class="s">本2</text>
    <rect x="230" y="134" width="200" height="48" rx="10" class="panel"/>
    <text x="330" y="165" text-anchor="middle" class="s b">本のIndex</text>
    <rect x="480" y="134" width="136" height="48" rx="4" class="match"/>
    <text x="548" y="165" text-anchor="middle" class="s">海の図鑑</text>
    <path d="M144 158 H230" class="ref"/>
    <path d="M430 158 H480" class="flow"/>
  </g>

  <g id="iteration-2">
    <text x="24" y="222" class="b">② 2件目：本1を探す</text>
    <rect x="24" y="244" width="120" height="48" rx="4" class="row"/>
    <text x="84" y="275" text-anchor="middle" class="s">本1</text>
    <rect x="230" y="244" width="200" height="48" rx="10" class="panel"/>
    <text x="330" y="275" text-anchor="middle" class="s b">本のIndex</text>
    <rect x="480" y="244" width="136" height="48" rx="4" class="match"/>
    <text x="548" y="275" text-anchor="middle" class="s">星の図鑑</text>
    <path d="M144 268 H230" class="ref"/>
    <path d="M430 268 H480" class="flow"/>
  </g>

  <g id="iteration-3">
    <text x="24" y="332" class="b">③ 3件目：本2を探す</text>
    <rect x="24" y="354" width="120" height="48" rx="4" class="row"/>
    <text x="84" y="385" text-anchor="middle" class="s">本2</text>
    <rect x="230" y="354" width="200" height="48" rx="10" class="panel"/>
    <text x="330" y="385" text-anchor="middle" class="s b">本のIndex</text>
    <rect x="480" y="354" width="136" height="48" rx="4" class="match"/>
    <text x="548" y="385" text-anchor="middle" class="s">海の図鑑</text>
    <path d="M144 378 H230" class="ref"/>
    <path d="M430 378 H480" class="flow"/>
  </g>

  <g id="loop-count">
    <rect x="24" y="470" width="592" height="80" rx="12" class="hot"/>
    <text x="320" y="503" text-anchor="middle" class="b">外側3行＝内側3回</text>
    <text x="320" y="536" text-anchor="middle" class="mono">loops=3</text>
  </g>
</svg>
