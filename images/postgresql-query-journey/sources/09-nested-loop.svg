<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="940" viewBox="0 0 640 940" role="img" aria-labelledby="title description">
  

  <title id="title">記録を1件取り出すたびに、本を探す</title>
  <desc id="description">Nested Loopの模型 ／ キャッシュによる省略は示さない</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="940" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">記録を1件取り出すたびに、本を探す</text>
  <text x="28" y="82" class="muted" text-anchor="start">Nested Loopの模型 ／ キャッシュによる省略は示さない</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="245" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">1件目の記録に、題名を付ける</text>
    <rect x="44" y="193" width="225" height="54" rx="12" class="card"/>
    <text x="156.5" y="228" class="" text-anchor="middle">記録：本1</text>
    <rect x="372" y="193" width="225" height="54" rx="12" class="box"/>
    <text x="484.5" y="228" class="" text-anchor="middle">本1のIndex検索</text>
    <path d="M277 220 L362 220" class="arrow"/>
    <text x="45" y="311" class="teal" text-anchor="start">返す行：本1・星の図鑑</text>
    <rect x="20" y="385" width="600" height="245" rx="18" class="panel"/>
    <text x="40" y="425" class="bold" text-anchor="start">2件目の記録に、題名を付ける</text>
    <rect x="44" y="468" width="225" height="54" rx="12" class="card"/>
    <text x="156.5" y="503" class="" text-anchor="middle">記録：本1</text>
    <rect x="372" y="468" width="225" height="54" rx="12" class="box"/>
    <text x="484.5" y="503" class="" text-anchor="middle">本1のIndex検索</text>
    <path d="M277 495 L362 495" class="arrow"/>
    <text x="45" y="586" class="teal" text-anchor="start">返す行：本1・星の図鑑</text>
    <rect x="20" y="660" width="600" height="245" rx="18" class="panel"/>
    <text x="40" y="700" class="bold" text-anchor="start">3件目の記録に、題名を付ける</text>
    <rect x="44" y="743" width="225" height="54" rx="12" class="card"/>
    <text x="156.5" y="778" class="" text-anchor="middle">記録：本2</text>
    <rect x="372" y="743" width="225" height="54" rx="12" class="box"/>
    <text x="484.5" y="778" class="" text-anchor="middle">本2のIndex検索</text>
    <path d="M277 770 L362 770" class="arrow"/>
    <text x="45" y="861" class="teal" text-anchor="start">返す行：本2・海の図鑑</text>
  </g>
</svg>
