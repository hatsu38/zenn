<svg xmlns="http://www.w3.org/2000/svg" width="640" height="806" viewBox="0 0 640 806" role="img" aria-labelledby="title">
  <title id="title">基準の値で分けて並べる</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
.storage{fill:#ece7f5;stroke:#735f9f;stroke-width:2}.file{fill:#fff;stroke:#735f9f;stroke-width:2}
  .cmp{fill:#dfe5ea}
.swap{fill:#dcefe8;stroke:#243b50;stroke-width:4}
.big{font-size:56px;font-weight:700}
  </style>
  <rect width="640" height="806" fill="#f5f7f9"/>
  <text x="24" y="48" class="h">基準の値で分けて並べる</text>
  <g id="step-1">
    <text x="24" y="110" class="b">①　基準の6を選ぶ</text>
    <text x="24" y="160" class="s b">入力</text>
    <rect x="154" y="130" width="44" height="44" rx="6" class="val"/>
    <text x="176" y="161" text-anchor="middle" class="b">8</text>
    <rect x="250" y="130" width="44" height="44" rx="6" class="val"/>
    <text x="272" y="161" text-anchor="middle" class="b">3</text>
    <rect x="346" y="130" width="44" height="44" rx="6" class="hot"/>
    <text x="368" y="161" text-anchor="middle" class="b">6</text>
    <rect x="442" y="130" width="44" height="44" rx="6" class="val"/>
    <text x="464" y="161" text-anchor="middle" class="b">1</text>
    <text x="176" y="204" text-anchor="middle" class="m">先頭</text>
    <text x="368" y="204" text-anchor="middle" class="m">真ん中</text>
    <text x="464" y="204" text-anchor="middle" class="m">末尾</text>
  </g>
  <g id="step-2">
    <text x="24" y="256" class="b">②　6と比べて三つに分ける</text>
    <rect x="126" y="272" width="44" height="44" rx="6" class="val"/>
    <text x="148" y="303" text-anchor="middle" class="b">8</text>
    <rect x="182" y="272" width="44" height="44" rx="6" class="val"/>
    <text x="204" y="303" text-anchor="middle" class="b">6</text>
    <rect x="134" y="336" width="84" height="30" rx="15" class="cmp"/>
    <text x="176" y="359" text-anchor="middle" class="s b">比較1</text>
    <rect x="270" y="272" width="44" height="44" rx="6" class="val"/>
    <text x="292" y="303" text-anchor="middle" class="b">3</text>
    <rect x="326" y="272" width="44" height="44" rx="6" class="val"/>
    <text x="348" y="303" text-anchor="middle" class="b">6</text>
    <rect x="278" y="336" width="84" height="30" rx="15" class="cmp"/>
    <text x="320" y="359" text-anchor="middle" class="s b">比較2</text>
    <rect x="414" y="272" width="44" height="44" rx="6" class="val"/>
    <text x="436" y="303" text-anchor="middle" class="b">1</text>
    <rect x="470" y="272" width="44" height="44" rx="6" class="val"/>
    <text x="492" y="303" text-anchor="middle" class="b">6</text>
    <rect x="422" y="336" width="84" height="30" rx="15" class="cmp"/>
    <text x="464" y="359" text-anchor="middle" class="s b">比較3</text>
    <path d="M148 316 V328 H204 V316 M176 328 V336 M292 316 V328 H348 V316 M320 328 V336 M436 316 V328 H492 V316 M464 328 V336" class="leader"/>
    <rect x="126" y="430" width="68" height="60" rx="10" class="panel"/>
    <rect x="238" y="430" width="68" height="60" rx="10" class="panel"/>
    <rect x="348" y="430" width="128" height="60" rx="10" class="panel"/>
    <rect x="138" y="438" width="44" height="44" rx="6" class="val"/>
    <text x="160" y="469" text-anchor="middle" class="b">8</text>
    <rect x="250" y="438" width="44" height="44" rx="6" class="val"/>
    <text x="272" y="469" text-anchor="middle" class="b">6</text>
    <rect x="362" y="438" width="44" height="44" rx="6" class="val"/>
    <text x="384" y="469" text-anchor="middle" class="b">3</text>
    <rect x="418" y="438" width="44" height="44" rx="6" class="val"/>
    <text x="440" y="469" text-anchor="middle" class="b">1</text>
    <text x="160" y="520" text-anchor="middle" class="m">大きい側</text>
    <text x="272" y="520" text-anchor="middle" class="m">基準</text>
    <text x="412" y="520" text-anchor="middle" class="m">小さい側</text>
    <text x="40" y="404" class="s b teal">分ける</text>
    <path d="M176 366 L161 427" class="flow"/>
    <path d="M320 366 L382 427" class="flow"/>
    <path d="M464 366 L442 427" class="flow"/>
  </g>
  <g id="step-3">
    <text x="24" y="566" class="b">③　「3と1」を3で分ける</text>
    <rect x="126" y="582" width="68" height="60" rx="10" class="panel"/>
    <rect x="238" y="582" width="68" height="60" rx="10" class="panel"/>
    <rect x="348" y="582" width="128" height="60" rx="10" class="panel"/>
    <rect x="138" y="590" width="44" height="44" rx="6" class="val"/>
    <text x="160" y="621" text-anchor="middle" class="b">8</text>
    <rect x="250" y="590" width="44" height="44" rx="6" class="val"/>
    <text x="272" y="621" text-anchor="middle" class="b">6</text>
    <rect x="362" y="590" width="44" height="44" rx="6" class="hot"/>
    <text x="384" y="621" text-anchor="middle" class="b">3</text>
    <rect x="418" y="590" width="44" height="44" rx="6" class="val"/>
    <text x="440" y="621" text-anchor="middle" class="b">1</text>
    <path d="M476 612 H506" class="leader"/>
    <rect x="506" y="597" width="84" height="30" rx="15" class="cmp"/>
    <text x="548" y="620" text-anchor="middle" class="s b">比較4</text>
    <text x="160" y="670" text-anchor="middle" class="m">そのまま</text>
    <text x="272" y="670" text-anchor="middle" class="m">そのまま</text>
    <path d="M327 646 V719" class="flow"/>
    <text x="343" y="694" class="s b teal">左から読む</text>
    <text x="24" y="760" class="s b">出力</text>
    <rect x="112" y="722" width="376" height="60" rx="10" class="panel"/>
    <rect x="138" y="730" width="44" height="44" rx="6" class="val"/>
    <text x="160" y="761" text-anchor="middle" class="b">8</text>
    <rect x="250" y="730" width="44" height="44" rx="6" class="val"/>
    <text x="272" y="761" text-anchor="middle" class="b">6</text>
    <rect x="362" y="730" width="44" height="44" rx="6" class="val"/>
    <text x="384" y="761" text-anchor="middle" class="b">3</text>
    <rect x="418" y="730" width="44" height="44" rx="6" class="val"/>
    <text x="440" y="761" text-anchor="middle" class="b">1</text>
  </g>
</svg>
