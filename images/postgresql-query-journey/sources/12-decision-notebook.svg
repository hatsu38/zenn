<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" role="img"><title>今度は、根拠を持って選べる</title><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif}</style><rect width="640" height="530" fill="#fffdf7"/><g id="chapter-scene"><text x="28" y="43" font-size="27" fill="#25374b">今度は、根拠を持って選べる</text><text x="28" y="79" font-size="18" fill="#25374b">序章のランキングへ、もう一度。</text><rect x="32" y="148" width="226" height="211" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><path d="M32 183 H258" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="173" font-size="17" fill="#25374b">今週の人気20冊</text><path d="M145.0 359 v18 m-38 0 h76" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="218" font-size="18" fill="#25374b">1　実験用の本 …</text><text x="52" y="258" font-size="18" fill="#25374b">2　実験用の本 …</text><text x="52" y="298" font-size="18" fill="#25374b">3　実験用の本 …</text><rect x="305" y="116" width="303" height="271" rx="10" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="332" y="157" font-size="25" fill="#25374b">改善案の調査メモ</text><text x="328" y="207" font-size="21" fill="#25374b">□ 結果は同じ？</text><text x="328" y="247" font-size="21" fill="#25374b">□ 何が減った？</text><text x="328" y="287" font-size="21" fill="#25374b">□ 鮮度は足りる？</text><text x="328" y="327" font-size="21" fill="#25374b">□ 更新の負担は？</text><rect x="24" y="420" width="592" height="70" rx="10" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="43" y="463" font-size="21" fill="#25374b">速さと、サービスの要件を一緒に考える。</text><text x="28" y="515" font-size="14" fill="#25374b">学ぶきっかけを描く絵 ／ 実行結果や内部配置の実測ではありません</text></g></svg>