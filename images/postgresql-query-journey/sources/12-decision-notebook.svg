<svg xmlns="http://www.w3.org/2000/svg" width="640" height="710" viewBox="0 0 640 710" role="img" aria-labelledby="title">
  <title id="title">今度は、根拠を持って選べる</title>
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#277b74"/></marker>
    <marker id="req" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#945e11" stroke-width="2"/></marker>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7d93a3"/></marker>
  </defs>
  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50}
.h{font-size:30px;font-weight:700}.b{font-weight:700}.s{font-size:22px}.m{font-size:22px;fill:#566c7b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.tag{font-size:22px;font-weight:700;fill:#fff}
.teal{fill:#176e65}.brown{fill:#945e11}.real{fill:#176e65}.model{fill:#566c7b}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2}.node{fill:#ecf2f8;stroke:#56738a;stroke-width:2}
.row{fill:#fff;stroke:#448b7c;stroke-width:2}.match{fill:#fff;stroke:#176e65;stroke-width:4}
.page{fill:#f7fbf9;stroke:#6d9f94;stroke-width:2}.ipage{fill:#f4f6f8;stroke:#6b7f8e;stroke-width:2}
.band{fill:#d5dde3;stroke:#92a7b5;stroke-width:2}.skip{fill:none;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.hot{fill:#fff0d5;stroke:#b88020;stroke-width:4}.ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5}
.flow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#flow)}.req{fill:none;stroke:#945e11;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#req)}
.ref{fill:none;stroke:#7d93a3;stroke-width:2;marker-end:url(#ref)}.step{fill:#fff;stroke:#243b50;stroke-width:2.5}
.spine{fill:#e9f3f4;stroke:#243b50;stroke-width:1.5}
.work{fill:#fff;stroke:#56738a;stroke-width:2;stroke-dasharray:8 5}.val{fill:#dcefe8;stroke:#448b7c;stroke-width:2}.buffer{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2}
.route{fill:#f4f6f8;stroke:#243b50;stroke-width:3}.leader{fill:none;stroke:#56738a;stroke-width:2}
.storage{fill:#ece7f5;stroke:#735f9f;stroke-width:2}.file{fill:#fff;stroke:#735f9f;stroke-width:2}
  .cmp{fill:#dfe5ea}
.swap{fill:#dcefe8;stroke:#243b50;stroke-width:4}
.big{font-size:56px;font-weight:700}
  </style>
  <rect width="640" height="710" fill="#fffdf7"/>
  <text x="24" y="48" class="h">今度は、根拠を持って選べる</text>
  <g id="ranking-screen">
    <rect x="24" y="76" width="592" height="192" rx="10" fill="#fff" stroke="#243b50" stroke-width="2.5"/>
    <path d="M24 114 H616" fill="none" stroke="#243b50" stroke-width="2.5"/>
    <text x="40" y="103" class="s">今週よく読まれた本</text>
    <text x="58" y="148" class="s b">1</text>
    <text x="92" y="148" class="s">星の図鑑</text>
    <text x="404" y="148" text-anchor="end" class="s">12件</text>
    <text x="58" y="182" class="s b">2</text>
    <text x="92" y="182" class="s">海の図鑑</text>
    <text x="404" y="182" text-anchor="end" class="s">9件</text>
    <text x="58" y="216" class="s b">3</text>
    <text x="92" y="216" class="s">森の図鑑</text>
    <text x="404" y="216" text-anchor="end" class="s">7件</text>
    <text x="66" y="250" text-anchor="middle" class="b">⋮</text>
    <text x="92" y="250" class="m">20位まで</text>
  </g>
  <g id="notebook">
    <rect x="24" y="300" width="592" height="292" rx="10" class="panel"/>
    <text x="44" y="332" class="s b">調査メモ</text>
    <path d="M44 352 V572" class="panel"/>
    <path d="M344 352 V572" class="panel"/>
    <path d="M428 352 V572" class="panel"/>
    <path d="M512 352 V572" class="panel"/>
    <path d="M596 352 V572" class="panel"/>
    <path d="M44 352 H596" class="panel"/>
    <path d="M44 396 H596" class="panel"/>
    <path d="M44 440 H596" class="panel"/>
    <path d="M44 484 H596" class="panel"/>
    <path d="M44 528 H596" class="panel"/>
    <path d="M44 572 H596" class="panel"/>
    <text x="386" y="379" text-anchor="middle" class="s b">案1</text>
    <text x="470" y="379" text-anchor="middle" class="s b">案2</text>
    <text x="554" y="379" text-anchor="middle" class="s b">案3</text>
    <text x="56" y="423" class="s">結果は同じ？</text>
    <text x="56" y="467" class="s">何が減る？</text>
    <text x="56" y="511" class="s">鮮度は？</text>
    <text x="56" y="555" class="s">更新の負担は？</text>
  </g>
  <rect x="24" y="624" width="592" height="60" rx="10" fill="#fff0d3" stroke="#243b50" stroke-width="2.5"/>
  <text x="44" y="663" class="b">20冊のランキングなのに、なぜ待たされる？</text>
</svg>
