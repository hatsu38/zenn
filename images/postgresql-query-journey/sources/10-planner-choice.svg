<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" role="img"><title>索引があるのに、なぜ使わない？</title><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif}</style><rect width="640" height="530" fill="#fffdf7"/><g id="chapter-scene"><text x="28" y="43" font-size="27" fill="#25374b">索引があるのに、なぜ使わない？</text><text x="28" y="79" font-size="18" fill="#25374b">扱う行数を予想して、方法を選ぶ。</text><g transform="translate(286 151)"><circle cx="25" cy="24" r="21" fill="#f4d3b3" stroke="#25374b" stroke-width="2.5"/><path d="M4 20 Q0 -3 27 2 Q48 1 46 20" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="24" r="2"/><circle cx="32" cy="24" r="2"/><path d="M19 34 Q26 40 32 34" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 98 Q-4 54 25 52 Q54 54 52 98" fill="#79b8c1" stroke="#25374b" stroke-width="2.5"/></g><path d="M311 275 L167 328 M311 275 L473 328" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="301" width="219" height="80" rx="10" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="59" y="349" font-size="23" fill="#25374b">索引から探す</text><rect x="388" y="301" width="220" height="80" rx="10" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="416" y="349" font-size="23" fill="#25374b">表を順に読む</text><rect x="100" y="110" width="430" height="48" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><text x="130" y="142" font-size="21" fill="#25374b">条件に合うのは、少数？ 大部分？</text><rect x="24" y="420" width="592" height="70" rx="10" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="43" y="463" font-size="21" fill="#25374b">予想した行数と、実際の行数を比べよう。</text><text x="28" y="515" font-size="14" fill="#25374b">学ぶきっかけを描く絵 ／ 実行結果や内部配置の実測ではありません</text></g></svg>