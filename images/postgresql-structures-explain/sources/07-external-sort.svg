<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="995" viewBox="0 0 640 995" role="img" aria-labelledby="title description">
  

  <title id="title">メモリに収まらないときの並べ替え</title>
  <desc id="description">外部ソートの模型 ／ まとまりの個数・容量は模式的</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="995" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">メモリに収まらないときの並べ替え</text>
  <text x="28" y="82" class="muted" text-anchor="start">外部ソートの模型 ／ まとまりの個数・容量は模式的</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="265" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">① メモリに入る分だけ並べる</text>
    <rect x="44" y="182" width="284" height="130" rx="12" class="memory"/>
    <text x="62" y="217" class="small" text-anchor="start">メモリ：2行分</text>
    <rect x="66" y="236" width="100" height="60" rx="9" class="card"/>
    <text x="116.0" y="276.0" class="value" text-anchor="middle">8</text>
    <rect x="184" y="236" width="100" height="60" rx="9" class="card"/>
    <text x="234.0" y="276.0" class="value" text-anchor="middle">3</text>
    <text x="366" y="217" class="small" text-anchor="start">次の入力</text>
    <rect x="366" y="236" width="100" height="60" rx="9" class="card"/>
    <text x="416.0" y="276.0" class="value" text-anchor="middle">6</text>
    <rect x="484" y="236" width="100" height="60" rx="9" class="card"/>
    <text x="534.0" y="276.0" class="value" text-anchor="middle">1</text>
    <text x="46" y="348" class="small" text-anchor="start">全体が収まらなければ、分けて処理</text>
    <path d="M320 384 L320 426" class="arrow"/>
    <rect x="20" y="445" width="600" height="235" rx="18" class="panel"/>
    <text x="40" y="485" class="bold" text-anchor="start">② 並んだまとまりを一時ファイルへ</text>
    <rect x="48" y="518" width="242" height="54" rx="12" class="box"/>
    <text x="169.0" y="553" class="" text-anchor="middle">まとまりA：8・3</text>
    <rect x="350" y="518" width="242" height="54" rx="12" class="box"/>
    <text x="471.0" y="553" class="" text-anchor="middle">まとまりB：6・1</text>
    <text x="45" y="631" class="small" text-anchor="start">後続のまとまりも、同じように保存</text>
    <path d="M320 686 L320 733" class="arrow"/>
    <rect x="20" y="750" width="600" height="210" rx="18" class="panel"/>
    <text x="40" y="790" class="bold" text-anchor="start">③ 少しずつ読み、比較して合流</text>
    <rect x="85" y="825" width="100" height="60" rx="9" class="card"/>
    <text x="135.0" y="865.0" class="value" text-anchor="middle">8</text>
    <rect x="204" y="825" width="100" height="60" rx="9" class="card"/>
    <text x="254.0" y="865.0" class="value" text-anchor="middle">6</text>
    <rect x="323" y="825" width="100" height="60" rx="9" class="card"/>
    <text x="373.0" y="865.0" class="value" text-anchor="middle">3</text>
    <rect x="442" y="825" width="100" height="60" rx="9" class="card"/>
    <text x="492.0" y="865.0" class="value" text-anchor="middle">1</text>
    <text x="44" y="928" class="small" text-anchor="start">一時ファイルへの書き込み・読み込みが加わる</text>
  </g>
</svg>
