<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" role="img"><title>画面に欲しいのは、最新20件</title><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif}</style><rect width="640" height="530" fill="#fffdf7"/><g id="chapter-scene"><text x="28" y="43" font-size="27" fill="#25374b">画面に欲しいのは、最新20件</text><text x="28" y="79" font-size="18" fill="#25374b">表示しない記録は、調べなくてよい？</text><rect x="40" y="119" width="170" height="36" rx="5" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="52" y="144" font-size="18" fill="#25374b">9/20 …</text><rect x="40" y="162" width="170" height="36" rx="5" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="52" y="187" font-size="18" fill="#25374b">9/19 …</text><rect x="40" y="205" width="170" height="36" rx="5" fill="#efedf5" stroke="#25374b" stroke-width="2.5"/><text x="52" y="230" font-size="18" fill="#25374b">9/18 …</text><rect x="40" y="248" width="170" height="36" rx="5" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="52" y="273" font-size="18" fill="#25374b">9/17 …</text><rect x="40" y="291" width="170" height="36" rx="5" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="52" y="316" font-size="18" fill="#25374b">9/16 …</text><rect x="355" y="123" width="242" height="237" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><path d="M355 158 H597" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="369" y="148" font-size="17" fill="#25374b">最近の読了記録</text><path d="M476.0 360 v18 m-38 0 h76" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="384" y="197" font-size="22" fill="#25374b">表示するのは</text><text x="407" y="246" font-size="39" fill="#25374b">20件</text><text x="378" y="307" font-size="18" fill="#25374b">残りの順位は不要</text><path d="M228 225 L341 225" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M331 218 L341 225 L331 232" fill="none" stroke="#25374b" stroke-width="3"/><rect x="24" y="420" width="592" height="70" rx="10" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="43" y="463" font-size="21" fill="#25374b">「返す20件」と「調べる件数」は同じ？</text><text x="28" y="515" font-size="14" fill="#25374b">学ぶきっかけを描く絵 ／ 実行結果や内部配置の実測ではありません</text></g></svg>