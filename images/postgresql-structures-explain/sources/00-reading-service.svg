<svg xmlns="http://www.w3.org/2000/svg" width="640" height="995" viewBox="0 0 640 995" role="img"><title>架空の読書記録サービス：読了を記録し、週間ランキングを見る</title><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif}path{stroke-linejoin:round;stroke-linecap:round}</style><rect width="640" height="995" fill="#fffdf7"/><g id="illustration"><text x="32" y="47" font-size="27" fill="#25374b" font-weight="700">こんな読書記録サービスを作ります</text><text x="32" y="80" font-size="18" fill="#25374b" font-weight="400">本を探す。読み終えたら残す。みんなの記録を見る。</text><g transform="translate(45 128)"><circle cx="32" cy="25" r="23" fill="#f4d3b3" stroke="#25374b" stroke-width="3"/><path d="M9 22 Q5 -8 37 1 Q64 3 54 25 L44 12 Q24 20 9 22" fill="#25374b"/><path d="M0 106 Q-3 57 32 55 Q68 57 65 106" fill="#79b8c1" stroke="#25374b" stroke-width="3"/><circle cx="25" cy="26" r="2"/><circle cx="42" cy="26" r="2"/><path d="M28 38 Q34 44 40 37" fill="none" stroke="#25374b" stroke-width="2"/></g><g transform="translate(44 206) scale(0.8)"><path d="M0 4 Q25 -4 50 8 L50 70 Q23 56 0 65 Z" fill="#79b8c1" stroke="#25374b" stroke-width="3"/><path d="M50 8 Q74 -4 100 4 L100 65 Q75 56 50 70 Z" fill="#fff" stroke="#25374b" stroke-width="3"/><path d="M60 20 L89 16 M60 32 L89 28 M60 44 L89 40" stroke="#8fa8b5" stroke-width="3"/></g><rect x="150" y="112" width="454" height="146" rx="15" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="176" y="150" font-size="24" fill="#25374b" font-weight="700">本を探して、読了を記録</text><text x="176" y="189" font-size="20" fill="#25374b" font-weight="400">「星の図鑑、読み終わった！」</text><text x="176" y="229" font-size="20" fill="#25374b" font-weight="400">9月14日　読了を記録する ✓</text><path d="M320 270 q-7 18 0 35 m-9 -10 l9 10 9 -10" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round"/><rect x="38" y="325" width="564" height="470" rx="15" fill="#fff" stroke="#25374b" stroke-width="2.5"/><text x="63" y="361" font-size="22" fill="#25374b" font-weight="700">読書ノート</text><path d="M38 382 H602" stroke="#25374b" stroke-width="2"/><text x="65" y="418" font-size="25" fill="#25374b" font-weight="700">今週よく読まれた本</text><text x="65" y="451" font-size="18" fill="#25374b" font-weight="400">読了記録の件数が多い順に、20冊</text><text x="66" y="522" font-size="25" fill="#25374b" font-weight="700">1</text><rect x="105" y="480" width="46" height="61" rx="3" fill="#79b8c1" stroke="#25374b" stroke-width="2"/><path d="M114 484 V536" stroke="#fff" stroke-width="2"/><text x="172" y="508" font-size="22" fill="#25374b" font-weight="700">星の図鑑</text><text x="172" y="536" font-size="16" fill="#25374b" font-weight="400">この本を読んだ記録</text><text x="507" y="516" font-size="21" fill="#25374b" font-weight="400">12件</text><text x="66" y="607" font-size="25" fill="#25374b" font-weight="700">2</text><rect x="105" y="565" width="46" height="61" rx="3" fill="#e8b359" stroke="#25374b" stroke-width="2"/><path d="M114 569 V621" stroke="#fff" stroke-width="2"/><text x="172" y="593" font-size="22" fill="#25374b" font-weight="700">海の図鑑</text><text x="172" y="621" font-size="16" fill="#25374b" font-weight="400">この本を読んだ記録</text><text x="507" y="601" font-size="21" fill="#25374b" font-weight="400">9件</text><text x="66" y="692" font-size="25" fill="#25374b" font-weight="700">3</text><rect x="105" y="650" width="46" height="61" rx="3" fill="#b6adc9" stroke="#25374b" stroke-width="2"/><path d="M114 654 V706" stroke="#fff" stroke-width="2"/><text x="172" y="678" font-size="22" fill="#25374b" font-weight="700">森の図鑑</text><text x="172" y="706" font-size="16" fill="#25374b" font-weight="400">この本を読んだ記録</text><text x="507" y="686" font-size="21" fill="#25374b" font-weight="400">7件</text><text x="65" y="767" font-size="17" fill="#25374b" font-weight="400">※ 同じ本の再読も、別の記録として数える</text><rect x="38" y="825" width="564" height="108" rx="15" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="63" y="864" font-size="23" fill="#25374b" font-weight="700">記録が増えたら、表示まで待つように。</text><text x="63" y="903" font-size="21" fill="#25374b" font-weight="400">返すのは20冊。裏では何件を調べている？</text><text x="38" y="970" font-size="17" fill="#25374b" font-weight="400">架空の画面イメージ。書名・件数は説明用です。</text></g></svg>