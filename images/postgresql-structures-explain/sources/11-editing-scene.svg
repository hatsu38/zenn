<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" role="img"><title>題名を直している間に、読まれたら？</title><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif}</style><rect width="640" height="530" fill="#fffdf7"/><g id="chapter-scene"><text x="28" y="43" font-size="27" fill="#25374b">題名を直している間に、読まれたら？</text><text x="28" y="79" font-size="18" fill="#25374b">二つの接続から、同じ本を見る。</text><g transform="translate(72 122)"><circle cx="25" cy="24" r="21" fill="#f4d3b3" stroke="#25374b" stroke-width="2.5"/><path d="M4 20 Q0 -3 27 2 Q48 1 46 20" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="24" r="2"/><circle cx="32" cy="24" r="2"/><path d="M19 34 Q26 40 32 34" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 98 Q-4 54 25 52 Q54 54 52 98" fill="#79b8c1" stroke="#25374b" stroke-width="2.5"/></g><g transform="translate(470 122)"><circle cx="25" cy="24" r="21" fill="#f4d3b3" stroke="#25374b" stroke-width="2.5"/><path d="M4 20 Q0 -3 27 2 Q48 1 46 20" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="24" r="2"/><circle cx="32" cy="24" r="2"/><path d="M19 34 Q26 40 32 34" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 98 Q-4 54 25 52 Q54 54 52 98" fill="#e8b359" stroke="#25374b" stroke-width="2.5"/></g><rect x="29" y="240" width="270" height="139" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><path d="M29 275 H299" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="43" y="265" font-size="17" fill="#25374b">接続A / 読んでいる</text><path d="M164.0 379 v18 m-38 0 h76" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="51" y="312" font-size="20" fill="#25374b">どの題名が見える？</text><rect x="341" y="240" width="270" height="139" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><path d="M341 275 H611" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="355" y="265" font-size="17" fill="#25374b">接続B / 書き換える</text><path d="M476.0 379 v18 m-38 0 h76" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="361" y="312" font-size="21" fill="#25374b">改訂版の本 42</text><text x="272" y="182" font-size="25" fill="#25374b">本42</text><rect x="24" y="420" width="592" height="70" rx="10" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="43" y="463" font-size="21" fill="#25374b">確定の前後で、見える値は変わる？</text><text x="28" y="515" font-size="14" fill="#25374b">学ぶきっかけを描く絵 ／ 実行結果や内部配置の実測ではありません</text></g></svg>