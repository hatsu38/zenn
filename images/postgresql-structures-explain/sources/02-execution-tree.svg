<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="870" viewBox="0 0 640 870" role="img" aria-labelledby="title description">
  

  <title id="title">計画の木を、行が上へ進む</title>
  <desc id="description">数字の小さい順に3件返す模型 ／ 本文の題名順と対応</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="870" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">計画の木を、行が上へ進む</text>
  <text x="28" y="82" class="muted" text-anchor="start">数字の小さい順に3件返す模型 ／ 本文の題名順と対応</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="670" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">行を返す向きと、要求する向き</text>
    <rect x="130" y="194" width="380" height="142" rx="12" class="box"/>
    <text x="152" y="229" class="bold" text-anchor="start">Limit：3行を返す</text>
    <rect x="152" y="255" width="68" height="60" rx="9" class="card"/>
    <text x="186.0" y="295.0" class="value" text-anchor="middle">1</text>
    <rect x="237" y="255" width="68" height="60" rx="9" class="card"/>
    <text x="271.0" y="295.0" class="value" text-anchor="middle">3</text>
    <rect x="322" y="255" width="68" height="60" rx="9" class="card"/>
    <text x="356.0" y="295.0" class="value" text-anchor="middle">6</text>
    <rect x="130" y="387" width="380" height="142" rx="12" class="box"/>
    <text x="152" y="422" class="bold" text-anchor="start">Sort：順に並べる</text>
    <rect x="152" y="448" width="68" height="60" rx="9" class="card"/>
    <text x="186.0" y="488.0" class="value" text-anchor="middle">1</text>
    <rect x="237" y="448" width="68" height="60" rx="9" class="card"/>
    <text x="271.0" y="488.0" class="value" text-anchor="middle">3</text>
    <rect x="322" y="448" width="68" height="60" rx="9" class="card"/>
    <text x="356.0" y="488.0" class="value" text-anchor="middle">6</text>
    <rect x="407" y="448" width="68" height="60" rx="9" class="card"/>
    <text x="441.0" y="488.0" class="value" text-anchor="middle">8</text>
    <rect x="130" y="580" width="380" height="142" rx="12" class="box"/>
    <text x="152" y="615" class="bold" text-anchor="start">Scan：行を読む</text>
    <rect x="152" y="641" width="68" height="60" rx="9" class="card"/>
    <text x="186.0" y="681.0" class="value" text-anchor="middle">8</text>
    <rect x="237" y="641" width="68" height="60" rx="9" class="card"/>
    <text x="271.0" y="681.0" class="value" text-anchor="middle">3</text>
    <rect x="322" y="641" width="68" height="60" rx="9" class="card"/>
    <text x="356.0" y="681.0" class="value" text-anchor="middle">6</text>
    <rect x="407" y="641" width="68" height="60" rx="9" class="card"/>
    <text x="441.0" y="681.0" class="value" text-anchor="middle">1</text>
    <path d="M98 635 L98 257" class="arrow"/>
    <text x="36" y="433" class="bold" text-anchor="start">行</text>
    <path d="M550 257 L550 635" class="arrow"/>
    <text x="567" y="433" class="small" text-anchor="start">要求</text>
    <text x="30" y="830" class="small" text-anchor="start">Sortは、先頭3行を決める前に入力を調べる。</text>
  </g>
</svg>
