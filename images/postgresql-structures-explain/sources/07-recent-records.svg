<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" role="img"><title>読み終えた順に、並べたい</title><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif}</style><rect width="640" height="530" fill="#fffdf7"/><g id="chapter-scene"><text x="28" y="43" font-size="27" fill="#25374b">読み終えた順に、並べたい</text><text x="28" y="79" font-size="18" fill="#25374b">登録されている並びと、日時順は別。</text><rect x="50" y="150" width="196" height="36" rx="5" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="62" y="175" font-size="18" fill="#25374b">9/16　本4</text><rect x="50" y="193" width="196" height="36" rx="5" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="62" y="218" font-size="18" fill="#25374b">9/14　本8</text><rect x="50" y="236" width="196" height="36" rx="5" fill="#efedf5" stroke="#25374b" stroke-width="2.5"/><text x="62" y="261" font-size="18" fill="#25374b">9/20　本2</text><text x="277" y="230" font-size="36" fill="#25374b">→</text><rect x="361" y="125" width="231" height="236" rx="10" fill="white" stroke="#25374b" stroke-width="2.5"/><path d="M361 160 H592" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="375" y="150" font-size="17" fill="#25374b">最近の読了記録</text><path d="M476.5 361 v18 m-38 0 h76" fill="none" stroke="#25374b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="381" y="181" width="191" height="36" rx="5" fill="#e9f3f4" stroke="#25374b" stroke-width="2.5"/><text x="393" y="206" font-size="18" fill="#25374b">9/20　本2</text><rect x="381" y="224" width="191" height="36" rx="5" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="393" y="249" font-size="18" fill="#25374b">9/16　本4</text><rect x="381" y="267" width="191" height="36" rx="5" fill="#efedf5" stroke="#25374b" stroke-width="2.5"/><text x="393" y="292" font-size="18" fill="#25374b">9/14　本8</text><rect x="24" y="420" width="592" height="70" rx="10" fill="#fff0d3" stroke="#25374b" stroke-width="2.5"/><text x="43" y="463" font-size="21" fill="#25374b">記録が50万件なら、どう並べよう？</text><text x="28" y="515" font-size="14" fill="#25374b">学ぶきっかけを描く絵 ／ 実行結果や内部配置の実測ではありません</text></g></svg>