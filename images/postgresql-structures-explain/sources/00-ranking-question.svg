<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="930" viewBox="0 0 640 930" role="img" aria-labelledby="title description">
  

  <title id="title">20冊を返すまでに、何をしている？</title>
  <desc id="description">処理量を調べる前の見取り図 ／ 行数の縮尺ではない</desc>
  

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#277b74"/>
    </marker>
  </defs>
  

  <style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:24px;fill:#243b50} .title{font-size:30px;font-weight:700} .bold{font-weight:700} .small{font-size:22px} .muted{fill:#566c7b;font-size:22px} .value{font-size:28px;font-weight:700} .teal{fill:#176e65;font-weight:700} .orange{fill:#945e11;font-weight:700}
.panel{fill:#fff;stroke:#cedae1;stroke-width:2} .box{fill:#ecf2f8;stroke:#a7bdcc;stroke-width:2} .memory{fill:#eaf6f1;stroke:#6d9f94;stroke-width:2} .card{fill:#dcefe8;stroke:#448b7c;stroke-width:2} .hot{fill:#fff0d5;stroke:#b88020;stroke-width:3} .paper{fill:#fff;stroke:#b2c5cc;stroke-width:1.5} .ghost{fill:#f5f7f9;stroke:#b5c2cc;stroke-width:2;stroke-dasharray:6 5} .edge{fill:none;stroke:#92a7b5;stroke-width:2.5} .arrow{fill:none;stroke:#277b74;stroke-width:3;marker-end:url(#a)}
</style>
  <rect width="640" height="930" fill="#f5f7f9"/>
  

  <text x="28" y="45" class="title" text-anchor="start">20冊を返すまでに、何をしている？</text>
  <text x="28" y="82" class="muted" text-anchor="start">処理量を調べる前の見取り図 ／ 行数の縮尺ではない</text>
  

  <g id="diagram">
    <rect x="20" y="110" width="600" height="260" rx="18" class="panel"/>
    <text x="40" y="150" class="bold" text-anchor="start">入力には、多くの読了記録</text>
    <rect x="52" y="180" width="220" height="11" rx="3" class="card"/>
    <rect x="52" y="197" width="220" height="11" rx="3" class="card"/>
    <rect x="52" y="214" width="220" height="11" rx="3" class="card"/>
    <rect x="52" y="231" width="220" height="11" rx="3" class="card"/>
    <rect x="52" y="248" width="220" height="11" rx="3" class="card"/>
    <rect x="52" y="265" width="220" height="11" rx="3" class="card"/>
    <rect x="52" y="282" width="220" height="11" rx="3" class="card"/>
    <rect x="52" y="299" width="220" height="11" rx="3" class="card"/>
    <rect x="355" y="180" width="220" height="11" rx="3" class="card"/>
    <rect x="355" y="197" width="220" height="11" rx="3" class="card"/>
    <rect x="355" y="214" width="220" height="11" rx="3" class="card"/>
    <rect x="355" y="231" width="220" height="11" rx="3" class="card"/>
    <rect x="355" y="248" width="220" height="11" rx="3" class="card"/>
    <rect x="355" y="265" width="220" height="11" rx="3" class="card"/>
    <rect x="355" y="282" width="220" height="11" rx="3" class="card"/>
    <rect x="355" y="299" width="220" height="11" rx="3" class="card"/>
    <text x="52" y="340" class="small" text-anchor="start">同じ本の記録も、別々の行</text>
    <path d="M320 377 L320 427" class="arrow"/>
    <rect x="20" y="440" width="600" height="230" rx="18" class="panel"/>
    <text x="40" y="480" class="bold" text-anchor="start">SQLが20冊を選ぶまで</text>
    <text x="52" y="520" class="bold" text-anchor="start">絞る・組み合わせる・数える・並べる</text>
    <text x="52" y="575" class="orange" text-anchor="start">どこで、何件を処理している？</text>
    <text x="52" y="619" class="small" text-anchor="start">いまの結果だけでは見えない</text>
    <path d="M320 677 L320 727" class="arrow"/>
    <rect x="20" y="740" width="600" height="160" rx="18" class="panel"/>
    <text x="40" y="780" class="bold" text-anchor="start">出力は20冊のランキング</text>
    <rect x="52" y="812" width="94" height="60" rx="9" class="card"/>
    <text x="99.0" y="852.0" class="value" text-anchor="middle">1位</text>
    <rect x="161" y="812" width="94" height="60" rx="9" class="card"/>
    <text x="208.0" y="852.0" class="value" text-anchor="middle">2位</text>
    <rect x="270" y="812" width="94" height="60" rx="9" class="card"/>
    <text x="317.0" y="852.0" class="value" text-anchor="middle">3位</text>
    <rect x="379" y="812" width="94" height="60" rx="9" class="card"/>
    <text x="426.0" y="852.0" class="value" text-anchor="middle">…</text>
    <rect x="488" y="812" width="94" height="60" rx="9" class="card"/>
    <text x="535.0" y="852.0" class="value" text-anchor="middle">20位</text>
  </g>
</svg>
